<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHIVORIX Internship Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--orange:#ff7a00;--purple:#6d28d9;--ink:#182033;--muted:#687386;--bg:#f5f7fb;--card:#fff;--line:#e8ebf2;--green:#12935b;--red:#d64242}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{min-height:100vh}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--orange),var(--purple));display:grid;place-items:center;color:#fff;font-weight:900}.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px}.top-actions{display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;background:#eee8ff;color:var(--purple);display:grid;place-items:center;font-weight:800}.btn{padding:10px 15px;border-radius:10px;font-weight:700}.btn-primary{background:linear-gradient(135deg,var(--orange),var(--purple));color:#fff}.btn-soft{background:#f0edff;color:var(--purple)}.btn-danger{background:#fff0f0;color:var(--red)}.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 70px)}.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{background:transparent;text-align:left;padding:12px 14px;border-radius:10px;color:#566174;font-weight:650}.nav button.active,.nav button:hover{background:#f1edff;color:var(--purple)}.main{padding:28px;max-width:1500px;width:100%;margin:auto}.page-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.page-head h1{margin:0 0 6px;font-size:27px}.muted{color:var(--muted)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 3px 15px rgba(20,30,50,.03)}.stat .label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}.stat .value{font-size:27px;font-weight:850;margin-top:8px}.progress{height:9px;background:#eceef3;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--orange),var(--purple));border-radius:99px}.journey{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:16px}.step{text-align:center;font-size:11px;color:var(--muted)}.dot{height:12px;width:12px;border-radius:50%;background:#dfe3eb;margin:0 auto 8px}.step.done .dot,.step.current .dot{background:var(--purple)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.badge{display:inline-flex;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800;background:#eef1f5;color:#586276}.badge.green{background:#e9f8f1;color:var(--green)}.badge.orange{background:#fff2e6;color:#c75b00}.badge.red{background:#ffeded;color:var(--red)}.form{display:grid;gap:14px}.form.two-col{grid-template-columns:1fr 1fr}.field{display:grid;gap:7px}.field label{font-size:12px;font-weight:750;color:#4d586a}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe3eb;border-radius:10px;padding:11px 12px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#9c7af0;box-shadow:0 0 0 3px #efeaff}.login-screen{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 10% 10%,#fff0df,transparent 30%),radial-gradient(circle at 90% 20%,#eee7ff,transparent 32%),var(--bg)}.login-box{width:min(960px,100%);display:grid;grid-template-columns:1.05fr .95fr;background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 20px 70px rgba(40,35,70,.12)}.login-art{padding:44px;background:linear-gradient(145deg,#25194d,#6d28d9 58%,#ff7a00);color:#fff}.login-art h1{font-size:42px;line-height:1.05;margin:20px 0}.login-art p{color:#eee8ff;line-height:1.7}.feature{display:flex;gap:10px;margin:17px 0}.login-form{padding:40px}.login-form h2{margin:0 0 7px}.tabs{display:flex;gap:5px;background:#f4f5f8;padding:5px;border-radius:10px;margin:20px 0}.tabs button{flex:1;padding:10px;border-radius:8px;background:transparent;color:var(--muted);font-weight:750}.tabs button.active{background:#fff;color:var(--purple);box-shadow:0 2px 7px #ddd}.alert{padding:11px 13px;border-radius:10px;background:#fff4e8;color:#9b5000;font-size:13px}.toast{position:fixed;right:22px;bottom:22px;background:#182033;color:#fff;padding:13px 16px;border-radius:10px;z-index:50;box-shadow:0 10px 30px #0002}.empty{text-align:center;padding:45px 15px;color:var(--muted)}.drop{border:1.5px dashed #cfd4df;padding:25px;border-radius:12px;text-align:center}.mobile-menu{display:none}.profile-head{display:flex;gap:16px;align-items:center}.big-avatar{width:68px;height:68px;border-radius:18px;background:linear-gradient(135deg,#ffe1c4,#e7dcff);display:grid;place-items:center;font-size:24px;font-weight:900;color:var(--purple)}@media(max-width:950px){.layout{grid-template-columns:1fr}.side{display:none}.mobile-menu{display:block}.stats{grid-template-columns:1fr 1fr}.login-box{grid-template-columns:1fr}.login-art{display:none}.main{padding:18px}.journey{grid-template-columns:repeat(4,1fr)}}@media(max-width:620px){.stats,.two,.form.two-col{grid-template-columns:1fr}.top{padding:0 13px}.brand span{display:none}.page-head{flex-direction:column}.journey{grid-template-columns:repeat(2,1fr)}.login-form{padding:25px}}
</style></head>
<body>
<div id="root"></div><div id="toast" class="toast hidden"></div>
<script>
const SUPABASE_URL='https://ueavgukmwlydxktekxdh.supabase.co';
const SUPABASE_KEY='sb_publishable_hEewEkvycotewQJbPlonGg_yCVxWWHk';
const OTP_URL=SUPABASE_URL+'/functions/v1/student-otp-login';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let state={user:null,profile:null,role:null,section:'dashboard',challenge:null,mode:'student'};
const sectors=['Artificial Intelligence & Machine Learning','Data Science & Data Analytics','Web Development','Software Development','Mobile App Development','Digital Marketing','Cyber Security','Cloud Computing','Graphic Design & UI/UX','Business & Management','Finance & Accounting','Human Resource','Education & Training','Research & Development','Social Work / NGO','Other'];
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3200)}
function initials(n='User'){return n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function login(){document.getElementById('root').innerHTML=`<div class="login-screen"><div class="login-box"><div class="login-art"><div class="brand"><div class="logo">S</div><div>SHIVORIX<small>INTERNSHIP PORTAL</small></div></div><h1>One portal.<br>Complete internship journey.</h1><p>Secure, structured and credit-based internship management for students, colleges and SHIVORIX administration.</p><div class="feature">✓ Multi-college access control</div><div class="feature">✓ Applications, training, attendance & credits</div><div class="feature">✓ Secure student document management</div><div class="feature">✓ Completion & certificate workflow</div></div><div class="login-form"><div class="brand"><div class="logo">S</div><div><b>SHIVORIX</b><small>Internship Management</small></div></div><div class="tabs"><button id="studentTab" class="active" onclick="setMode('student')">Student Login</button><button id="staffTab" onclick="setMode('staff')">Admin / Node Officer</button></div><div id="loginPanel"></div></div></div></div>`;renderLoginPanel()}
function setMode(m){state.mode=m;document.getElementById('studentTab').classList.toggle('active',m==='student');document.getElementById('staffTab').classList.toggle('active',m==='staff');renderLoginPanel()}
function renderLoginPanel(){const p=document.getElementById('loginPanel');if(state.mode==='student'){p.innerHTML=`<h2>Student login</h2><p class="muted">Use your university registration number and college roll number. OTP will be sent to the registered email.</p><div class="form" style="margin-top:20px"><div class="field"><label>University Registration No.</label><input id="reg" placeholder="Enter registration number"></div><div class="field"><label>College Roll No.</label><input id="roll" placeholder="Enter college roll number"></div><button class="btn btn-primary" onclick="sendOtp()">Continue with OTP</button><div id="loginMsg"></div></div>`}else{p.innerHTML=`<h2>Staff login</h2><p class="muted">Authorized SHIVORIX Admin and Node Officers only.</p><div class="form" style="margin-top:20px"><div class="field"><label>Email</label><input id="staffEmail" type="email" placeholder="Official email"></div><div class="field"><label>Password</label><input id="staffPass" type="password" placeholder="Password"></div><button class="btn btn-primary" onclick="staffLogin()">Secure Login</button><div class="alert">Staff accounts must be created and managed by SHIVORIX Admin.</div><div id="loginMsg"></div></div>`}}
async function sendOtp(){const reg=document.getElementById('reg').value.trim(),roll=document.getElementById('roll').value.trim(),m=document.getElementById('loginMsg');m.innerHTML='';if(!reg||!roll){m.innerHTML='<div class="alert">Both fields are required.</div>';return}try{const r=await fetch(OTP_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'start',registration_no:reg,roll_no:roll})});const d=await r.json();if(!r.ok)throw Error(d.error);state.challenge=d.challenge_id;document.getElementById('loginPanel').innerHTML=`<h2>Verify OTP</h2><p class="muted">OTP sent to <b>${esc(d.masked_email||'registered email')}</b>.</p><div class="form" style="margin-top:20px"><div class="field"><label>6-digit OTP</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="000000"></div><button class="btn btn-primary" onclick="verifyOtp()">Verify & Login</button><button class="btn btn-soft" onclick="renderLoginPanel()">Back</button><div id="loginMsg"></div></div>`}catch(e){m.innerHTML='<div class="alert">'+esc(e.message)+'</div>'}}
async function verifyOtp(){const otp=document.getElementById('otp').value.trim(),m=document.getElementById('loginMsg');try{const r=await fetch(OTP_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'verify',challenge_id:state.challenge,otp})});const d=await r.json();if(!r.ok)throw Error(d.error);await sb.auth.setSession(d.session);await boot();}catch(e){m.innerHTML='<div class="alert">'+esc(e.message)+'</div>'}}
async function staffLogin(){try{const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('staffEmail').value.trim(),password:document.getElementById('staffPass').value});if(error)throw error;await boot()}catch(e){document.getElementById('loginMsg').innerHTML='<div class="alert">'+esc(e.message)+'</div>'}}
async function boot(){const {data:{user}}=await sb.auth.getUser();if(!user){login();return}state.user=user;const {data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).single();if(error||!p){await sb.auth.signOut();login();return}state.profile=p;state.role=p.role;renderApp()}
function navItems(){if(state.role==='admin')return [['dashboard','Dashboard'],['students','Students'],['applications','Applications'],['colleges','Colleges'],['node','Node Officers'],['internships','Internships'],['documents','Documents'],['payments','Payments'],['training','Training'],['reports','Reports'],['audit','Audit Logs']];if(state.role==='node_officer')return [['dashboard','Dashboard'],['applications','Applications'],['students','My College Students'],['documents','Documents'],['progress','Progress'],['evaluations','Evaluations']];return [['dashboard','Dashboard'],['profile','My Profile'],['apply','Apply for Internship'],['application','My Application'],['internship','Internship Details'],['attendance','Attendance'],['activities','Activities'],['assignments','Assignments'],['project','Project & Report'],['documents','Documents'],['payment','Payment'],['evaluation','Evaluation'],['certificate','Certificate']];}
function renderApp(){document.getElementById('root').innerHTML=`<div class="app"><header class="top"><div class="brand"><button class="btn btn-soft mobile-menu" onclick="document.querySelector('.side').style.display='block'">☰</button><div class="logo">S</div><div><b>SHIVORIX</b><small>INTERNSHIP PORTAL</small></div></div><div class="top-actions"><button class="btn btn-soft" onclick="showNotifications()">🔔</button><div class="avatar">${initials(state.profile.full_name)}</div><button class="btn btn-danger" onclick="logout()">Logout</button></div></header><div class="layout"><aside class="side"><div class="muted" style="padding:8px 12px;font-size:11px;font-weight:800;text-transform:uppercase">${state.role.replace('_',' ')}</div><nav class="nav">${navItems().map(([id,label])=>`<button class="${state.section===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')}</nav></aside><main class="main" id="main"></main></div></div>`;go(state.section||'dashboard')}
function go(s){state.section=s;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));const x=[...document.querySelectorAll('.nav button')].find(b=>b.getAttribute('onclick')?.includes("'"+s+"'"));if(x)x.classList.add('active');({dashboard:dashboard,profile:profile,apply:applyPage,application:application,internship:internship,attendance:attendance,activities:activities,assignments:assignments,project:project,documents:documents,payment:payment,evaluation:evaluation,certificate:certificate,students:students,applications:applications,colleges:colleges,node:nodePage,internships:internships,training:training,reports:reports,audit:audit,progress:progress,evaluations:evaluations}[s]||dashboard)()}
function head(title,sub=''){return `<div class="page-head"><div><h1>${title}</h1><div class="muted">${sub}</div></div></div>`}
async function dashboard(){if(state.role==='student'){const {data:i}=await sb.from('internships').select('*').eq('student_id',state.user.id).order('created_at',{ascending:false}).limit(1).maybeSingle();const {data:a}=await sb.from('internship_applications').select('*,internship_sectors(name)').eq('student_id',state.user.id).order('created_at',{ascending:false}).limit(1).maybeSingle();const h=i?.total_hours||a?.requested_hours||120,c=i?.credits||a?.requested_credits||4;document.getElementById('main').innerHTML=head('Welcome, '+esc(state.profile.full_name),'Your internship journey at SHIVORIX')+`<div class="grid stats"><div class="card stat"><div class="label">Application</div><div class="value">${a?'<span class="badge orange">'+esc(a.status)+'</span>':'—'}</div></div><div class="card stat"><div class="label">Sector</div><div class="value" style="font-size:17px">${esc(i?.domain||a?.internship_sectors?.name||'Not selected')}</div></div><div class="card stat"><div class="label">Credits</div><div class="value">${c}</div></div><div class="card stat"><div class="label">Required Hours</div><div class="value">${h}</div></div></div><div class="card" style="margin-top:16px"><b>Internship Journey</b><div class="journey">${['Application','Approval','Payment','Activated','Training','Project','Certificate'].map((x,n)=>`<div class="step ${n<(a?.status==='active'||i?.status==='active'?4:1)?'done':''}"><div class="dot"></div>${x}</div>`).join('')}</div></div><div class="grid two" style="margin-top:16px"><div class="card"><b>Quick Actions</b><div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:15px"><button class="btn btn-primary" onclick="go('apply')">Apply for Internship</button><button class="btn btn-soft" onclick="go('documents')">My Documents</button><button class="btn btn-soft" onclick="go('attendance')">Attendance</button></div></div><div class="card"><b>Profile</b><p class="muted">${esc(state.profile.college_name||'College not assigned')} · ${esc(state.profile.course||'Course')} · Semester ${esc(state.profile.semester||'—')}</p><button class="btn btn-soft" onclick="go('profile')">View Profile</button></div></div>`}else{const {count:pc}=await sb.from('profiles').select('*',{count:'exact',head:true}).eq('role','student');const {count:ac}=await sb.from('internship_applications').select('*',{count:'exact',head:true}).in('status',['submitted','under_review']);const {count:cc}=await sb.from('colleges').select('*',{count:'exact',head:true});document.getElementById('main').innerHTML=head(state.role==='admin'?'SHIVORIX Admin Dashboard':'Node Officer Dashboard',state.role==='admin'?'Central control across all colleges':'Manage only your assigned college')+`<div class="grid stats"><div class="card stat"><div class="label">Students</div><div class="value">${pc||0}</div></div><div class="card stat"><div class="label">Pending Applications</div><div class="value">${ac||0}</div></div><div class="card stat"><div class="label">Colleges</div><div class="value">${state.role==='admin'?cc||0:'Assigned'}</div></div><div class="card stat"><div class="label">Access</div><div class="value" style="font-size:18px">${state.role==='admin'?'All Data':'College Only'}</div></div></div><div class="card" style="margin-top:16px"><b>Data Control</b><p class="muted">${state.role==='admin'?'You are the central SHIVORIX controller. Manage colleges, Node Officers, students, documents, payments, training and completion records.':'Your access is limited at database level to your assigned college. Other colleges are not visible.'}</p></div>`}}
function profile(){const p=state.profile;document.getElementById('main').innerHTML=head('My Profile','Your registered academic and personal information')+`<div class="card"><div class="profile-head"><div class="big-avatar">${initials(p.full_name)}</div><div><h2 style="margin:0">${esc(p.full_name)}</h2><div class="muted">${esc(p.college_name||'College not assigned')}</div></div></div><div class="grid two" style="margin-top:25px">${[['University Registration No.',p.university_registration_number],['College Roll No.',p.college_roll_number],['Email',p.email],['Mobile',p.mobile],['University',p.university_name],['Course',p.course],['Department',p.department],['Semester',p.semester],['Academic Session',p.academic_session],['City',p.city],['State',p.state],['PIN Code',p.pin_code]].map(x=>`<div><small class="muted">${x[0]}</small><div style="font-weight:700;margin-top:4px">${esc(x[1]||'—')}</div></div>`).join('')}</div></div>`}
function apply(){document.getElementById('main').innerHTML=head('Apply for Internship','Select your sector and submit your internship application for Node Officer review')+`<div class="card"><div class="form two-col"><div class="field"><label>Internship Sector *</label><select id="sector">${sectors.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>Mode</label><select id="mode"><option>online</option><option>offline</option><option>hybrid</option></select></div><div class="field"><label>Required Hours</label><input id="hours" type="number" min="1" value="120"></div><div class="field"><label>Credits</label><input id="credits" type="number" min="1" value="4"></div><div class="field"><label>Preferred Start Date</label><input id="start" type="date"></div><div class="field"><label>Preferred End Date</label><input id="end" type="date"></div></div><div class="alert" style="margin-top:15px">After submission, your application will go to your college's assigned Node Officer. Payment becomes available only after approval.</div><button class="btn btn-primary" style="margin-top:15px" onclick="submitApplication()">Submit Application</button></div>`}
async function submitApplication(){try{const {data:p}=await sb.from('profiles').select('college_id').eq('id',state.user.id).single();if(!p?.college_id)throw Error('Your college is not assigned yet. Please contact SHIVORIX Admin.');const {data:sec}=await sb.from('internship_sectors').select('id').eq('name',document.getElementById('sector').value).single();const num='SHX-'+Date.now().toString(36).toUpperCase();const {error}=await sb.from('internship_applications').insert({application_number:num,student_id:state.user.id,college_id:p.college_id,sector_id:sec.id,mode:document.getElementById('mode').value,requested_hours:+document.getElementById('hours').value,requested_credits:+document.getElementById('credits').value,preferred_start_date:document.getElementById('start').value||null,preferred_end_date:document.getElementById('end').value||null});if(error)throw error;toast('Application submitted successfully');go('application')}catch(e){toast(e.message)}}
async function application(){const {data:a}=await sb.from('internship_applications').select('*,internship_sectors(name),colleges(name)').eq('student_id',state.user.id).order('created_at',{ascending:false}).limit(10);document.getElementById('main').innerHTML=head('My Application','Track every stage of your internship application')+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Application</th><th>Sector</th><th>Status</th><th>Node Review</th><th>Payment</th><th>Created</th></tr></thead><tbody>${(a||[]).map(x=>`<tr><td>${esc(x.application_number)}</td><td>${esc(x.internship_sectors?.name)}</td><td><span class="badge orange">${esc(x.status)}</span></td><td>${esc(x.node_review_status)}</td><td>${esc(x.payment_status)}</td><td>${new Date(x.created_at).toLocaleDateString()}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No application yet.</td></tr>'}</tbody></table></div></div>`}
async function internship(){const {data:i}=await sb.from('internships').select('*').eq('student_id',state.user.id).order('created_at',{ascending:false}).limit(1).maybeSingle();document.getElementById('main').innerHTML=head('Internship Details','Your activated internship record')+`<div class="card">${i?`<div class="grid two">${[['Domain',i.domain],['Mode',i.mode],['Type',i.internship_type],['Start Date',i.start_date],['End Date',i.end_date],['Total Hours',i.total_hours],['Credits',i.credits],['Status',i.status],['Mentor',i.mentor_name],['Acceptance Letter',i.acceptance_letter_no]].map(x=>`<div><small class="muted">${x[0]}</small><div style="font-weight:750;margin-top:4px">${esc(x[1]||'—')}</div></div>`).join('')}</div>`:'<div class="empty">Your internship is not active yet. Complete the application and Node Officer approval steps first.</div>'}</div>`}
async function attendance(){const {data}=await sb.from('attendance').select('*').eq('student_id',state.user.id).order('attendance_date',{ascending:false});const hours=(data||[]).reduce((s,x)=>s+Number(x.hours||0),0);document.getElementById('main').innerHTML=head('Attendance','Recorded internship hours and attendance')+`<div class="grid stats"><div class="card stat"><div class="label">Days Recorded</div><div class="value">${data?.length||0}</div></div><div class="card stat"><div class="label">Hours Completed</div><div class="value">${hours.toFixed(1)}</div></div></div><div class="card" style="margin-top:16px"><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Status</th><th>Time In</th><th>Time Out</th><th>Hours</th><th>Remarks</th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td>${x.attendance_date}</td><td>${x.status}</td><td>${x.time_in||'—'}</td><td>${x.time_out||'—'}</td><td>${x.hours||0}</td><td>${esc(x.remarks||'')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No attendance recorded yet.</td></tr>'}</tbody></table></div></div>`}
async function activities(){const {data}=await sb.from('weekly_logs').select('*').eq('student_id',state.user.id).order('week_number');document.getElementById('main').innerHTML=head('Activities','Weekly activities and learning outcomes')+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Week</th><th>Period</th><th>Activities</th><th>Learning Outcomes</th><th>Status</th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td>${x.week_number}</td><td>${x.period_start||'—'} → ${x.period_end||'—'}</td><td>${esc(x.activities||'')}</td><td>${esc(x.learning_outcomes||'')}</td><td>${x.status}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No activities yet.</td></tr>'}</tbody></table></div></div>`}
async function assignments(){const {data}=await sb.from('assignments').select('*').eq('is_active',true).order('due_date');document.getElementById('main').innerHTML=head('Assignments','Tasks assigned during your internship')+`<div class="grid two">${(data||[]).map(x=>`<div class="card"><b>${esc(x.title)}</b><p class="muted">${esc(x.description||'')}</p><span class="badge">${esc(x.domain||'General')}</span> ${x.due_date?`<span class="badge orange">Due ${x.due_date}</span>`:''}</div>`).join('')||'<div class="card empty">No active assignments.</div>'}</div>`}
function project(){document.getElementById('main').innerHTML=head('Project & Report','Submit and track your internship project/report')+`<div class="card"><div class="drop">Project/report submission is enabled after your internship is activated.<br><span class="muted">Use the Documents section for supporting files.</span></div></div>`}
async function documents(){const {data}=await sb.from('student_documents').select('*').eq('student_id',state.user.id).order('created_at',{ascending:false});document.getElementById('main').innerHTML=head('Documents','Securely upload and manage your internship documents')+`<div class="card"><div class="form two-col"><div class="field"><label>Document Type</label><select id="dtype"><option>Marksheet</option><option>Certificate</option><option>ID Proof</option><option>Acceptance Letter</option><option>Consent Letter</option><option>Internship Report</option><option>Attendance Record</option><option>Evaluation</option><option>Other</option></select></div><div class="field"><label>File</label><input id="dfile" type="file" accept="application/pdf,image/jpeg,image/png,image/webp"></div></div><button class="btn btn-primary" style="margin-top:14px" onclick="uploadDoc()">Upload Securely</button></div><div class="card" style="margin-top:16px"><div class="table-wrap"><table class="table"><thead><tr><th>Type</th><th>Title</th><th>Status</th><th>Date</th><th>File</th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td>${esc(x.document_type)}</td><td>${esc(x.document_title)}</td><td><span class="badge ${x.verification_status==='verified'?'green':''}">${x.verification_status}</span></td><td>${new Date(x.created_at).toLocaleDateString()}</td><td><button class="btn btn-soft" onclick="downloadDoc('${x.file_path}')">Open</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No documents uploaded.</td></tr>'}</tbody></table></div></div>`}
async function uploadDoc(){try{const f=document.getElementById('dfile').files[0];if(!f)throw Error('Please select a file.');if(f.size>10*1024*1024)throw Error('Maximum file size is 10 MB.');const allowed=['application/pdf','image/jpeg','image/png','image/webp'];if(!allowed.includes(f.type))throw Error('Only PDF, JPG, PNG and WEBP files are allowed.');const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=state.user.id+'/'+Date.now()+'_'+safe;const {error:up}=await sb.storage.from('student-documents').upload(path,f,{contentType:f.type,upsert:false});if(up)throw up;const {data:p}=await sb.from('profiles').select('college_id').eq('id',state.user.id).single();const {error:db}=await sb.from('student_documents').insert({student_id:state.user.id,college_id:p?.college_id||null,document_type:document.getElementById('dtype').value,document_title:f.name,file_path:path,mime_type:f.type,file_size:f.size,uploaded_by:state.user.id});if(db)throw db;toast('Document uploaded securely');documents()}catch(e){toast(e.message)}}
async function downloadDoc(path){const {data,error}=await sb.storage.from('student-documents').createSignedUrl(path,300);if(error)toast(error.message);else window.open(data.signedUrl,'_blank')}
async function payment(){const {data}=await sb.from('payments').select('*').eq('student_id',state.user.id).order('created_at',{ascending:false});document.getElementById('main').innerHTML=head('Payment','Payment becomes available only after Node Officer approval')+`<div class="card">${(data||[]).length?`<div class="table-wrap"><table class="table"><thead><tr><th>Amount</th><th>Status</th><th>Provider</th><th>Date</th></tr></thead><tbody>${data.map(x=>`<tr><td>₹${Number(x.amount).toLocaleString('en-IN')}</td><td>${x.status}</td><td>${x.provider||'—'}</td><td>${new Date(x.created_at).toLocaleDateString()}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No payment order is available yet. It will appear here after Node Officer approval.</div>'}</div>`}
async function evaluation(){const {data}=await sb.from('evaluations').select('*').eq('student_id',state.user.id).maybeSingle();document.getElementById('main').innerHTML=head('Evaluation','Internship performance evaluation')+`<div class="card">${data?`<div class="grid two">${[['Technical Knowledge',data.technical_knowledge],['Quality of Work',data.quality_of_work],['Initiative & Problem Solving',data.initiative_problem_solving],['Communication',data.communication],['Discipline & Punctuality',data.discipline_punctuality],['Overall Score',data.overall_score],['Rating',data.rating],['Remarks',data.supervisor_remarks]].map(x=>`<div><small class="muted">${x[0]}</small><div style="font-weight:750;margin-top:4px">${esc(x[1]??'—')}</div></div>`).join('')}</div>`:'<div class="empty">Evaluation has not been submitted yet.</div>'}</div>`}
async function certificate(){const {data}=await sb.from('certificates').select('*').eq('student_id',state.user.id).order('issued_date',{ascending:false});document.getElementById('main').innerHTML=head('Certificate','Your SHIVORIX internship completion certificates')+`<div class="grid two">${(data||[]).map(x=>`<div class="card"><b>Certificate No. ${esc(x.certificate_number)}</b><p class="muted">${esc(x.domain)} · ${x.total_hours||0} hours · ${x.credits||0} credits</p><p>Issued: ${x.issued_date}</p>${x.certificate_url?`<a class="btn btn-primary" href="${esc(x.certificate_url)}" target="_blank">View Certificate</a>`:''}</div>`).join('')||'<div class="card empty">Certificate will appear here after successful completion.</div>'}</div>`}
async function students(){const {data}=await sb.from('profiles').select('id,full_name,email,college_name,course,semester,university_registration_number,college_roll_number').eq('role','student').order('full_name');document.getElementById('main').innerHTML=head(state.role==='admin'?'All Students':'My College Students','Access is enforced by database policies')+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Registration</th><th>Roll</th><th>College</th><th>Course</th><th>Semester</th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td>${esc(x.full_name)}</td><td>${esc(x.university_registration_number||'—')}</td><td>${esc(x.college_roll_number||'—')}</td><td>${esc(x.college_name||'—')}</td><td>${esc(x.course||'—')}</td><td>${esc(x.semester||'—')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No students found.</td></tr>'}</tbody></table></div></div>`}
async function applications(){const {data}=await sb.from('internship_applications').select('*,internship_sectors(name),profiles(full_name,college_name,university_registration_number)').order('created_at',{ascending:false});document.getElementById('main').innerHTML=head('Applications','Review and manage internship applications')+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>College</th><th>Sector</th><th>Status</th><th>Node Review</th><th>Action</th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td>${esc(x.profiles?.full_name)}</td><td>${esc(x.profiles?.college_name)}</td><td>${esc(x.internship_sectors?.name)}</td><td>${x.status}</td><td>${x.node_review_status}</td><td>${state.role==='node_officer'&&x.node_review_status==='pending'?`<button class="btn btn-primary" onclick="reviewApp('${x.id}','approved')">Approve</button> <button class="btn btn-danger" onclick="reviewApp('${x.id}','rejected')">Reject</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No applications found.</td></tr>'}</tbody></table></div></div>`}
async function reviewApp(id,status){const {error}=await sb.from('internship_applications').update({node_review_status:status,status:status==='approved'?'payment_pending':'rejected',node_reviewed_at:new Date().toISOString()}).eq('id',id);if(error)toast(error.message);else{toast('Application updated');applications()}}
async function colleges(){const {data}=await sb.from('colleges').select('*').order('name');document.getElementById('main').innerHTML=head('Colleges','Manage the multi-college network')+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Code</th><th>College</th><th>University</th><th>City</th><th>Status</th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td>${x.code}</td><td>${esc(x.name)}</td><td>${esc(x.university_name||'—')}</td><td>${esc(x.city||'—')}</td><td>${x.is_active?'Active':'Inactive'}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No colleges added.</td></tr>'}</tbody></table></div></div>`}
async function nodePage(){const {data}=await sb.from('node_officers').select('*').order('college_name');document.getElementById('main').innerHTML=head('Node Officers','College-level internship coordinators')+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Code</th><th>College</th><th>University</th><th>Designation</th><th>Status</th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td>${x.node_code}</td><td>${esc(x.college_name)}</td><td>${esc(x.university_name||'—')}</td><td>${esc(x.designation||'Node Officer')}</td><td>${x.is_active?'Active':'Inactive'}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No Node Officers found.</td></tr>'}</tbody></table></div></div>`}
async function internships(){const {data}=await sb.from('internships').select('*').order('created_at',{ascending:false});document.getElementById('main').innerHTML=head('Internships','Activated and completed internship records')+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Application</th><th>Domain</th><th>Mode</th><th>Hours</th><th>Credits</th><th>Status</th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td>${esc(x.application_id)}</td><td>${esc(x.domain)}</td><td>${x.mode}</td><td>${x.total_hours}</td><td>${x.credits}</td><td>${x.status}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No internship records.</td></tr>'}</tbody></table></div></div>`}
async function training(){const {data}=await sb.from('training_modules').select('*').order('sequence_no');document.getElementById('main').innerHTML=head('Training','Manage internship learning modules')+`<div class="grid two">${(data||[]).map(x=>`<div class="card"><b>${x.sequence_no}. ${esc(x.title)}</b><p class="muted">${esc(x.description||'')}</p><span class="badge">${x.estimated_hours} hrs</span></div>`).join('')||'<div class="card empty">No training modules created yet.</div>'}</div>`}
async function reports(){document.getElementById('main').innerHTML=head('Reports','Structured portal reporting')+`<div class="grid two"><div class="card"><b>Student & College Reports</b><p class="muted">Use the Students and Applications sections for live records. Export functionality can be added when your reporting format is finalized.</p></div><div class="card"><b>Internship Completion</b><p class="muted">Track hours, credits, evaluations and certificates from the connected records.</p></div></div>`}
async function audit(){const {data}=await sb.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(100);document.getElementById('main').innerHTML=head('Audit Logs','Administrative activity trail')+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Action</th><th>Entity</th><th>College</th><th>Date</th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td>${esc(x.action)}</td><td>${esc(x.entity_type)}</td><td>${esc(x.college_id||'—')}</td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No audit events yet.</td></tr>'}</tbody></table></div></div>`}
async function progress(){document.getElementById('main').innerHTML=head('Progress','Student progress in your assigned college')+`<div class="card empty">Progress is calculated from attendance, training, assignments and project completion records.</div>`}
async function evaluations(){const {data}=await sb.from('evaluations').select('*').order('created_at',{ascending:false});document.getElementById('main').innerHTML=head('Evaluations','Internship performance evaluations')+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Overall</th><th>Rating</th><th>Evaluated</th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td>${x.student_id}</td><td>${x.overall_score??'—'}</td><td>${esc(x.rating||'—')}</td><td>${x.evaluated_at?new Date(x.evaluated_at).toLocaleDateString():'—'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No evaluations yet.</td></tr>'}</tbody></table></div></div>`}
async function showNotifications(){const {data}=await sb.from('notifications').select('*').eq('user_id',state.user.id).order('created_at',{ascending:false}).limit(10);toast(data?.length?data[0].message:'No new notifications')}
async function logout(){await sb.auth.signOut();state={user:null,profile:null,role:null,section:'dashboard',challenge:null,mode:'student'};login()}
sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')login()});
boot();
</script></body></html>
