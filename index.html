async function applyPage(){const {data:p}=await sb.from('profiles').select('college_id,internship_sector_id').eq('id',state.user.id).single();const {data:ss}=await sb.from('internship_sectors').select('id,name').eq('is_active',true).order('name');document.getElementById('main').innerHTML=head('Apply for Internship','Submit your credit-based internship application for Node Officer review')+'<div class="card"><div class="form two-col"><div class="field"><label>Internship Sector *</label><select id="sector">'+(ss||[]).map(x=>'<option value="'+x.id+'" '+(x.id===p?.internship_sector_id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div><div class="field"><label>Mode</label><select id="mode"><option value="online">Online</option><option value="offline">Offline</option><option value="hybrid">Hybrid</option></select></div><div class="field"><label>Required Hours</label><input id="hours" type="number" min="90" max="120" value="120"></div><div class="field"><label>Credits</label><input id="credits" type="number" min="1" value="4"></div><div class="field"><label>Preferred Start Date</label><input id="start" type="date"></div><div class="field"><label>Preferred End Date</label><input id="end" type="date"></div></div><div class="alert" style="margin-top:15px">Application → Node Officer review → Internship activation. Payment is disabled in this demo.</div><button class="btn btn-primary" style="margin-top:15px" onclick="submitApplication()">Submit Application</button></div>'}
async function submitApplication(){try{const {data:p,error:pe}=await sb.from('profiles').select('college_id').eq('id',state.user.id).single();if(pe||!p?.college_id)throw Error('Your college is not assigned. Please contact SHIVORIX Admin.');const hours=Number(document.getElementById('hours').value||120);const credits=Number(document.getElementById('credits').value||4);if(hours<90||hours>120)throw Error('Credit-based internship hours must be between 90 and 120.');const {data:open}=await sb.from('internship_applications').select('id').eq('student_id',state.user.id).in('status',['submitted','under_review','approved','active','returned']).maybeSingle();if(open)throw Error('You already have an active application/internship.');const {error}=await sb.from('internship_applications').insert({application_number:'SHX-'+Date.now().toString(36).toUpperCase(),student_id:state.user.id,college_id:p.college_id,sector_id:document.getElementById('sector').value,mode:document.getElementById('mode').value,requested_hours:hours,requested_credits:credits,preferred_start_date:document.getElementById('start').value||null,preferred_end_date:document.getElementById('end').value||null,status:'submitted',node_review_status:'pending',payment_required:false});if(error)throw error;toast('Application submitted');go('application')}catch(e){toast(e.message||'Unable to submit application')}}
async function application(){const {data:a}=await sb.from('internship_applications').select('*,internship_sectors(name),colleges(name)').eq('student_id',state.user.id).order('created_at',{ascending:false});document.getElementById('main').innerHTML=head('My Application','Track approval and activation')+'<div class="grid">'+(a||[]).map(x=>'<div class="card"><div style="display:flex;justify-content:space-between;gap:15px"><div><b>'+esc(x.application_number)+'</b><p class="muted">'+esc(x.internship_sectors?.name||'')+' · '+esc(x.mode)+'</p></div><span class="badge '+(x.status==='active'?'green':x.status==='rejected'?'red':'orange')+'">'+esc(x.status)+'</span></div><div class="grid two" style="margin-top:15px"><div><small class="muted">College</small><div>'+esc(x.colleges?.name||'')+'</div></div><div><small class="muted">Node Review</small><div>'+esc(x.node_review_status)+'</div></div><div><small class="muted">Hours / Credits</small><div>'+x.requested_hours+' hrs · '+x.requested_credits+' credits</div></div></div>'+(x.node_review_remarks?'<div class="alert" style="margin-top:14px">'+esc(x.node_review_remarks)+'</div>':'')+'</div>').join('')||'<div class="card empty">No application submitted yet.</div>'+'</div>'}
async function applications(){const {data}=await sb.from('internship_applications').select('*,internship_sectors(name),profiles(full_name,college_name,university_registration_number,college_roll_number),colleges(name)').order('created_at',{ascending:false});document.getElementById('main').innerHTML=head('Applications',state.role==='admin'?'Central application control':'Review applications from your assigned college')+'<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>College</th><th>Sector</th><th>Status</th><th>Review</th><th>Action</th></tr></thead><tbody>'+(data||[]).map(x=>'<tr><td>'+esc(x.profiles?.full_name)+'</td><td>'+esc(x.colleges?.name||x.profiles?.college_name)+'</td><td>'+esc(x.internship_sectors?.name)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.node_review_status)+'</td><td>'+(state.role==='node_officer'&&['pending','returned'].includes(x.node_review_status)?'<button class="btn btn-primary" onclick="reviewApp(\''+x.id+'\',\'approved\')">Approve</button> <button class="btn btn-soft" onclick="reviewApp(\''+x.id+'\',\'returned\')">Return</button> <button class="btn btn-danger" onclick="reviewApp(\''+x.id+'\',\'rejected\')">Reject</button>':'—')+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">No applications found.</td></tr>'+'</tbody></table></div></div>'}
async function reviewApp(id,status){const remarks=prompt(status==='returned'?'Correction required (optional):':status==='rejected'?'Reason (optional):':'Remarks (optional):','')||null;const {error}=await sb.from('internship_applications').update({node_review_status:status,status:status==='approved'?'approved':status==='returned'?'returned':'rejected',node_reviewed_at:new Date().toISOString(),node_review_remarks:remarks}).eq('id',id);if(error)toast(error.message);else{toast('Application updated');applications()}}
async function payments(){const {data}=await sb.from('payments').select('*,profiles(full_name,college_name),internship_applications(application_number,status)').order('created_at',{ascending:false});document.getElementById('main').innerHTML=head('Payments','Payment orders, successful payments and administrative waivers')+'<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Application</th><th>Amount</th><th>Provider</th><th>Status</th><th>Action</th></tr></thead><tbody>'+(data||[]).map(x=>'<tr><td>'+esc(x.profiles?.full_name)+'</td><td>'+esc(x.internship_applications?.application_number||'')+'</td><td>₹'+Number(x.amount||0).toLocaleString('en-IN')+'</td><td>'+esc(x.provider||'—')+'</td><td>'+esc(x.status)+'</td><td>'+(x.status==='pending'?'<button class="btn btn-soft" onclick="waivePayment(\''+x.id+'\')">Waive & Activate</button>':'—')+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">No payments.</td></tr>'+'</tbody></table></div></div>'}
async function waivePayment(id){if(!confirm('Mark this fee as waived and activate the internship?'))return;const {data:p,error}=await sb.from('payments').update({status:'success',paid_at:new Date().toISOString(),metadata:{waived_by_admin:true}}).eq('id',id).select('id,application_id').single();if(error)return toast(error.message);const {error:ie}=await sb.rpc('activate_paid_internship',{p_application_id:p.application_id,p_payment_id:p.id,p_provider_payment_id:null});if(ie)toast(ie.message);else{toast('Fee waived and internship activated');payments()}}
async function payment(){const {data}=await sb.from('payments').select('*,internship_applications(application_number,status)').eq('student_id',state.user.id).order('created_at',{ascending:false});document.getElementById('main').innerHTML=head('Payment','Payment is available only after Node Officer approval')+'<div class="card">'+((data||[]).length?'<div class="table-wrap"><table class="table"><thead><tr><th>Application</th><th>Amount</th><th>Provider</th><th>Status</th><th>Action</th></tr></thead><tbody>'+(data||[]).map(x=>'<tr><td>'+esc(x.internship_applications?.application_number||'')+'</td><td>₹'+Number(x.amount||0).toLocaleString('en-IN')+'</td><td>'+esc(x.provider||'—')+'</td><td>'+esc(x.status)+'</td><td>'+(x.status==='pending'&&x.internship_applications?.status==='payment_pending'?'<button class="btn btn-primary" onclick="startPayment(\''+x.application_id+'\')">Pay Now</button>':'—')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No payment is currently due.</div>')+'</div>'}
async function startPayment(applicationId){const {data,error}=await sb.functions.invoke('payment-api',{body:{action:'create_order',application_id:applicationId}});if(error||data?.error)return toast(error?.message||data?.error||'Unable to start payment');if(!window.Razorpay)return toast('Payment checkout library is unavailable.');const rzp=new Razorpay({key:data.key_id,amount:Math.round(Number(data.amount)*100),currency:data.currency,order_id:data.order_id,name:'SHIVORIX PVT. LTD.',description:'Internship Fee',prefill:{name:data.name,email:data.email},theme:{color:'#6d28d9'},handler:async function(resp){const v=await sb.functions.invoke('payment-api',{body:{action:'verify',payment_id:data.payment_id,application_id:applicationId,razorpay_order_id:resp.razorpay_order_id,razorpay_payment_id:resp.razorpay_payment_id,razorpay_signature:resp.razorpay_signature}});if(v.error||v.data?.error)toast(v.error?.message||v.data?.error||'Payment verification failed');else{toast('Payment verified. Internship activated.');go('internship')}}});rzp.open()}
async function assignments(){
 if(state.role==='admin'){
  const {data:as}=await sb.from('assignments').select('*').order('created_at',{ascending:false});
  const {data:subs}=await sb.from('assignment_submissions').select('*,assignments(title),profiles(full_name,college_name)').order('submitted_at',{ascending:false});
  document.getElementById('main').innerHTML=head('Assignments','Create practical tasks and review student submissions')+
  '<div class="card"><b>Create Assignment</b><div class="form two-col" style="margin-top:12px"><div class="field"><label>Title *</label><input id="atitle"></div><div class="field"><label>Domain / Sector</label><input id="adomain" placeholder="AI, Web, Digital Marketing..."></div><div class="field"><label>Description</label><textarea id="adesc" rows="3"></textarea></div><div class="field"><label>Due Date</label><input id="adue" type="date"></div></div><button class="btn btn-primary" style="margin-top:12px" onclick="createAssignment()">Create Assignment</button></div>'+
  '<div class="card" style="margin-top:16px"><b>Assignments</b><div class="table-wrap" style="margin-top:10px"><table class="table"><thead><tr><th>Title</th><th>Domain</th><th>Due</th><th>Status</th></tr></thead><tbody>'+(as||[]).map(x=>'<tr><td>'+esc(x.title)+'</td><td>'+esc(x.domain||'')+'</td><td>'+esc(x.due_date||'—')+'</td><td>'+esc(x.is_active?'Active':'Inactive')+'</td></tr>').join('')||'<tr><td colspan="4" class="empty">No assignments.</td></tr>'+'</tbody></table></div></div>'+
  '<div class="card" style="margin-top:16px"><b>Student Submissions</b><div class="table-wrap" style="margin-top:10px"><table class="table"><thead><tr><th>Student</th><th>Assignment</th><th>Status</th><th>Score</th><th>Action</th></tr></thead><tbody>'+(subs||[]).map(x=>'<tr><td>'+esc(x.profiles?.full_name)+'</td><td>'+esc(x.assignments?.title)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.score??'—')+'</td><td><button class="btn btn-soft" onclick="reviewAssignment(\''+x.id+'\')">Review</button></td></tr>').join('')||'<tr><td colspan="5" class="empty">No submissions.</td></tr>'+'</tbody></table></div></div>';
  return;
 }
 if(state.role==='student'){
  const {data:as}=await sb.from('assignments').select('*').eq('is_active',true).order('due_date');const {data:subs}=await sb.from('assignment_submissions').select('*').eq('student_id',state.user.id);const sm=new Map((subs||[]).map(x=>[x.assignment_id,x]));
  document.getElementById('main').innerHTML=head('Assignments','Practical tasks and submission tracking')+'<div class="grid two">'+(as||[]).map(x=>{const z=sm.get(x.id);return '<div class="card"><b>'+esc(x.title)+'</b><p class="muted">'+esc(x.description||'')+'</p><span class="badge">'+esc(x.domain||'General')+'</span>'+(x.due_date?'<span class="badge orange">Due '+x.due_date+'</span>':'')+'<div class="form" style="margin-top:12px"><div class="field"><label>Submission URL</label><input id="su_'+x.id+'" value="'+esc(z?.submission_url||'')+'"></div><div class="field"><label>Notes</label><textarea id="sn_'+x.id+'" rows="3">'+esc(z?.notes||'')+'</textarea></div><button class="btn btn-primary" onclick="submitAssignment(\''+x.id+'\')">'+(z?'Update Submission':'Submit Assignment')+'</button>'+(z?'<div class="success">Status: '+esc(z.status||'submitted')+(z.score!=null?' · Score: '+z.score:'')+'</div>':'')+'</div></div>'}).join('')||'<div class="card empty">No active assignments.</div>'+'</div>';
  return;
 }
 const {data}=await sb.from('assignment_submissions').select('*,assignments(title),profiles(full_name,college_name)').order('submitted_at',{ascending:false});
 document.getElementById('main').innerHTML=head('Assignments','Student submissions from your permitted scope')+'<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Assignment</th><th>Status</th><th>Score</th><th>Action</th></tr></thead><tbody>'+(data||[]).map(x=>'<tr><td>'+esc(x.profiles?.full_name)+'</td><td>'+esc(x.assignments?.title)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.score??'—')+'</td><td><button class="btn btn-soft" onclick="reviewAssignment(\''+x.id+'\')">Review</button></td></tr>').join('')||'<tr><td colspan="5" class="empty">No submissions.</td></tr>'+'</tbody></table></div></div>';
}
async function createAssignment(){const title=document.getElementById('atitle').value.trim();if(!title)return toast('Assignment title is required.');const {error}=await sb.from('assignments').insert({title,domain:document.getElementById('adomain').value.trim()||null,description:document.getElementById('adesc').value.trim()||null,due_date:document.getElementById('adue').value||null,is_active:true});if(error)toast(error.message);else{toast('Assignment created');assignments()}}
async function submitAssignment(id){const url=document.getElementById('su_'+id).value.trim();if(!url)return toast('Add a submission URL.');const {data:i}=await sb.from('internships').select('id').eq('student_id',state.user.id).eq('status','active').limit(1).maybeSingle();if(!i)return toast('Assignment submission unlocks after internship activation.');const {error}=await sb.from('assignment_submissions').upsert({assignment_id:id,internship_id:i.id,student_id:state.user.id,submission_url:url,notes:document.getElementById('sn_'+id).value.trim(),submitted_at:new Date().toISOString(),status:'submitted'},{onConflict:'assignment_id,student_id'});if(error)toast(error.message);else{toast('Assignment submitted');assignments()}}
async function reviewAssignment(id){const score=prompt('Score (0-100):','80');if(score===null)return;const feedback=prompt('Feedback:','')||null;const {error}=await sb.from('assignment_submissions').update({score:Number(score),feedback,status:'evaluated'}).eq('id',id);if(error)toast(error.message);else{toast('Submission evaluated');assignments()}}
let finalTestState={data:null,answers:{},timer:null};
async function finalTest(){
 try{
  const {data:i,error:ie}=await sb.from('internships').select('id,start_date,status').eq('student_id',state.user.id).order('created_at',{ascending:false}).limit(1).maybeSingle();
  if(ie)throw ie;
  if(!i){document.getElementById('main').innerHTML=head('Final Test','Final assessment after the internship period')+'<div class="card empty">Your Final Test will appear here after an internship is activated.</div>';return}
  const {data,error}=await sb.functions.invoke('final-test-api',{body:{action:'get_test',internship_id:i.id}});
  if(error)throw error;
  if(data?.error)throw Error(data.error);
  if(!data.eligible){document.getElementById('main').innerHTML=head('Final Test','Final assessment after 30 days')+'<div class="card"><h3>Final Test Locked</h3><p>Your Final Test unlocks after 30 days from <b>'+esc(i.start_date)+'</b>.</p><div class="badge orange">'+esc(data.days_remaining)+' day(s) remaining</div></div>';return}
  if(!data.available){document.getElementById('main').innerHTML=head('Final Test','Final assessment')+'<div class="card"><h3>Not Published Yet</h3><p class="muted">'+esc(data.message||'The Final Test will appear here when SHIVORIX publishes it.')+'</p></div>';return}
  finalTestState.data={...data,internshipId:i.id};
  const a=data.attempt;
  if(a?.submitted_at){document.getElementById('main').innerHTML=head('Final Test Result','Your submitted assessment result')+'<div class="card"><h2>'+esc(a.percentage??0)+'%</h2><p><b>'+((a.passed)?'Passed':'Not Passed')+'</b></p><p class="muted">Score: '+esc(a.score??0)+' / '+esc(data.test.total_marks)+'</p></div>';return}
  if(a){renderFinalTest(a,data);return}
  document.getElementById('main').innerHTML=head('Final Test','Final assessment after 30 days')+'<div class="card"><h2>'+esc(data.test.title)+'</h2><p>'+esc(data.test.duration_minutes)+' minutes · Passing: '+esc(data.test.pass_percentage)+'%</p><p class="muted">Once you start, the attempt will be recorded. Submit before the timer ends.</p><button class="btn btn-primary" onclick="startFinalTest()">Start Final Test</button></div>';
 }catch(e){document.getElementById('main').innerHTML=head('Final Test','Final assessment')+'<div class="card"><div class="alert">'+esc(e.message||'Unable to load Final Test.')+'</div></div>'}
}
async function startFinalTest(){
 const {data,error}=await sb.functions.invoke('final-test-api',{body:{action:'start',internship_id:finalTestState.data.internshipId}});
 if(error)throw error;if(data?.error)throw Error(data.error);
 finalTestState.data.attempt=data.attempt;finalTestState.answers={};renderFinalTest(data.attempt,finalTestState.data)
}
function renderFinalTest(attempt,data){
 const saved=JSON.parse(localStorage.getItem('shivorix_final_test_'+attempt.id)||'{}');finalTestState.answers=saved;
 const started=new Date(attempt.started_at).getTime(),limit=Number(data.test.duration_minutes)*60000;
 const remaining=Math.max(0,limit-(Date.now()-started));clearInterval(finalTestState.timer);
 finalTestState.timer=setInterval(()=>{const left=Math.max(0,limit-(Date.now()-started));const el=document.getElementById('testTimer');if(el)el.textContent=Math.ceil(left/1000/60)+' min '+(Math.ceil(left/1000)%60)+' sec';if(left<=0){clearInterval(finalTestState.timer);submitFinalTest(true)}},1000);
 document.getElementById('main').innerHTML=head('Final Test',esc(data.test.title))+'<div class="card"><div class="badge orange" id="testTimer">'+Math.ceil(remaining/60000)+' min</div><div style="margin-top:16px">'+(data.questions||[]).map((q,n)=>'<div class="card" style="margin:14px 0"><b>Q'+(n+1)+'. '+esc(q.question_text)+'</b>'+(q.question_type==='mcq'?(Array.isArray(q.options)?q.options:(typeof q.options==='string'?JSON.parse(q.options||'[]'):[])).map(o=>'<label style="display:block;margin:10px 0"><input type="radio" name="q_'+q.id+'" value="'+esc(o)+'" '+(String(finalTestState.answers[q.id]||'')===String(o)?'checked':'')+' onchange="saveFinalAnswer(\''+q.id+'\',this.value)"> '+esc(o)+'</label>').join(''):q.question_type==='true_false'?['True','False'].map(o=>'<label style="display:block;margin:10px 0"><input type="radio" name="q_'+q.id+'" value="'+o+'" '+(String(finalTestState.answers[q.id]||'')===o?'checked':'')+' onchange="saveFinalAnswer(\''+q.id+'\',this.value)"> '+o+'</label>').join(''):'<textarea style="width:100%;margin-top:12px" rows="4" onchange="saveFinalAnswer(\''+q.id+'\',this.value)">'+esc(finalTestState.answers[q.id]||'')+'</textarea>')+'</div>').join('')+'</div><button class="btn btn-primary" onclick="submitFinalTest(false)">Submit Final Test</button></div>'
}
function saveFinalAnswer(qid,value){finalTestState.answers[qid]=value;localStorage.setItem('shivorix_final_test_'+finalTestState.data.attempt.id,JSON.stringify(finalTestState.answers))}
async function submitFinalTest(auto){
 if(!auto&&!confirm('Submit your Final Test now?'))return;
 clearInterval(finalTestState.timer);
 const answers=Object.entries(finalTestState.answers).map(([question_id,answer])=>({question_id,answer}));
 const {data,error}=await sb.functions.invoke('final-test-api',{body:{action:'submit',internship_id:finalTestState.data.internshipId,answers}});
 if(error)throw error;if(data?.error)throw Error(data.error);
 localStorage.removeItem('shivorix_final_test_'+finalTestState.data.attempt.id);toast('Final Test submitted');finalTest()
}
async function project(){if(state.role==='student'){const {data:i}=await sb.from('internships').select('id').eq('student_id',state.user.id).in('status',['active','completed']).limit(1).maybeSingle();const {data:p}=i?await sb.from('projects').select('*').eq('internship_id',i.id).maybeSingle():{data:null};document.getElementById('main').innerHTML=head('Project & Report','Submit your internship project and final report')+'<div class="card">'+(i?'<div class="form"><div class="field"><label>Project Title *</label><input id="ptitle" value="'+esc(p?.title||'')+'"></div><div class="field"><label>Description / Abstract</label><textarea id="pdesc" rows="6">'+esc(p?.description||'')+'</textarea></div><div class="field"><label>Project URL</label><input id="purl" value="'+esc(p?.project_url||'')+'"></div><div class="field"><label>Report File URL</label><input id="pfile" value="'+esc(p?.file_url||'')+'"></div><button class="btn btn-primary" onclick="saveProject(\''+i.id+'\')">Submit Project / Report</button>'+(p?'<div class="success">Status: '+esc(p.status||'draft')+(p.score!=null?' · Score: '+p.score:'')+'</div>':'')+'</div>':'<div class="empty">Project submission unlocks after internship activation.</div>')+'</div>'}else{const {data}=await sb.from('projects').select('*,profiles(full_name,college_name)').order('submitted_at',{ascending:false});document.getElementById('main').innerHTML=head('Project & Report Review','Review project submissions')+'<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Title</th><th>Status</th><th>Score</th><th>Action</th></tr></thead><tbody>'+(data||[]).map(x=>'<tr><td>'+esc(x.profiles?.full_name)+'</td><td>'+esc(x.title)+'</td><td>'+esc(x.status||'draft')+'</td><td>'+esc(x.score??'—')+'</td><td><button class="btn btn-soft" onclick="reviewProject(\''+x.id+'\')">Review</button></td></tr>').join('')||'<tr><td colspan="5" class="empty">No projects.</td></tr>'+'</tbody></table></div></div>'}}
async function saveProject(internshipId){const payload={internship_id:internshipId,student_id:state.user.id,title:document.getElementById('ptitle').value.trim(),description:document.getElementById('pdesc').value.trim(),project_url:document.getElementById('purl').value.trim(),file_url:document.getElementById('pfile').value.trim(),submitted_at:new Date().toISOString(),status:'submitted'};if(!payload.title)return toast('Project title is required.');const {error}=await sb.from('projects').upsert(payload,{onConflict:'internship_id'});if(error)toast(error.message);else{toast('Project submitted');project()}}
async function reviewProject(id){const score=prompt('Score (0-100):','80');if(score===null)return;const status=prompt('Status: approved / returned','approved')||'approved';const feedback=prompt('Feedback:','')||null;const {error}=await sb.from('projects').update({score:Number(score),status,feedback}).eq('id',id);if(error)toast(error.message);else{toast('Project updated');project()}}
async function activities(){if(state.role==='student'){const {data}=await sb.from('weekly_logs').select('*').eq('student_id',state.user.id).order('week_number');const next=((data||[]).reduce((m,x)=>Math.max(m,Number(x.week_number||0)),0)+1);document.getElementById('main').innerHTML=head('Weekly Activities','Record practical work and learning outcomes')+'<div class="card"><div class="form two-col"><div class="field"><label>Week</label><input id="wk" type="number" min="1" value="'+next+'"></div><div class="field"><label>Period End</label><input id="we" type="date"></div><div class="field"><label>Activities</label><textarea id="wa" rows="4"></textarea></div><div class="field"><label>Learning Outcomes</label><textarea id="wo" rows="4"></textarea></div></div><button class="btn btn-primary" onclick="saveWeekly()">Save Weekly Log</button></div><div class="grid" style="margin-top:16px">'+(data||[]).map(x=>'<div class="card"><b>Week '+x.week_number+'</b><p>'+esc(x.activities||'')+'</p><small class="muted">'+esc(x.learning_outcomes||'')+'</small><div><span class="badge">'+esc(x.status||'draft')+'</span></div></div>').join('')+'</div>'}else{const {data}=await sb.from('weekly_logs').select('*,profiles(full_name,college_name)').order('week_number');document.getElementById('main').innerHTML=head('Weekly Activities','Student activity records from your permitted college')+'<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Week</th><th>Activities</th><th>Outcome</th><th>Status</th></tr></thead><tbody>'+(data||[]).map(x=>'<tr><td>'+esc(x.profiles?.full_name)+'</td><td>'+x.week_number+'</td><td>'+esc(x.activities||'')+'</td><td>'+esc(x.learning_outcomes||'')+'</td><td>'+esc(x.status||'draft')+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">No weekly logs.</td></tr>'+'</tbody></table></div></div>'}}
async function saveWeekly(){const {data:i}=await sb.from('internships').select('id,start_date').eq('student_id',state.user.id).eq('status','active').limit(1).maybeSingle();if(!i)return toast('Activate your internship first.');const {error}=await sb.from('weekly_logs').upsert({internship_id:i.id,student_id:state.user.id,week_number:Number(document.getElementById('wk').value),period_start:i.start_date||new Date().toISOString().slice(0,10),period_end:document.getElementById('we').value||null,activities:document.getElementById('wa').value.trim(),learning_outcomes:document.getElementById('wo').value.trim(),status:'submitted',submitted_at:new Date().toISOString()},{onConflict:'internship_id,week_number'});if(error)toast(error.message);else{toast('Weekly activity saved');activities()}}
async function attendance(){let q=sb.from('attendance').select(state.role==='student'?'*':'*,profiles(full_name,college_name)').order('attendance_date',{ascending:false});if(state.role==='student')q=q.eq('student_id',state.user.id);const {data}=await q;const rows=data||[],hours=rows.reduce((s,x)=>s+Number(x.hours||0),0),today=new Date().toISOString().slice(0,10),tr=rows.find(x=>x.attendance_date===today);document.getElementById('main').innerHTML=head('Attendance','Track internship attendance and verified hours')+(state.role==='student'?'<div class="card"><b>Today</b><p class="muted">'+(tr?'Attendance marked for today.':'Start your internship day when you begin work.')+'</p><button class="btn btn-primary" onclick="checkIn()" '+(tr?'disabled':'')+'>Check In</button> '+(tr&&!tr.time_out?'<button class="btn btn-soft" onclick="checkOut(\''+tr.id+'\')">Check Out</button>':'')+'</div>':'')+'<div class="grid stats" style="margin-top:16px"><div class="card stat"><div class="label">Days</div><div class="value">'+rows.length+'</div></div><div class="card stat"><div class="label">Hours</div><div class="value">'+hours.toFixed(1)+'</div></div></div><div class="card" style="margin-top:16px"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Date</th><th>Status</th><th>In</th><th>Out</th><th>Hours</th></tr></thead><tbody>'+(rows.map(x=>'<tr><td>'+esc(x.profiles?.full_name||state.profile.full_name)+'</td><td>'+x.attendance_date+'</td><td>'+esc(x.status||'present')+'</td><td>'+esc(x.time_in||'—')+'</td><td>'+esc(x.time_out||'—')+'</td><td>'+Number(x.hours||0).toFixed(2)+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">No attendance records.</td></tr>')+'</tbody></table></div></div>'}
async function checkIn(){const {data:i}=await sb.from('internships').select('id').eq('student_id',state.user.id).eq('status','active').limit(1).maybeSingle();if(!i)return toast('Your internship is not active.');const n=new Date();const {error}=await sb.from('attendance').insert({internship_id:i.id,student_id:state.user.id,attendance_date:n.toISOString().slice(0,10),time_in:n.toTimeString().slice(0,8),status:'present'});if(error)toast(error.message);else{toast('Checked in');attendance()}}
async function checkOut(id){const {data:a}=await sb.from('attendance').select('time_in,attendance_date').eq('id',id).single();if(!a)return;const n=new Date(),hrs=Math.max(0,Math.min(12,(n-new Date(a.attendance_date+'T'+a.time_in))/3600000));const {error}=await sb.from('attendance').update({time_out:n.toTimeString().slice(0,8),hours:Number(hrs.toFixed(2))}).eq('id',id);if(error)toast(error.message);else{toast('Checked out');attendance()}}
async function evaluations(){const {data}=await sb.from('evaluations').select(state.role==='student'?'*':'*,profiles(full_name,college_name)').order('created_at',{ascending:false});document.getElementById('main').innerHTML=head('Evaluations','Performance assessment: technical knowledge, quality, initiative, communication and discipline')+(state.role!=='student'?'<div class="card"><b>Evaluate Internship</b><p class="muted">Enter the internship ID. The student is resolved from the internship record.</p><div class="form"><input id="evalInt" placeholder="Internship UUID"><button class="btn btn-primary" onclick="createEvaluation()">Open Evaluation Form</button></div></div>':'')+'<div class="card" style="margin-top:16px"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Technical</th><th>Quality</th><th>Initiative</th><th>Communication</th><th>Discipline</th><th>Overall</th><th>Action</th></tr></thead><tbody>'+(data||[]).map(x=>'<tr><td>'+esc(x.profiles?.full_name||state.profile.full_name)+'</td><td>'+esc(x.technical_knowledge??'—')+'</td><td>'+esc(x.quality_of_work??'—')+'</td><td>'+esc(x.initiative_problem_solving??'—')+'</td><td>'+esc(x.communication??'—')+'</td><td>'+esc(x.discipline_punctuality??'—')+'</td><td>'+esc(x.overall_score??'—')+'</td><td>'+(state.role!=='student'?'<button class="btn btn-soft" onclick="editEvaluation(\''+x.id+'\',\''+x.student_id+'\',\''+x.internship_id+'\')">Edit</button>':'—')+'</td></tr>').join('')||'<tr><td colspan="8" class="empty">No evaluation yet.</td></tr>'+'</tbody></table></div></div>'}
async function createEvaluation(){const id=document.getElementById('evalInt').value.trim();if(!id)return toast('Internship ID required.');const {data:i,error}=await sb.from('internships').select('id,student_id,status').eq('id',id).single();if(error||!i)return toast('Internship not found.');const vals=['technical knowledge','quality of work','initiative/problem solving','communication','discipline/punctuality'].map(k=>prompt(k+' (0-100):','80'));if(vals.some(v=>v===null))return;const overall=vals.reduce((a,v)=>a+Number(v),0)/5;const rating=overall>=90?'Excellent':overall>=75?'Very Good':overall>=60?'Good':'Needs Improvement';const {error:ee}=await sb.from('evaluations').upsert({student_id:i.student_id,internship_id:i.id,technical_knowledge:Number(vals[0]),quality_of_work:Number(vals[1]),initiative_problem_solving:Number(vals[2]),communication:Number(vals[3]),discipline_punctuality:Number(vals[4]),overall_score:Number(overall.toFixed(2)),rating,supervisor_remarks:prompt('Supervisor remarks:','')||null,evaluated_by:state.user.id,evaluated_at:new Date().toISOString()},{onConflict:'internship_id'});if(ee)toast(ee.message);else{toast('Evaluation saved');evaluations()}}
async function editEvaluation(id,studentId,internshipId){const v=['technical_knowledge','quality_of_work','initiative_problem_solving','communication','discipline_punctuality'].map(k=>prompt(k.replaceAll('_',' ')+' (0-100):','80'));if(v.some(x=>x===null))return;const overall=v.reduce((a,x)=>a+Number(x),0)/5;const rating=overall>=90?'Excellent':overall>=75?'Very Good':overall>=60?'Good':'Needs Improvement';const {error}=await sb.from('evaluations').upsert({id,student_id:studentId,internship_id:internshipId,technical_knowledge:Number(v[0]),quality_of_work:Number(v[1]),initiative_problem_solving:Number(v[2]),communication:Number(v[3]),discipline_punctuality:Number(v[4]),overall_score:Number(overall.toFixed(2)),rating,supervisor_remarks:prompt('Supervisor remarks:','')||null,evaluated_by:state.user.id,evaluated_at:new Date().toISOString()},{onConflict:'internship_id'});if(error)toast(error.message);else{toast('Evaluation saved');evaluations()}}
async function progress(){const {data}=await sb.from('internships').select('id,student_id,total_hours,credits,status,domain,profiles(full_name,college_name)').order('created_at',{ascending:false});document.getElementById('main').innerHTML=head('Progress','Internship completion overview')+'<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Sector</th><th>Status</th><th>Required Hours</th><th>Credits</th></tr></thead><tbody>'+(data||[]).map(x=>'<tr><td>'+esc(x.profiles?.full_name)+'</td><td>'+esc(x.domain)+'</td><td>'+esc(x.status)+'</td><td>'+x.total_hours+'</td><td>'+x.credits+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">No internships.</td></tr>'+'</tbody></table></div></div>'}
async function documents(){let q=sb.from('student_documents').select('*,profiles(full_name,college_name)').order('created_at',{ascending:false});if(state.role==='student')q=q.eq('student_id',state.user.id);const {data}=await q;document.getElementById('main').innerHTML=head('Documents','Secure document storage with college-level access control')+(state.role==='student'?'<div class="card"><div class="form two-col"><div class="field"><label>Document Type</label><select id="dtype"><option>Marksheet</option><option>ID Proof</option><option>Acceptance Letter</option><option>Consent Letter</option><option>Internship Report</option><option>Attendance Record</option><option>Evaluation</option><option>Certificate</option><option>Other</option></select></div><div class="field"><label>File</label><input id="dfile" type="file" accept="application/pdf,image/jpeg,image/png,image/webp"></div></div><button class="btn btn-primary" style="margin-top:14px" onclick="uploadDoc()">Upload Securely</button></div>':'')+'<div class="card" style="margin-top:16px"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Type</th><th>Title</th><th>Status</th><th>Date</th><th>File</th></tr></thead><tbody>'+(data||[]).map(x=>'<tr><td>'+esc(x.profiles?.full_name||state.profile.full_name)+'</td><td>'+esc(x.document_type)+'</td><td>'+esc(x.document_title)+'</td><td>'+esc(x.verification_status)+'</td><td>'+new Date(x.created_at).toLocaleDateString()+'</td><td><button class="btn btn-soft" onclick="downloadDoc(\''+x.file_path+'\')">Open</button>'+(state.role!=='student'&&x.verification_status==='pending'?'<button class="btn btn-primary" style="margin-left:5px" onclick="verifyDoc(\''+x.id+'\')">Verify</button>':'')+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">No documents.</td></tr>'+'</tbody></table></div></div>'}

async function settings(){const {data}=await sb.from('portal_settings').select('*').eq('setting_key','internship_defaults').single();const c=data?.setting_value||{};document.getElementById('main').innerHTML=head('Portal Settings','Academic defaults and payment configuration')+'<div class="card"><div class="form two-col"><div class="field"><label>Internship Fee (₹)</label><input id="fee" type="number" min="0" value="'+Number(c.application_fee||0)+'"></div><div class="field"><label>Default Hours</label><input id="defh" type="number" value="'+Number(c.default_hours||120)+'"></div><div class="field"><label>Default Credits</label><input id="defc" type="number" value="'+Number(c.default_credits||4)+'"></div><div class="field"><label>Minimum Hours</label><input id="minh" type="number" value="'+Number(c.min_hours||90)+'"></div><div class="field"><label>Maximum Hours</label><input id="maxh" type="number" value="'+Number(c.max_hours||120)+'"></div><div class="field"><label>Currency</label><input id="curr" value="'+esc(c.currency||'INR')+'"></div></div><div class="alert" style="margin-top:14px">Razorpay secret credentials stay in Supabase Edge Function Secrets and never in GitHub/browser code.</div><button class="btn btn-primary" style="margin-top:14px" onclick="saveSettings()">Save Settings</button></div>'}

async function issueCertificate(){const id=document.getElementById('certInt').value.trim();if(!id)return toast('Internship ID required.');const {data:i}=await sb.from('internships').select('*').eq('id',id).single();if(!i)return toast('Internship not found.');const {data:a}=await sb.from('attendance').select('hours').eq('internship_id',id);const hours=(a||[]).reduce((s,x)=>s+Number(x.hours||0),0);const {data:e}=await sb.from('evaluations').select('overall_score').eq('internship_id',id).maybeSingle();if(hours<Number(i.total_hours))return toast('Required attendance hours are not complete.');if(!e)return toast('Final evaluation is required.');const token=crypto.randomUUID(),num='SHX-CERT-'+new Date().getFullYear()+'-'+Math.random().toString(36).slice(2,8).toUpperCase();const {error}=await sb.from('certificates').insert({internship_id:id,student_id:i.student_id,certificate_number:num,domain:document.getElementById('certDomain').value.trim()||i.domain,start_date:i.start_date,end_date:i.end_date,total_hours:i.total_hours,credits:i.credits,issued_date:new Date().toISOString().slice(0,10),verification_token:token,status:'issued',certificate_url:SUPABASE_URL+'/functions/v1/certificate-verify?token='+token});if(error)toast(error.message);else{await sb.from('internships').update({status:'completed'}).eq('id',id);toast('Certificate issued');certificates()}}
async function printCertificate(id){const {data:c}=await sb.from('certificates').select('*,profiles(full_name,college_name)').eq('id',id).single();if(!c)return;const w=window.open('','_blank');if(!w)return toast('Allow pop-ups.');w.document.write('<!doctype html><html><head><title>'+esc(c.certificate_number)+'</title><style>body{font-family:Georgia,serif;background:#f4f1ea;padding:40px}.cert{max-width:900px;margin:auto;background:#fff;padding:70px;border:12px double #6d28d9;text-align:center}h1{color:#6d28d9;font-size:42px}h2{font-size:30px}.meta{margin-top:35px;display:flex;justify-content:space-between;font-size:12px}</style></head><body><div class="cert"><b>SHIVORIX PVT. LTD.</b><h1>INTERNSHIP COMPLETION CERTIFICATE</h1><p>This is to certify that</p><h2>'+esc(c.profiles?.full_name||'Student')+'</h2><p>has successfully completed the internship in <b>'+esc(c.domain)+'</b> for <b>'+c.total_hours+' hours</b> and <b>'+c.credits+' credits</b>.</p><p>Certificate No.: <b>'+esc(c.certificate_number)+'</b></p><div class="meta"><span>Issued: '+c.issued_date+'</span><span>Verification: '+c.verification_token+'</span></div></div><script>window.print()<\/script></body></html>');w.document.close()}
async function reports(){const {count:st}=await sb.from('profiles').select('*',{count:'exact',head:true}).eq('role','student');const {count:ap}=await sb.from('internship_applications').select('*',{count:'exact',head:true});const {count:it}=await sb.from('internships').select('*',{count:'exact',head:true});const {count:ce}=await sb.from('certificates').select('*',{count:'exact',head:true});document.getElementById('main').innerHTML=head('Reports','Live operational summary')+'<div class="grid stats"><div class="card stat"><div class="label">Students</div><div class="value">'+(st||0)+'</div></div><div class="card stat"><div class="label">Applications</div><div class="value">'+(ap||0)+'</div></div><div class="card stat"><div class="label">Internships</div><div class="value">'+(it||0)+'</div></div><div class="card stat"><div class="label">Certificates</div><div class="value">'+(ce||0)+'</div></div></div><div class="card" style="margin-top:16px"><button class="btn btn-primary" onclick="exportApplications()">Export Applications CSV</button> <button class="btn btn-soft" onclick="exportStudents()">Export Students CSV</button></div>'}
async function exportApplications(){const {data}=await sb.from('internship_applications').select('application_number,student_id,college_id,sector_id,mode,requested_hours,requested_credits,status,node_review_status,payment_status,created_at');downloadCsv('applications.csv',data||[])}
async function exportStudents(){const {data}=await sb.from('profiles').select('full_name,email,college_name,course,department,semester,academic_session,university_registration_number,college_roll_number').eq('role','student');downloadCsv('students.csv',data||[])}
function downloadCsv(name,rows){if(!rows.length)return toast('No data.');const keys=Object.keys(rows[0]);const csv=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click()}
</script>
<style>

function login(){document.getElementById('root').innerHTML=`<div class="login-screen"><div class="login-box"><div class="login-art"><div class="brand"><div>SHIVORIX<small>INTERNSHIP PORTAL</small></div></div><div class="eyebrow">DIGITAL INTERNSHIP MANAGEMENT</div><h1>Start your<br><span>professional journey.</span></h1><p class="hero-copy">A structured platform for student registration, internship coordination, practical learning and academic completion.</p><div class="trust-points"><div><b>01</b><span>Student-first registration & profile management</span></div><div><b>02</b><span>College-wise academic coordination</span></div><div><b>03</b><span>Sector-based internship & practical learning</span></div><div><b>04</b><span>Attendance, credits, projects & completion records</span></div></div><div class="hero-foot"><span>SHIVORIX</span><span>Internship Management Platform</span></div></div><div class="login-form"><div class="brand"><div><b>SHIVORIX</b><small>Internship Management Portal</small></div></div><div class="tabs"><button id="registerTab" class="active" onclick="setMode('register')">Student Registration</button><button id="studentTab" onclick="setMode('student')">Student Login</button><button id="staffTab" onclick="setMode('staff')">Staff Login</button></div><div id="loginPanel"></div></div></div></div>`;renderLoginPanel()}function setMode(m){state.mode=m;['registerTab','studentTab','staffTab'].forEach(id=>{const e=document.getElementById(id);if(e)e.classList.toggle('active',(m==='register'&&id==='registerTab')||(m==='student'&&id==='studentTab')||(m==='staff'&&id==='staffTab'))});renderLoginPanel()}
const DEMO_COLLEGES=[{id:'fc23747c-da34-4b36-b2e2-024e5d89e68e',name:'SHIVORIX Demo College',university_name:'Demo University'},{id:'c7cd991d-edd7-45d4-855f-d3414589e4a1',name:'SHIVORIX Test Institute',university_name:'Demo University'}];const DEMO_SECTORS=[{"id":"1f87a859-5a93-4384-9176-5916c9d62e3a","name":"Artificial Intelligence & Machine Learning"},{"id":"a7d4ebc7-4546-4c4c-9904-b4b7d6d21f87","name":"Data Science & Data Analytics"},{"id":"17cd30d9-c3f1-4a8c-bd12-b22f0a8c801a","name":"Web Development"},{"id":"fae7a32b-3b67-49a3-9be5-03f0b88c0268","name":"Software Development"},{"id":"0194af96-0768-4b04-b9e4-3dbc105034ea","name":"Mobile App Development"},{"id":"0e2bfb6b-0652-4859-8316-9ffd6e7f3a21","name":"Digital Marketing"},{"id":"3cd22fb7-0e1f-49fe-a616-9e5dd9ab3105","name":"Cyber Security"},{"id":"ca668e8b-dc1b-41d2-b473-9645397778f2","name":"Cloud Computing"},{"id":"b81d039a-12dd-4a90-b462-8e4320f7e424","name":"Graphic Design & UI/UX"},{"id":"fb3dfa8c-6c3c-4159-902b-a189ee7d87d9","name":"Business & Management"},{"id":"8e93fb4b-04f4-4b9e-aa25-65b0a82cfeb6","name":"Finance & Accounting"},{"id":"fb4aa64e-74be-4b90-9b7d-7c42ac2a65b9","name":"Human Resource"},{"id":"857c32d5-563d-4cac-82bc-c6923c7f34ca","name":"Education & Training"},{"id":"14c1e5a3-9658-4ca3-bfd9-d86cef30fa8b","name":"Research & Development"},{"id":"f8f6bda4-14d2-41c8-8a2a-6e37e1fa0022","name":"Social Work / NGO"},{"id":"13741200-201d-42f8-aca3-89695b2ca4ef","name":"Other"}];
async function loadCollegeOptions(){try{const r=await fetch(SUPABASE_URL+'/functions/v1/student-registration',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'colleges'})});const d=await r.json();if(!r.ok||!Array.isArray(d.colleges)||!d.colleges.length)throw Error('fallback');return d.colleges}catch(e){return DEMO_COLLEGES}}

function renderLoginPanel(){const p=document.getElementById('loginPanel');if(state.mode==='register'){p.innerHTML=`<h2>Create student account</h2><p class="muted">Register once with your academic details. After registration, use Student Login with OTP.</p><div class="form two-col" style="margin-top:18px"><div class="field"><label>Full Name *</label><input id="rName" placeholder="Enter full name"></div><div class="field"><label>Father's Name *</label><input id="rFather" placeholder="Enter father's name"></div><div class="field"><label>Mother's Name *</label><input id="rMother" placeholder="Enter mother's name"></div><div class="field"><label>Mobile Number *</label><input id="rMobile" type="tel" placeholder="10-digit mobile number"></div><div class="field"><label>Email Address *</label><input id="rEmail" type="email" placeholder="Registered email"></div><div class="field"><label>University Registration No. *</label><input id="rReg" placeholder="University registration number"></div><div class="field"><label>College Roll No. *</label><input id="rRoll" placeholder="College roll number"></div><div class="field"><label>College *</label><select id="rCollege"><option value="">Loading colleges...</option></select></div><div class="field"><label>Internship Sector *</label><select id="rSector"><option value="">Loading sectors...</option></select></div><div class="field"><label>Course *</label><input id="rCourse" placeholder="e.g. B.Tech / B.Sc."></div><div class="field"><label>Department *</label><input id="rDept" placeholder="Department / Branch"></div><div class="field"><label>Semester *</label><input id="rSem" placeholder="e.g. 5th Semester"></div><div class="field"><label>Academic Session *</label><input id="rSession" placeholder="e.g. 2026-27"></div><div class="field"><label>Create Password *</label><input id="rPassword" type="password" minlength="8" placeholder="Minimum 8 characters"></div><button class="btn btn-primary" style="grid-column:1/-1" onclick="registerStudent()">Create Student Account</button><div id="loginMsg" style="grid-column:1/-1"></div></div>`;loadCollegeOptions().then(cs=>{const e=document.getElementById('rCollege');if(e)e.innerHTML='<option value="">Select your college</option>'+cs.map(c=>`<option value="${c.id}">${esc(c.name)} — ${esc(c.university_name||'')}</option>`).join('')}).catch(e=>{const m=document.getElementById('loginMsg');if(m)m.innerHTML='<div class="alert">'+esc(e.message)+'</div>'});loadSectorOptions().then(ss=>{const e=document.getElementById('rSector');if(e)e.innerHTML='<option value="">Select internship sector</option>'+ss.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}).catch(e=>{const m=document.getElementById('loginMsg');if(m)m.innerHTML='<div class="alert">'+esc(e.message)+'</div>'})}else if(state.mode==='student'){p.innerHTML=`<h2>Student Login</h2><p class="muted">Login securely using your University Registration No., College Roll No. and password. Email OTP will be enabled after the production email service is configured.</p><div class="form" style="margin-top:20px"><div class="field"><label>University Registration No.</label><input id="reg" placeholder="Enter registration number"></div><div class="field"><label>College Roll No.</label><input id="roll" placeholder="Enter college roll number"></div><div class="field"><label>Password</label><input id="studentPass" type="password" placeholder="Enter password" autocomplete="current-password"></div><button class="btn btn-primary" onclick="studentPasswordLogin()">Login Securely</button><div style="display:flex;justify-content:space-between;gap:12px;margin-top:12px"><a href="#" onclick="showForgotPassword();return false">Forgot / Reset Password?</a><a href="#" onclick="setMode('register');return false">Create your account</a></div><div id="loginMsg"></div></div>`}else{p.innerHTML=`<h2>Authorized Staff Login</h2><p class="muted">For SHIVORIX Admin and assigned Node Officers.</p><div class="form" style="margin-top:20px"><div class="field"><label>Official Email</label><input id="staffEmail" type="email" placeholder="Enter official email"></div><div class="field"><label>Password</label><input id="staffPass" type="password" placeholder="Enter password"></div><button class="btn btn-primary" onclick="staffLogin()">Secure Staff Login</button><div class="alert" style="margin-top:10px">Staff accounts are provisioned by SHIVORIX Admin.</div><div id="loginMsg"></div></div>`}}
function showForgotPassword(){state.mode='forgot';const p=document.getElementById('loginPanel');if(!p){login();return}p.innerHTML=`<h2>Reset Password</h2><p class="muted">Enter the email address used during student registration. We will send a secure password reset link.</p><div class="form" style="margin-top:20px"><div class="field"><label>Registered Email *</label><input id="resetEmail" type="email" autocomplete="email" placeholder="Enter registered email"></div><button class="btn btn-primary" onclick="sendPasswordReset()">Send Reset Link</button><button class="btn btn-soft" onclick="setMode('student')" style="margin-top:8px">Back to Student Login</button><div id="loginMsg"></div></div>`}
async function sendPasswordReset(){const email=document.getElementById('resetEmail')?.value.trim(),m=document.getElementById('loginMsg');if(m)m.innerHTML='';if(!email){if(m)m.innerHTML='<div class="alert">Registered email is required.</div>';return}try{const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});if(error)throw error;if(m)m.innerHTML='<div class="success">If this email is registered, a password reset link has been sent. Please check your inbox.</div>'}catch(e){if(m)m.innerHTML='<div class="alert">'+esc(e.message||'Unable to send reset link.')+'</div>'}}
function showPasswordRecovery(){document.getElementById('root').innerHTML=`<div class="login-screen"><div class="login-form" style="max-width:520px;margin:auto"><div class="brand"><div><b>SHIVORIX</b><small>Internship Management Portal</small></div></div><h2>Set New Password</h2><p class="muted">Create a new password for your student account.</p><div class="form" style="margin-top:20px"><div class="field"><label>New Password *</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Minimum 8 characters"></div><div class="field"><label>Confirm New Password *</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Re-enter password"></div><button class="btn btn-primary" onclick="updateRecoveredPassword()">Update Password</button><div id="loginMsg"></div></div></div></div>`}
async function updateRecoveredPassword(){const password=document.getElementById('newPassword')?.value||'',confirm=document.getElementById('confirmPassword')?.value||'',m=document.getElementById('loginMsg');if(password.length<8){m.innerHTML='<div class="alert">Password must be at least 8 characters.</div>';return}if(password!==confirm){m.innerHTML='<div class="alert">Passwords do not match.</div>';return}try{const {error}=await sb.auth.updateUser({password});if(error)throw error;m.innerHTML='<div class="success">Password updated successfully. You can now login with your Registration No., Roll No. and new password.</div>';setTimeout(async()=>{await sb.auth.signOut();login();setMode('student')},1400)}catch(e){m.innerHTML='<div class="alert">'+esc(e.message||'Unable to update password.')+'</div>'}}
async function registerStudent(){const m=document.getElementById('loginMsg');m.innerHTML='';const body={action:'register',full_name:document.getElementById('rName').value.trim(),father_name:document.getElementById('rFather').value.trim(),mother_name:document.getElementById('rMother').value.trim(),mobile:document.getElementById('rMobile').value.trim(),email:document.getElementById('rEmail').value.trim(),university_registration_number:document.getElementById('rReg').value.trim(),college_roll_number:document.getElementById('rRoll').value.trim(),college_id:document.getElementById('rCollege').value,course:document.getElementById('rCourse').value.trim(),department:document.getElementById('rDept').value.trim(),semester:document.getElementById('rSem').value.trim(),academic_session:document.getElementById('rSession').value.trim(),password:document.getElementById('rPassword').value,internship_sector_id:document.getElementById('rSector').value};try{const r=await fetch(SUPABASE_URL+'/functions/v1/student-registration',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);m.innerHTML='<div class="success">'+esc(d.message)+'</div>';setTimeout(()=>setMode('student'),1200)}catch(e){m.innerHTML='<div class="alert">'+esc(e.message)+'</div>'}}
async function studentPasswordLogin(){const reg=document.getElementById('reg').value.trim(),roll=document.getElementById('roll').value.trim(),password=document.getElementById('studentPass').value,m=document.getElementById('loginMsg');m.innerHTML='';if(!reg||!roll||!password){m.innerHTML='<div class="alert">Registration No., Roll No. and password are required.</div>';return}try{const r=await fetch(SUPABASE_URL+'/functions/v1/student-password-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({registration_no:reg,roll_no:roll,password})});const d=await r.json();if(!r.ok)throw Error(d.error);const {data:sessionData,error:sessionError}=await sb.auth.setSession(d.session);if(sessionError)throw sessionError;if(!sessionData?.session?.user)throw Error('Login session could not be established. Please try again.');await boot(sessionData.session.user,d.profile||null)}catch(e){m.innerHTML='<div class="alert">'+esc(e.message||'Login failed. Please try again.')+'</div>'}}
async function sendOtp(){const reg=document.getElementById('reg').value.trim(),roll=document.getElementById('roll').value.trim(),m=document.getElementById('loginMsg');m.innerHTML='';if(!reg||!roll){m.innerHTML='<div class="alert">Both fields are required.</div>';return}try{const r=await fetch(OTP_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'start',registration_no:reg,roll_no:roll})});const d=await r.json();if(!r.ok)throw Error(d.error);state.challenge={registration_no:reg,roll_no:roll};state.otpCooldownUntil=Date.now()+60000;renderOtpPanel(d.masked_email||'your registered email')}catch(e){m.innerHTML='<div class="alert">'+esc(e.message)+'</div>'}}
function renderOtpPanel(masked){
 const wait=Math.max(0,Math.ceil((state.otpCooldownUntil-Date.now())/1000));
 const buttonText=wait?'Resend OTP in '+wait+'s':'Resend OTP';
 document.getElementById('loginPanel').innerHTML='<h2>Verify OTP</h2><p class="muted">OTP sent to <b>'+esc(masked)+'</b></p><div class="form" style="margin-top:20px"><div class="field"><label>6-digit OTP</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter OTP"></div><button class="btn btn-primary" onclick="verifyOtp()">Verify & Continue</button><button id="resendOtpBtn" class="btn btn-soft" onclick="resendOtp()" '+(wait?'disabled':'')+'>'+buttonText+'</button><button class="btn btn-soft" onclick="setMode(\'student\')">Change Login Details</button><div id="loginMsg"></div><p class="muted" style="font-size:12px">OTP is sent only to your registered email. Never share it with anyone.</p></div>';
 const input=document.getElementById('otp');
 if(input){input.addEventListener('input',function(){this.value=this.value.replace(/[^0-9]/g,'').slice(0,6)})}
 clearInterval(state.otpTimer);
 if(wait){state.otpTimer=setInterval(function(){const button=document.getElementById('resendOtpBtn');if(!button){clearInterval(state.otpTimer);return}const left=Math.max(0,Math.ceil((state.otpCooldownUntil-Date.now())/1000));if(left===0){button.disabled=false;button.textContent='Resend OTP';clearInterval(state.otpTimer)}else{button.textContent='Resend OTP in '+left+'s'}},500)}
}
function resendOtp(){
 if(Date.now()<state.otpCooldownUntil)return;
 const message=document.getElementById('loginMsg');

async function submitAssignment(id){
 try{
  const file=document.getElementById('sf_'+id)?.files?.[0]||null;
  const url=document.getElementById('su_'+id).value.trim()||null;
  if(!file&&!url)throw Error('Upload a file or add a submission URL.');
  const {data:i}=await sb.from('internships').select('id').eq('student_id',state.user.id).eq('status','active').limit(1).maybeSingle();
  if(!i)throw Error('Assignment submission unlocks after internship activation.');
  const allowed=['application/pdf','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document','application/vnd.ms-powerpoint','application/vnd.openxmlformats-officedocument.presentationml.presentation','application/zip','application/x-zip-compressed','image/jpeg','image/png','image/webp'];
  if(file&&(file.size>25*1024*1024||!allowed.includes(file.type)))throw Error('Allowed: PDF, DOC/DOCX, PPT/PPTX, ZIP, JPG, PNG, WEBP; maximum 25 MB.');
  const {data:old}=await sb.from('assignment_submissions').select('*').eq('assignment_id',id).eq('student_id',state.user.id).maybeSingle();
  let path=old?.file_path||null;
  if(file){const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');path=state.user.id+'/'+i.id+'/assignments/'+id+'/'+Date.now()+'_'+safe;const {error}=await sb.storage.from('internship-submissions').upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;}
  const payload={assignment_id:id,internship_id:i.id,student_id:state.user.id,submission_url:url,notes:document.getElementById('sn_'+id).value.trim()||null,submitted_at:new Date().toISOString(),status:'submitted',file_path:path,file_name:file?.name||old?.file_name||null,mime_type:file?.type||old?.mime_type||null,file_size:file?.size||old?.file_size||null};
  const {error}=await sb.from('assignment_submissions').upsert(payload,{onConflict:'assignment_id,student_id'});if(error)throw error;
  if(file&&old?.file_path&&old.file_path!==path)await sb.storage.from('internship-submissions').remove([old.file_path]);
  toast('Assignment submitted successfully');assignments();
 }catch(e){toast(e.message||'Unable to submit assignment')}
}

  return;
 }
 const {data}=await sb.from('projects').select('*,profiles(full_name,college_name)').order('submitted_at',{ascending:false});
 document.getElementById('main').innerHTML=head('Project & Report Review','Review project and final report submissions')+'<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Title</th><th>Project</th><th>Report</th><th>Status</th><th>Score</th><th>Action</th></tr></thead><tbody>'+(data||[]).map(x=>'<tr><td>'+esc(x.profiles?.full_name)+'</td><td>'+esc(x.title)+'</td><td>'+(x.project_file_path?'<button class="btn btn-soft" onclick="openSubmissionFile(\''+x.project_file_path+'\')">Open</button>':'—')+'</td><td>'+(x.report_file_path?'<button class="btn btn-soft" onclick="openSubmissionFile(\''+x.report_file_path+'\')">Open</button>':'—')+'</td><td>'+esc(x.status||'draft')+'</td><td>'+esc(x.score??'—')+'</td><td><button class="btn btn-soft" onclick="reviewProject(\''+x.id+'\')">Review</button></td></tr>').join('')||'<tr><td colspan="7" class="empty">No projects.</td></tr>'+'</tbody></table></div></div>';
}
async function saveProject(internshipId){
 try{
  const title=document.getElementById('ptitle').value.trim();if(!title)throw Error('Project title is required.');
  const projectFile=document.getElementById('pfileupload')?.files?.[0]||null,reportFile=document.getElementById('rfileupload')?.files?.[0]||null;
  const allowed=['application/pdf','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document','application/vnd.ms-powerpoint','application/vnd.openxmlformats-officedocument.presentationml.presentation','application/zip','application/x-zip-compressed','image/jpeg','image/png','image/webp'];
  for(const f of [projectFile,reportFile])if(f&&(f.size>25*1024*1024||!allowed.includes(f.type)))throw Error('Allowed: PDF, DOC/DOCX, PPT/PPTX, ZIP, JPG, PNG, WEBP; maximum 25 MB.');
  const {data:old}=await sb.from('projects').select('*').eq('internship_id',internshipId).maybeSingle();
  const payload={internship_id:internshipId,student_id:state.user.id,title,description:document.getElementById('pdesc').value.trim()||null,project_url:document.getElementById('purl').value.trim()||null,submitted_at:new Date().toISOString(),status:'submitted'};
  if(projectFile){const safe=projectFile.name.replace(/[^a-zA-Z0-9._-]/g,'_');payload.project_file_path=state.user.id+'/'+internshipId+'/project/'+Date.now()+'_'+safe;payload.project_file_name=projectFile.name;payload.project_file_mime_type=projectFile.type;payload.project_file_size=projectFile.size;const {error}=await sb.storage.from('internship-submissions').upload(payload.project_file_path,projectFile,{contentType:projectFile.type,upsert:false});if(error)throw error;}
  if(reportFile){const safe=reportFile.name.replace(/[^a-zA-Z0-9._-]/g,'_');payload.report_file_path=state.user.id+'/'+internshipId+'/report/'+Date.now()+'_'+safe;payload.report_file_name=reportFile.name;payload.report_file_mime_type=reportFile.type;payload.report_file_size=reportFile.size;const {error}=await sb.storage.from('internship-submissions').upload(payload.report_file_path,reportFile,{contentType:reportFile.type,upsert:false});if(error)throw error;}
  const {error}=await sb.from('projects').upsert(payload,{onConflict:'internship_id'});if(error)throw error;
  const oldPaths=[];if(projectFile&&old?.project_file_path)oldPaths.push(old.project_file_path);if(reportFile&&old?.report_file_path)oldPaths.push(old.report_file_path);if(oldPaths.length)await sb.storage.from('internship-submissions').remove(oldPaths);
  toast('Project and report submitted successfully');project();
 }catch(e){toast(e.message||'Unable to submit project/report')}
}

async function uploadDoc(){try{const f=document.getElementById('dfile').files[0];if(!f)throw Error('Please select a file.');if(f.size>10*1024*1024)throw Error('Maximum file size is 10 MB.');const allowed=['application/pdf','image/jpeg','image/png','image/webp'];if(!allowed.includes(f.type))throw Error('Only PDF, JPG, PNG and WEBP files are allowed.');const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=state.user.id+'/'+Date.now()+'_'+safe;const {error:up}=await sb.storage.from('student-documents').upload(path,f,{contentType:f.type,upsert:false});if(up)throw up;const {data:p}=await sb.from('profiles').select('college_id').eq('id',state.user.id).single();const {error:db}=await sb.from('student_documents').insert({student_id:state.user.id,college_id:p?.college_id||null,document_type:document.getElementById('dtype').value,document_title:f.name,file_path:path,mime_type:f.type,file_size:f.size,uploaded_by:state.user.id});if(db)throw db;toast('Document uploaded securely');documents()}catch(e){toast(e.message)}}

 const pm=new Map((prog||[]).map(x=>[x.module_id,x]));

 const pct=mods?.length?Math.round(completed*100/mods.length):0;
 document.getElementById('main').innerHTML=head('Online Training',`${esc(sec.name)} · ${completed}/${mods?.length||0} modules completed`)+
 `<div class="card"><div style="display:flex;justify-content:space-between;gap:15px"><div><b>Training Progress</b><p class="muted" style="margin:5px 0 0">Complete each module as part of your internship learning journey.</p></div><strong>${pct}%</strong></div><div class="progress" style="margin-top:14px"><div class="bar" style="width:${pct}%"></div></div></div>

async function evaluations(){const {data}=await sb.from('evaluations').select('*').order('created_at',{ascending:false});document.getElementById('main').innerHTML=head('Evaluations','Internship performance evaluations')+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Overall</th><th>Rating</th><th>Evaluated</th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td>${x.student_id}</td><td>${x.overall_score??'—'}</td><td>${esc(x.rating||'—')}</td><td>${x.evaluated_at?new Date(x.evaluated_at).toLocaleDateString():'—'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No evaluations yet.</td></tr>'}</tbody></table></div></div>`}
async function showNotifications(){const {data}=await sb.from('notifications').select('*').eq('user_id',state.user.id).order('created_at',{ascending:false}).limit(10);toast(data?.length?data[0].message:'No new notifications')}
async function logout(){await sb.auth.signOut();state={user:null,profile:null,role:null,section:'dashboard',challenge:null,mode:'student'};login()}

async function nodeAttendance(){
 const c=state.profile.college_id;
 const {data:students}=await sb.from('profiles').select('id,full_name,college_roll_number,university_registration_number').eq('role','student').eq('college_id',c).order('full_name');
 const {data:rows}=await sb.from('attendance').select('*,profiles(full_name,college_roll_number)').eq('profiles.college_id',c).order('attendance_date',{ascending:false}).limit(100);
 document.getElementById('main').innerHTML=head('Attendance','Record and review attendance for your assigned college')+
 '<div class="card"><b>Record Attendance</b><div class="form two-col" style="margin-top:12px"><div class="field"><label>Student *</label><select id="attStudent">'+(students||[]).map(x=>'<option value="'+x.id+'">'+esc(x.full_name)+' — '+esc(x.college_roll_number||x.university_registration_number||'')+'</option>').join('')+'</select></div><div class="field"><label>Date *</label><input id="attDate" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Status</label><select id="attStatus"><option value="present">Present</option><option value="absent">Absent</option><option value="leave">Leave</option><option value="holiday">Holiday</option></select></div><div class="field"><label>Hours</label><input id="attHours" type="number" min="0" max="12" step="0.25" value="6"></div><div class="field full"><label>Remarks</label><input id="attRemarks"></div></div><button class="btn btn-primary" onclick="saveOfficerAttendance()">Save Attendance</button></div>'+
 '<div class="card" style="margin-top:16px"><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Student</th><th>Status</th><th>Hours</th><th>Remarks</th></tr></thead><tbody>'+
 ((rows||[]).map(x=>'<tr><td>'+x.attendance_date+'</td><td>'+esc(x.profiles?.full_name||'')+'</td><td>'+esc(x.status)+'</td><td>'+x.hours+'</td><td>'+esc(x.remarks||'')+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">No attendance records.</td></tr>')+
 '</tbody></table></div></div>';
}
async function saveOfficerAttendance(){
 try{
  const student_id=document.getElementById('attStudent').value,attendance_date=document.getElementById('attDate').value,status=document.getElementById('attStatus').value,hours=Number(document.getElementById('attHours').value||0),remarks=document.getElementById('attRemarks').value.trim()||null;
  if(!student_id||!attendance_date)throw Error('Student and date are required.');
  if(hours<0||hours>12)throw Error('Hours must be between 0 and 12.');
  const {data:i}=await sb.from('internships').select('id').eq('student_id',student_id).eq('status','active').maybeSingle();
  if(!i)throw Error('This student does not have an active internship.');
  const {data:existing}=await sb.from('attendance').select('id').eq('internship_id',i.id).eq('attendance_date',attendance_date).maybeSingle();
  const payload={internship_id:i.id,student_id,attendance_date,status,hours,remarks};if(existing)payload.id=existing.id;
  const {error}=await sb.from('attendance').upsert(payload);if(error)throw error;
  toast('Attendance saved successfully');nodeAttendance();
 }catch(e){toast(e.message||'Unable to save attendance')}
}
async function nodeActivities(){
 const c=state.profile.college_id;
 const {data}=await sb.from('weekly_logs').select('*,profiles(full_name,college_roll_number)').eq('profiles.college_id',c).order('week_number',{ascending:false});
 document.getElementById('main').innerHTML=head('Weekly Activities','Review student weekly activity submissions')+
 '<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Week</th><th>Activities</th><th>Outcomes</th><th>Status</th><th>Action</th></tr></thead><tbody>'+
 ((data||[]).map(x=>'<tr><td>'+esc(x.profiles?.full_name||'')+'</td><td>'+x.week_number+'</td><td>'+esc(x.activities||'')+'</td><td>'+esc(x.learning_outcomes||'')+'</td><td>'+esc(x.status)+'</td><td><button class="btn btn-soft" onclick="reviewWeeklyOfficer(\''+x.id+'\')">Review</button></td></tr>').join('')||'<tr><td colspan="6" class="empty">No weekly submissions.</td></tr>')+
 '</tbody></table></div></div>';

async function reviewWeeklyOfficer(id){
 const feedback=prompt('Node Officer feedback:','')||null;
 const raw=prompt('Status: reviewed or returned','reviewed')||'reviewed';
 const status=['reviewed','returned'].includes(raw)?raw:'reviewed';
 const {error}=await sb.from('weekly_logs').update({status,mentor_feedback:feedback}).eq('id',id);
 if(error)toast(error.message);else{toast('Weekly activity review saved');nodeActivities()}
}

async function nodeProgress(){
 const {data}=await sb.from('internships').select('*,profiles(full_name,college_roll_number)').eq('profiles.college_id',state.profile.college_id).order('created_at',{ascending:false});
 const ids=(data||[]).map(x=>x.id);
 const {data:att}=ids.length?await sb.from('attendance').select('internship_id,hours').in('internship_id',ids):{data:[]};
 const {data:prog}=ids.length?await sb.from('training_progress').select('internship_id,status').in('internship_id',ids):{data:[]};
 const {data:subs}=ids.length?await sb.from('assignment_submissions').select('internship_id,status').in('internship_id',ids):{data:[]};
 const {data:projects}=ids.length?await sb.from('projects').select('internship_id,status,score').in('internship_id',ids):{data:[]};
 const rows=(data||[]).map(i=>{const hours=(att||[]).filter(x=>x.internship_id===i.id).reduce((a,x)=>a+Number(x.hours||0),0);const done=(prog||[]).filter(x=>x.internship_id===i.id&&x.status==='completed').length;const submitted=(subs||[]).filter(x=>x.internship_id===i.id&&['submitted','evaluated','approved'].includes(x.status)).length;const p=(projects||[]).find(x=>x.internship_id===i.id);return '<tr><td>'+esc(i.profiles?.full_name||'')+'</td><td>'+esc(i.profiles?.college_roll_number||'')+'</td><td>'+esc(i.domain)+'</td><td>'+hours.toFixed(1)+' / '+i.total_hours+'</td><td>'+done+'</td><td>'+submitted+'</td><td>'+esc(p?.status||'Pending')+'</td></tr>'}).join('');
 document.getElementById('main').innerHTML=head('Progress','Live progress of students in your assigned college')+'<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Roll</th><th>Sector</th><th>Hours</th><th>Training</th><th>Assignments</th><th>Project</th></tr></thead><tbody>'+ (rows||'<tr><td colspan="7" class="empty">No active internships.</td></tr>')+'</tbody></table></div></div>';
}
async function studentTraining(){
 try{
  const {data:i,error:ie}=await sb.from('internships').select('*').eq('student_id',state.user.id).in('status',['active','completed']).order('created_at',{ascending:false}).limit(1).maybeSingle();
  if(ie)throw ie;
  if(!i){document.getElementById('main').innerHTML=head('Online Training','Verified lecture-based learning workspace')+'<div class="card empty">Online training unlocks after Node Officer approval and internship activation.</div>';return}
  const {data:sec}=await sb.from('internship_sectors').select('id,name').eq('name',i.domain).maybeSingle();
  if(!sec){document.getElementById('main').innerHTML=head('Online Training','Verified lecture-based learning workspace')+'<div class="card empty">Training content for your sector is not published yet.</div>';return}
  const {data:lectures}=await sb.from('training_lectures').select('*').eq('sector_id',sec.id).eq('is_active',true).order('sequence_no');
  const {data:progress}=await sb.from('lecture_progress').select('*').eq('internship_id',i.id).eq('student_id',state.user.id);
  const ls=lectures||[],ps=progress||[],pm=new Map(ps.map(x=>[x.lecture_id,x]));
  const total=ls.reduce((a,x)=>a+Number(x.duration_seconds||0),0),watched=ps.reduce((a,x)=>a+Number(x.watched_seconds||0),0),pct=total?Math.min(100,Math.round(watched*100/total)):0;
  let unlock=true,html='';
  for(const l of ls){
   const p=pm.get(l.id),done=!!p?.completed_at,locked=!unlock;
   html+='<div class="card" style="margin-top:12px"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>Lecture '+l.sequence_no+': '+esc(l.title)+'</b><div class="muted">'+Math.ceil(Number(l.duration_seconds||0)/60)+' min</div></div><span class="badge '+(done?'green':locked?'':'orange')+'">'+(done?'Completed':locked?'Locked':'Available')+'</span></div>';
   if(locked)html+='<p class="muted" style="margin-top:12px">Complete the previous lecture to unlock this lecture.</p>';
   else html+='<video id="lecture_'+l.id+'" controls preload="metadata" style="width:100%;margin-top:12px;border-radius:10px;background:#000"></video><div id="lp_'+l.id+'" class="muted" style="font-size:12px;margin-top:6px">'+(p?Number(p.watched_seconds||0).toFixed(0)+' sec verified':'Not started')+'</div>';
   html+='</div>';unlock=done;
  }
  document.getElementById('main').innerHTML=head('Online Training',esc(sec.name)+' · '+ps.filter(x=>x.completed_at).length+'/'+ls.length+' lectures completed')+'<div class="card"><div style="display:flex;justify-content:space-between"><b>Verified Learning Progress</b><strong>'+pct+'%</strong></div><div class="progress" style="margin-top:12px"><div class="bar" style="width:'+pct+'%"></div></div><p class="muted" style="margin-bottom:0">Only validated playback time is credited. Skipping ahead does not credit the skipped portion.</p></div>'+html;
  for(const l of ls){
   const el=document.getElementById('lecture_'+l.id);if(!el)continue;
   const p=pm.get(l.id)||{};let saved=Number(p.last_position_seconds||0),timer=null;
   const vr=await sb.functions.invoke('lecture-progress',{body:{action:'video_url',internship_id:i.id,lecture_id:l.id}});
   if(vr.error)throw vr.error;if(vr.data?.url)el.src=vr.data.url;
   el.addEventListener('loadedmetadata',()=>{if(saved>0&&saved<el.duration-2)el.currentTime=saved});
   el.addEventListener('seeking',()=>{if(el.currentTime>saved+8)el.currentTime=saved});
   el.addEventListener('play',async()=>{const sr=await sb.functions.invoke('lecture-progress',{body:{action:'start',internship_id:i.id,lecture_id:l.id,position_seconds:el.currentTime}});if(sr.error){toast(sr.error.message||'Unable to start lecture');return}el.dataset.sessionId=sr.data?.progress?.active_session_id||'';timer=setInterval(()=>sendLectureHeartbeat(i.id,l.id,el),10000)});
   el.addEventListener('pause',async()=>{if(timer){clearInterval(timer);timer=null}await sendLectureHeartbeat(i.id,l.id,el)});
   el.addEventListener('ended',async()=>{if(timer){clearInterval(timer);timer=null}await sendLectureHeartbeat(i.id,l.id,el)});
  }
 }catch(e){document.getElementById('main').innerHTML=head('Online Training','Verified lecture-based learning workspace')+'<div class="card alert">'+esc(e.message||'Unable to load training.')+'</div>'}
}
async function sendLectureHeartbeat(internshipId,lectureId,video){
 const r=await sb.functions.invoke('lecture-progress',{body:{action:'heartbeat',internship_id:internshipId,lecture_id:lectureId,position_seconds:video.currentTime,playing:!video.paused,visibility_state:document.visibilityState,session_id:video.dataset.sessionId||''}});
 if(r.error){console.warn(r.error);return}
 if(r.data?.progress){const el=document.getElementById('lp_'+lectureId);if(el)el.textContent=Number(r.data.progress.watched_seconds||0).toFixed(0)+' sec verified'+(r.data.progress.completed_at?' · Completed':'')}
 if(r.data?.progress?.completed_at){video.pause();toast('Lecture completed. Next lecture is now unlocked.');setTimeout(()=>studentTraining(),600)}
}

sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){login();return}if(event==='PASSWORD_RECOVERY'&&session){showPasswordRecovery()}});
boot();
</script></body></html>
