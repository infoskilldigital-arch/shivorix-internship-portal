async function submitApplication(){
 const uploaded=[];
 try{
  if(!state.user?.id)throw Error('Your login session has expired. Please log in again.');
  const el=id=>{const x=document.getElementById(id);if(!x)throw Error('Form field is missing: '+id+'. Please refresh the page and try again.');return x};
  const val=id=>String(el(id).value??'').trim();
  const requiredIds=['af_full_name','af_father_name','af_mother_name','af_dob','af_gender','af_mobile','af_email','af_university','af_college','af_course','af_department','af_semester','af_session','af_reg','af_roll','af_sector','af_mode','af_hours','af_credits','af_start','af_end','af_state','af_city','af_pin','af_address'];
  for(const id of requiredIds){if(!val(id))throw Error('Please complete all required details.');}
  const mobile=val('af_mobile'),pin=val('af_pin');
  if(!/^\d{10}$/.test(mobile))throw Error('Please enter a valid 10-digit mobile number.');
  if(!/^\d{6}$/.test(pin))throw Error('Please enter a valid 6-digit pincode.');
  if(!el('af_decl1').checked||!el('af_decl2').checked||!el('af_decl3').checked)throw Error('Please accept all declarations before submitting.');
  const hours=Number(val('af_hours')||0),credits=Number(val('af_credits')||0);
  if(hours<90||hours>120)throw Error('Required internship hours must be between 90 and 120.');
  if(credits<1)throw Error('Credits must be at least 1.');
  if(new Date(val('af_end'))<new Date(val('af_start')))throw Error('End date cannot be before start date.');
  const {data:p,error:pe}=await sb.from('profiles').select('college_id').eq('id',state.user.id).single();
  if(pe)throw pe;
  if(!p?.college_id)throw Error('Your college is not assigned. Please contact SHIVORIX Admin.');
  const {data:open,error:oe}=await sb.from('internship_applications').select('id,status').eq('student_id',state.user.id).in('status',['submitted','under_review','approved','active']).order('created_at',{ascending:false}).limit(1);
  if(oe)throw oe;
  if(open?.length)throw Error('You already have an active application/internship.');
  const profilePayload={
   full_name:val('af_full_name'),father_name:val('af_father_name'),mother_name:val('af_mother_name'),
   date_of_birth:val('af_dob'),gender:val('af_gender'),mobile:val('af_mobile'),email:val('af_email'),
   university_name:val('af_university'),course:val('af_course'),department:val('af_department'),
   semester:val('af_semester'),academic_session:val('af_session'),
   university_registration_number:val('af_reg'),college_roll_number:val('af_roll'),
   state:val('af_state'),city:val('af_city'),pin_code:pin,permanent_address:val('af_address')
  };
  const {error:upe}=await sb.from('profiles').update(profilePayload).eq('id',state.user.id);
  if(upe)throw upe;
  const docs=[['4th Semester Admit Card','af_admit'],['APAAR / ABC ID Proof','af_apaar'],['College ID Card','af_college_id'],['College Internship Consent Letter','af_consent'],['Passport-size Photograph','af_photo']];
  for(const [title,id] of docs){
   const input=el(id),f=input.files?.[0];
   if(!f)throw Error('Please upload '+title+'.');
   if(f.size>10*1024*1024)throw Error(title+' must be 10 MB or smaller.');
   const allowed=['application/pdf','image/jpeg','image/png','image/webp'];
   if(!allowed.includes(f.type))throw Error(title+' has an unsupported file type.');
   if(title==='Passport-size Photograph'&&!['image/jpeg','image/png','image/webp'].includes(f.type))throw Error('Passport-size Photograph must be an image.');
   const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=state.user.id+'/application/'+Date.now()+'_'+safe;
   const {error:up}=await sb.storage.from('student-documents').upload(path,f,{contentType:f.type,upsert:false});
   if(up)throw up;
   uploaded.push(path);
  }
  const payload={
   application_number:'SHX-'+Date.now().toString(36).toUpperCase(),student_id:state.user.id,college_id:p.college_id,
   sector_id:val('af_sector'),mode:val('af_mode'),internship_type:'credit_based',requested_hours:hours,requested_credits:credits,
   preferred_start_date:val('af_start'),preferred_end_date:val('af_end'),status:'submitted',node_review_status:'pending',payment_required:false
  };
  const {data:created,error:ae}=await sb.from('internship_applications').insert(payload).select('id,status').single();
  if(ae)throw ae;
  if(!created?.id)throw Error('Application was not created. Please try again.');
  for(let i=0;i<docs.length;i++){
   const [title,id]=docs[i],input=el(id),f=input.files?.[0];
   if(!f)throw Error('Please upload '+title+'.');
   const {error:de}=await sb.from('student_documents').insert({
    student_id:state.user.id,college_id:p.college_id,document_type:title,document_title:f.name,
    file_path:uploaded[i],mime_type:f.type,file_size:f.size,uploaded_by:state.user.id
   });
   if(de)throw de;
  }
  toast('Internship application submitted successfully');go('application');
 }catch(e){
  if(uploaded.length){try{await sb.storage.from('student-documents').remove(uploaded)}catch(_e){}}
  const msg=e?.message||'Unable to submit internship application';
  const detail=[e?.details,e?.hint,e?.code].filter(Boolean).join(' · ');
  toast(detail?msg+' — '+detail:msg);console.error('Application submit error',e);
 }
}async function application(){const {data:a}=await sb.from('internship_applications').select('*,internship_sectors(name),colleges(name)').eq('student_id',state.user.id).order('created_at',{ascending:false});document.getElementById('main').innerHTML=head('My Application','Track approval and activation')+'<div class="grid">'+(a||[]).map(x=>'<div class="card"><div style="display:flex;justify-content:space-between;gap:15px"><div><b>'+esc(x.application_number)+'</b><p class="muted">'+esc(x.internship_sectors?.name||'')+' · '+esc(x.mode)+'</p></div><span class="badge '+(x.status==='active'?'green':x.status==='rejected'?'red':'orange')+'">'+esc(x.status)+'</span></div><div class="grid two" style="margin-top:15px"><div><small class="muted">College</small><div>'+esc(x.colleges?.name||'')+'</div></div><div><small class="muted">Node Review</small><div>'+esc(x.node_review_status)+'</div></div><div><small class="muted">Hours / Credits</small><div>'+x.requested_hours+' hrs · '+x.requested_credits+' credits</div></div></div>'+(x.node_review_remarks?'<div class="alert" style="margin-top:14px">'+esc(x.node_review_remarks)+'</div>':'')+'</div>').join('')||'<div class="card empty">No application submitted yet.</div>'+'</div>'}
async function applications(filter='pending'){
 const {data,error}=await sb.from('internship_applications').select('*,internship_sectors(name),profiles(full_name,college_name,university_registration_number,college_roll_number),colleges(name)').order('created_at',{ascending:false});
 if(error)throw error;
 const all=data||[];
 const counts={pending:all.filter(x=>x.node_review_status==='pending').length,approved:all.filter(x=>x.node_review_status==='approved').length,rejected:all.filter(x=>x.node_review_status==='rejected').length,returned:all.filter(x=>x.node_review_status==='returned').length};
 const rows=filter==='all'?all:all.filter(x=>x.node_review_status===filter);
 const tab=(key,label)=>'<button class="btn '+(filter===key?'btn-primary':'btn-soft')+'" onclick="applications(\''+key+'\')">'+label+' <span class="badge">'+(counts[key]||0)+'</span></button>';
 document.getElementById('main').innerHTML=head('Applications',state.role==='admin'?'Central application control':'Review applications from your assigned college')+
 '<div class="card" style="margin-bottom:16px"><div style="display:flex;gap:9px;flex-wrap:wrap">'+tab('pending','Pending')+tab('approved','Approved')+tab('rejected','Rejected')+tab('returned','Request Edit')+tab('all','All')+'</div></div>'+
 '<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Application</th><th>Student</th><th>College</th><th>Sector</th><th>Status</th><th>Node Review</th><th>Remarks</th><th>Action</th></tr></thead><tbody>'+
 rows.map(x=>'<tr><td><b>'+esc(x.application_number)+'</b><br><small class="muted">'+esc(x.created_at?new Date(x.created_at).toLocaleDateString('en-IN'):'')+'</small></td><td>'+esc(x.student_profile?.full_name||'—')+'<br><small class="muted">'+esc(x.student_profile?.college_roll_number||x.student_profile?.university_registration_number||'')+'</small></td><td>'+esc(x.colleges?.name||x.student_profile?.college_name||'—')+'</td><td>'+esc(x.internship_sectors?.name||'—')+'</td><td><span class="badge '+(x.status==='approved'?'green':x.status==='rejected'?'red':x.status==='returned'?'orange':'')+'">'+esc(x.status)+'</span></td><td><span class="badge '+(x.node_review_status==='approved'?'green':x.node_review_status==='rejected'?'red':x.node_review_status==='returned'?'orange':'')+'">'+esc(x.node_review_status)+'</span></td><td>'+esc(x.node_review_remarks||'—')+'</td><td>'+(state.role==='node_officer'&&x.node_review_status==='pending'?'<button class="btn btn-primary" onclick="reviewApp(\''+x.id+'\',\'approved\')">Approve</button> <button class="btn btn-soft" onclick="reviewApp(\''+x.id+'\',\'returned\')">Request Edit</button> <button class="btn btn-danger" onclick="reviewApp(\''+x.id+'\',\'rejected\')">Reject</button>':'—')+'</td></tr>').join('')||'<tr><td colspan="8" class="empty">No applications found.</td></tr>'+
 '</tbody></table></div></div>';
}
async function reviewApp(id,status){
 const labels={approved:'Approval remarks (optional):',returned:'What needs correction? (optional):',rejected:'Rejection reason (optional):'};
 const remarks=prompt(labels[status]||'Remarks (optional):','')||null;
 const nextStatus=status==='approved'?'approved':status==='returned'?'returned':'rejected';
 const {error}=await sb.from('internship_applications').update({node_review_status:status,status:nextStatus,node_reviewed_at:new Date().toISOString(),node_review_remarks:remarks}).eq('id',id);
 if(error)toast(error.message);else{toast(status==='approved'?'Application approved.':status==='returned'?'Edit request sent to student.':'Application rejected.');applications(status)}
}
async function payments(){const {data}=await sb.from('payments').select('*,profiles(full_name,college_name),internship_applications(application_number,status)').order('created_at',{ascending:false});document.getElementById('main').innerHTML=head('Payments','Payment orders, successful payments and administrative waivers')+'<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Application</th><th>Amount</th><th>Provider</th><th>Status</th><th>Action</th></tr></thead><tbody>'+(data||[]).map(x=>'<tr><td>'+esc(x.student_profile?.full_name)+'</td><td>'+esc(x.internship_applications?.application_number||'')+'</td><td>₹'+Number(x.amount||0).toLocaleString('en-IN')+'</td><td>'+esc(x.provider||'—')+'</td><td>'+esc(x.status)+'</td><td>'+(x.status==='pending'?'<button class="btn btn-soft" onclick="waivePayment(\''+x.id+'\')">Waive & Activate</button>':'—')+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">No payments.</td></tr>'+'</tbody></table></div></div>'}
async function waivePayment(id){if(!confirm('Mark this fee as waived and activate the internship?'))return;const {data:p,error}=await sb.from('payments').update({status:'success',paid_at:new Date().toISOString(),metadata:{waived_by_admin:true}}).eq('id',id).select('id,application_id').single();if(error)return toast(error.message);const {error:ie}=await sb.rpc('activate_paid_internship',{p_application_id:p.application_id,p_payment_id:p.id,p_provider_payment_id:null});if(ie)toast(ie.message);else{toast('Fee waived and internship activated');payments()}}
async function payment(){const {data}=await sb.from('payments').select('*,internship_applications(application_number,status)').eq('student_id',state.user.id).order('created_at',{ascending:false});document.getElementById('main').innerHTML=head('Payment','Payment is available only after Node Officer approval')+'<div class="card">'+((data||[]).length?'<div class="table-wrap"><table class="table"><thead><tr><th>Application</th><th>Amount</th><th>Provider</th><th>Status</th><th>Action</th></tr></thead><tbody>'+(data||[]).map(x=>'<tr><td>'+esc(x.internship_applications?.application_number||'')+'</td><td>₹'+Number(x.amount||0).toLocaleString('en-IN')+'</td><td>'+esc(x.provider||'—')+'</td><td>'+esc(x.status)+'</td><td>'+(x.status==='pending'&&x.internship_applications?.status==='payment_pending'?'<button class="btn btn-primary" onclick="startPayment(\''+x.application_id+'\')">Pay Now</button>':'—')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No payment is currently due.</div>')+'</div>'}
async function startPayment(applicationId){const {data,error}=await sb.functions.invoke('payment-api',{body:{action:'create_order',application_id:applicationId}});if(error||data?.error)return toast(error?.message||data?.error||'Unable to start payment');if(!window.Razorpay)return toast('Payment checkout library is unavailable.');const rzp=new Razorpay({key:data.key_id,amount:Math.round(Number(data.amount)*100),currency:data.currency,order_id:data.order_id,name:'SHIVORIX PVT. LTD.',description:'Internship Fee',prefill:{name:data.name,email:data.email},theme:{color:'#6d28d9'},handler:async function(resp){const v=await sb.functions.invoke('payment-api',{body:{action:'verify',payment_id:data.payment_id,application_id:applicationId,razorpay_order_id:resp.razorpay_order_id,razorpay_payment_id:resp.razorpay_payment_id,razorpay_signature:resp.razorpay_signature}});if(v.error||v.data?.error)toast(v.error?.message||v.data?.error||'Payment verification failed');else{toast('Payment verified. Internship activated.');go('internship')}}});rzp.open()}
async function assessments(){
 try{
  if(state.role==='admin')return finalTestAdmin();
  if(state.role==='node_officer')return finalTestAdmin();
  const {data:lectures}=await sb.from('training_lectures').select('id,title,sequence_no,internship_sectors(name)').eq('is_active',true).order('sequence_no');
  const ids=(lectures||[]).map(x=>x.id);
  let tests=[];
  if(ids.length){
   const {data:ts}=await sb.from('final_tests').select('id,lecture_id,title,pass_percentage,total_marks,is_active,admin_reviewed').in('lecture_id',ids).eq('is_active',true);
   tests=ts||[];
  }
  const {data:finals}=await sb.from('final_tests').select('id,title,pass_percentage,total_marks,duration_minutes,is_active,admin_reviewed').is('lecture_id',null).eq('is_active',true).eq('admin_reviewed',true);
  let html=head('Assessments','Internship assessments and final assessment')+'<div class="card"><div class="alert"><b>Assessment structure:</b> Lecture-wise assessments are completed after training. The Final Assessment is available according to the internship eligibility and sector.</div></div><div class="grid two" style="margin-top:16px">';
  html+=(tests||[]).map(t=>'<div class="card"><b>'+esc(t.title)+'</b><p class="muted">Lecture assessment · Pass '+esc(String(t.pass_percentage))+'%</p><span class="badge green">Published</span><button class="btn btn-primary" style="margin-top:12px" onclick="go(\'lecture-test\')">Open My Tests</button></div>').join('');
  html+=(finals||[]).map(t=>'<div class="card"><b>'+esc(t.title)+'</b><p class="muted">Final Assessment · Pass '+esc(String(t.pass_percentage))+'%</p><span class="badge green">Published</span><button class="btn btn-primary" style="margin-top:12px" onclick="go(\'final-test\')">Open Final Assessment</button></div>').join('');
  if(!tests.length&&!finals?.length)html+='<div class="card"><b>No assessment available yet.</b><p class="muted">Assessments will appear here when published.</p></div>';
  html+='</div>';document.getElementById('main').innerHTML=html;
 }catch(e){toast(e.message||'Unable to load assessments')}
}
async function assignments(){
 if(state.role==='admin'){ return assignmentAdminDashboard(); }

function filterAssignmentDashboard(){

 const rows=(window.__assignmentReviewSubs||[]).filter(x=>{

  return (!q||hay.includes(q))&&(!status||x.status===status);
 });
 const body=document.getElementById('assignmentCheckRows');
 if(!body)return;
 body.innerHTML=rows.map(x=>{
  const p=x.student_profile||{},a=x.assignments||{};

 }).join('')||'<tr><td colspan="7" class="empty">No matching submissions.</td></tr>';
}

let finalTestState={data:null,answers:{},timer:null};
async function finalTest(){
 try{
  const {data:i,error:ie}=await sb.from('internships').select('id,start_date,status').eq('student_id',state.user.id).order('created_at',{ascending:false}).limit(1).maybeSingle();
  if(ie)throw ie;
  if(!i){document.getElementById('main').innerHTML=head('Final Test','Final assessment after the internship period')+'<div class="card empty">Your Final Test will appear here after an internship is activated.</div>';return}
  const start=new Date(i.start_date+'T00:00:00');
  const unlock=new Date(start); unlock.setDate(unlock.getDate()+30);
  const now=new Date();
  if(!Number.isNaN(start.getTime()) && now<unlock){
    const days=Math.max(0,Math.ceil((unlock-now)/86400000));
    document.getElementById('main').innerHTML=head('Final Test','Final assessment after 30 days')+'<div class="card"><h3>Final Test Locked</h3><p>Your Final Test unlocks after 30 days from <b>'+esc(i.start_date)+'</b>.</p><div class="badge orange">'+days+' day(s) remaining</div></div>';
    return;
  }
  const {data,error}=await sb.functions.invoke('final-test-api',{body:{action:'get_test',internship_id:i.id}});
  if(error){
   const detail=error?.context?.json?.error||error?.message||'Unable to load Final Test.';
   throw Error(detail);
  }
  if(data?.error)throw Error(data.error);
  if(!data.eligible){document.getElementById('main').innerHTML=head('Final Test','Final assessment after 30 days')+'<div class="card"><h3>Final Test Locked</h3><p>Your Final Test unlocks after 30 days from <b>'+esc(i.start_date)+'</b>.</p><div class="badge orange">'+esc(data.days_remaining)+' day(s) remaining</div></div>';return}
  if(!data.available){document.getElementById('main').innerHTML=head('Final Test','Final assessment')+'<div class="card"><h3>Not Published Yet</h3><p class="muted">'+esc(data.message||'The Final Test will appear here when SHIVORIX publishes it.')+'</p></div>';return}
  finalTestState.data={...data,internshipId:i.id};
  const a=data.attempt;
  if(a?.submitted_at){document.getElementById('main').innerHTML=head('Final Test Result','Your submitted assessment result')+'<div class="card"><h2>'+esc(a.percentage??0)+'%</h2><p><b>'+((a.passed)?'Passed':'Not Passed')+'</b></p><p class="muted">Your score has been recorded.</p></div>';return}
  if(a){renderFinalTest(a,data);return}
  document.getElementById('main').innerHTML=head('Final Test','Final assessment after 30 days')+'<div class="card"><h2>'+esc(data.test.title)+'</h2><p>'+esc(data.test.duration_minutes)+' minutes · Passing: '+esc(data.test.pass_percentage)+'%</p><p class="muted">Once you start, the attempt will be recorded. Submit before the timer ends.</p><button class="btn btn-primary" onclick="startFinalTest()">Start Final Test</button></div>';
 }catch(e){document.getElementById('main').innerHTML=head('Final Test','Final assessment')+'<div class="card"><div class="alert">'+esc(e.message||'Unable to load Final Test.')+'</div></div>'}
}
async function startFinalTest(){
 const {data,error}=await sb.functions.invoke('final-test-api',{body:{action:'start',internship_id:finalTestState.data.internshipId}});
 if(error)throw error;if(data?.error)throw Error(data.error);
 finalTestState.data.attempt=data.attempt;finalTestState.answers={};renderFinalTest(data.attempt,finalTestState.data)
}
function renderFinalTest(attempt,data){
 const saved=JSON.parse(localStorage.getItem('shivorix_final_test_'+attempt.id)||'{}');finalTestState.answers=saved;
 const started=new Date(attempt.started_at).getTime(),limit=Number(data.test.duration_minutes)*60000;
 const remaining=Math.max(0,limit-(Date.now()-started));clearInterval(finalTestState.timer);
 finalTestState.timer=setInterval(()=>{const left=Math.max(0,limit-(Date.now()-started));const el=document.getElementById('testTimer');if(el)el.textContent=Math.ceil(left/1000/60)+' min '+(Math.ceil(left/1000)%60)+' sec';if(left<=0){clearInterval(finalTestState.timer);submitFinalTest(true)}},1000);
 document.getElementById('main').innerHTML=head('Final Test',esc(data.test.title))+'<div class="card"><div class="badge orange" id="testTimer">'+Math.ceil(remaining/60000)+' min</div><div style="margin-top:16px">'+(data.questions||[]).map((q,n)=>'<div class="card" style="margin:14px 0"><b>Q'+(n+1)+'. '+esc(q.question_text)+'</b>'+(q.question_type==='mcq'?(Array.isArray(q.options)?q.options:(typeof q.options==='string'?JSON.parse(q.options||'[]'):[])).map(o=>'<label style="display:block;margin:10px 0"><input type="radio" name="q_'+q.id+'" value="'+esc(o)+'" '+(String(finalTestState.answers[q.id]||'')===String(o)?'checked':'')+' onchange="saveFinalAnswer(\''+q.id+'\',this.value)"> '+esc(o)+'</label>').join(''):q.question_type==='true_false'?['True','False'].map(o=>'<label style="display:block;margin:10px 0"><input type="radio" name="q_'+q.id+'" value="'+o+'" '+(String(finalTestState.answers[q.id]||'')===o?'checked':'')+' onchange="saveFinalAnswer(\''+q.id+'\',this.value)"> '+o+'</label>').join(''):'<textarea style="width:100%;margin-top:12px" rows="4" onchange="saveFinalAnswer(\''+q.id+'\',this.value)">'+esc(finalTestState.answers[q.id]||'')+'</textarea>')+'</div>').join('')+'</div><button class="btn btn-primary" onclick="submitFinalTest(false)">Submit Final Test</button></div>'
}
function saveFinalAnswer(qid,value){finalTestState.answers[qid]=value;localStorage.setItem('shivorix_final_test_'+finalTestState.data.attempt.id,JSON.stringify(finalTestState.answers))}
async function submitFinalTest(auto){
 if(!auto&&!confirm('Submit your Final Test now?'))return;
 clearInterval(finalTestState.timer);
 const answers=Object.entries(finalTestState.answers).map(([question_id,answer])=>({question_id,answer}));
 const {data,error}=await sb.functions.invoke('final-test-api',{body:{action:'submit',internship_id:finalTestState.data.internshipId,answers}});
 if(error)throw error;if(data?.error)throw Error(data.error);
 localStorage.removeItem('shivorix_final_test_'+finalTestState.data.attempt.id);toast('Final Test submitted');finalTest()

async function saveActivityLog(){

 try{
  if(state.role!=='student')throw Error('Only students can submit Log Book activities.');
  const date=document.getElementById('al_date')?.value;
  const activity=document.getElementById('al_activity')?.value.trim();
  const description=document.getElementById('al_description')?.value.trim()||null;

  const today=localToday();
  if(date>today)throw Error('Future dates cannot be added to the Log Book.');
  if(evidence){
   if(evidence.size>25*1024*1024)throw Error('Evidence file must be 25 MB or smaller.');
   const allowed=['application/pdf','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document','application/vnd.ms-powerpoint','application/vnd.openxmlformats-officedocument.presentationml.presentation','application/zip','application/x-zip-compressed','image/jpeg','image/png','image/webp'];

  if(ie)throw ie;

  html+=(internships||[]).map(x=>{const ev=em[x.id];return '<tr><td>'+esc(x.profiles?.full_name||'—')+'</td><td>'+esc(x.profiles?.college_name||'—')+'</td><td>'+esc(x.domain||'—')+'</td><td>'+esc(x.status||'—')+'</td><td>'+(ev?'<span class="badge green">Evaluated</span>':'<span class="badge orange">Pending</span>')+'</td><td>'+((state.role!=='student')?'<button class="btn btn-soft" onclick="openEvaluationForm(\''+x.id+'\')">'+(ev?'Edit Evaluation':'Evaluate')+'</button>':(ev?'View':'—'))+'</td></tr>'}).join('')||'<tr><td colspan="6" class="empty">No internship records found.</td></tr>';
  html+='</tbody></table></div></div>';
  document.getElementById('main').innerHTML=html;
 }catch(e){toast(e.message||'Unable to load evaluations')}
}
function evaluationRatingValue(v){return v==='Excellent'?95:v==='Very Good'?85:v==='Good'?75:v==='Satisfactory'?65:50}
async function openEvaluationForm(internshipId){
 try{
  const {data:i,error:ie}=await sb.from('internships').select('id,student_id,domain,profiles(full_name,college_name)').eq('id',internshipId).single();if(ie||!i)throw Error('Internship not found.');
  const {data:ev}=await sb.from('evaluations').select('*').eq('internship_id',internshipId).maybeSingle();
  const opts=['Excellent','Very Good','Good','Satisfactory','Needs Improvement'];
  const sel=(id,val)=>'<select id="'+id+'">'+opts.map(o=>'<option '+(val===o?'selected':'')+'>'+o+'</option>').join('')+'</select>';
  const rating=(n)=>ev?.[n] ? (Number(ev[n])>=90?'Excellent':Number(ev[n])>=80?'Very Good':Number(ev[n])>=70?'Good':Number(ev[n])>=60?'Satisfactory':'Needs Improvement') : 'Excellent';
  document.getElementById('main').innerHTML=head('Evaluate Internship',esc(i.profiles?.full_name||'Student')+' · '+esc(i.domain||'Sector'))+'<div class="card"><div class="alert">Use the five assessment criteria from the internship performance assessment. Select the appropriate rating for each criterion.</div><div class="grid two"><div class="field"><label>1. Technical Knowledge & Application</label>'+sel('ev1',rating('technical_knowledge'))+'</div><div class="field"><label>2. Quality of Work & Task Completion</label>'+sel('ev2',rating('quality_of_work'))+'</div><div class="field"><label>3. Initiative & Problem Solving Ability</label>'+sel('ev3',rating('initiative_problem_solving'))+'</div><div class="field"><label>4. Communication & Interpersonal Skills</label>'+sel('ev4',rating('communication'))+'</div><div class="field"><label>5. Punctuality, Discipline & Professional Conduct</label>'+sel('ev5',rating('discipline_punctuality'))+'</div></div><div class="field" style="margin-top:14px"><label>Supervisor / Head Remarks</label><textarea id="evremarks" rows="4">'+esc(ev?.supervisor_remarks||'')+'</textarea></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-primary" onclick="saveEvaluation(\''+internshipId+'\',\''+(ev?.id||'')+'\')">Save Evaluation</button><button class="btn btn-soft" onclick="evaluations()">Cancel</button></div></div>';
 }catch(e){toast(e.message||'Unable to open evaluation')}
}
async function saveEvaluation(internshipId,evalId){
 try{
  if(state.role==='student')throw Error('Students cannot create evaluations.');
  const labels=['ev1','ev2','ev3','ev4','ev5'];const vals=labels.map(id=>document.getElementById(id).value);
  const nums=vals.map(evaluationRatingValue);const overall=nums.reduce((a,b)=>a+b,0)/5;const rating=overall>=90?'Excellent':overall>=80?'Very Good':overall>=70?'Good':overall>=60?'Satisfactory':'Needs Improvement';
  const payload={student_id:null,internship_id:internshipId,technical_knowledge:nums[0],quality_of_work:nums[1],initiative_problem_solving:nums[2],communication:nums[3],discipline_punctuality:nums[4],overall_score:Number(overall.toFixed(2)),rating,supervisor_remarks:document.getElementById('evremarks').value.trim()||null,evaluated_by:state.user.id,evaluated_at:new Date().toISOString()};
  const {data:i,error:ie}=await sb.from('internships').select('student_id').eq('id',internshipId).single();if(ie)throw ie;payload.student_id=i.student_id;
  let r;if(evalId)r=await sb.from('evaluations').update(payload).eq('id',evalId);else r=await sb.from('evaluations').insert(payload);
  if(r.error)throw r.error;toast('Evaluation saved successfully');evaluations();
 }catch(e){toast(e.message||'Unable to save evaluation')}
}
async function audit(){const {data}=await sb.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(100);document.getElementById('main').innerHTML=head('Audit Logs','Administrative activity trail')+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Action</th><th>Entity</th><th>College</th><th>Date</th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td>${esc(x.action)}</td><td>${esc(x.entity_type)}</td><td>${esc(x.college_id||'—')}</td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No audit events yet.</td></tr>'}</tbody></table></div></div>`}
async function progress(){const {data}=await sb.from('internships').select('id,student_id,total_hours,credits,status,domain,profiles(full_name,college_name)').order('created_at',{ascending:false});document.getElementById('main').innerHTML=head('Progress','Internship completion overview')+'<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Sector</th><th>Status</th><th>Required Hours</th><th>Credits</th></tr></thead><tbody>'+(data||[]).map(x=>'<tr><td>'+esc(x.student_profile?.full_name)+'</td><td>'+esc(x.domain)+'</td><td>'+esc(x.status)+'</td><td>'+x.total_hours+'</td><td>'+x.credits+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">No internships.</td></tr>'+'</tbody></table></div></div>'}
async function documents(){let q=sb.from('student_documents').select('*,profiles(full_name,college_name)').order('created_at',{ascending:false});if(state.role==='student')q=q.eq('student_id',state.user.id);const {data}=await q;document.getElementById('main').innerHTML=head('Documents','Secure document storage with college-level access control')+(state.role==='student'?'<div class="card"><div class="form two-col"><div class="field"><label>Document Type</label><select id="dtype"><option>Marksheet</option><option>ID Proof</option><option>Acceptance Letter</option><option>Consent Letter</option><option>Internship Report</option><option>Attendance Record</option><option>Evaluation</option><option>Certificate</option><option>Other</option></select></div><div class="field"><label>File</label><input id="dfile" type="file" accept="application/pdf,image/jpeg,image/png,image/webp"></div></div><button class="btn btn-primary" style="margin-top:14px" onclick="uploadDoc()">Upload Securely</button></div>':'')+'<div class="card" style="margin-top:16px"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Type</th><th>Title</th><th>Status</th><th>Date</th><th>File</th></tr></thead><tbody>'+(data||[]).map(x=>'<tr><td>'+esc(x.student_profile?.full_name||state.profile.full_name)+'</td><td>'+esc(x.document_type)+'</td><td>'+esc(x.document_title)+'</td><td>'+esc(x.verification_status)+'</td><td>'+new Date(x.created_at).toLocaleDateString()+'</td><td><button class="btn btn-soft" onclick="downloadDoc(\''+x.file_path+'\')">Open</button>'+(state.role!=='student'&&x.verification_status==='pending'?'<button class="btn btn-primary" style="margin-left:5px" onclick="verifyDoc(\''+x.id+'\')">Verify</button>':'')+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">No documents.</td></tr>'+'</tbody></table></div></div>'}
async function verifyDoc(id){const {error}=await sb.from('student_documents').update({verification_status:'verified',remarks:prompt('Remarks (optional):','')||null}).eq('id',id);if(error)toast(error.message);else documents()}
async function settings(){const {data}=await sb.from('portal_settings').select('*').eq('setting_key','internship_defaults').single();const c=data?.setting_value||{};document.getElementById('main').innerHTML=head('Portal Settings','Academic defaults and payment configuration')+'<div class="card"><div class="form two-col"><div class="field"><label>Internship Fee (₹)</label><input id="fee" type="number" min="0" value="'+Number(c.application_fee||0)+'"></div><div class="field"><label>Default Hours</label><input id="defh" type="number" value="'+Number(c.default_hours||120)+'"></div><div class="field"><label>Default Credits</label><input id="defc" type="number" value="'+Number(c.default_credits||4)+'"></div><div class="field"><label>Minimum Hours</label><input id="minh" type="number" value="'+Number(c.min_hours||90)+'"></div><div class="field"><label>Maximum Hours</label><input id="maxh" type="number" value="'+Number(c.max_hours||120)+'"></div><div class="field"><label>Currency</label><input id="curr" value="'+esc(c.currency||'INR')+'"></div></div><div class="alert" style="margin-top:14px">Razorpay secret credentials stay in Supabase Edge Function Secrets and never in GitHub/browser code.</div><button class="btn btn-primary" style="margin-top:14px" onclick="saveSettings()">Save Settings</button></div>'}
async function saveSettings(){const {data}=await sb.from('portal_settings').select('setting_value').eq('setting_key','internship_defaults').single();const c=data?.setting_value||{};const setting_value={...c,application_fee:Number(document.getElementById('fee').value||0),default_hours:Number(document.getElementById('defh').value||120),default_credits:Number(document.getElementById('defc').value||4),min_hours:Number(document.getElementById('minh').value||90),max_hours:Number(document.getElementById('maxh').value||120),currency:document.getElementById('curr').value||'INR'};const {error}=await sb.from('portal_settings').update({setting_value,updated_by:state.user.id}).eq('setting_key','internship_defaults');if(error)toast(error.message);else{toast('Settings saved');settings()}}
async function certificates(){const {data}=await sb.from('certificates').select('*,profiles(full_name,college_name)').order('issued_date',{ascending:false});document.getElementById('main').innerHTML=head('Certificates','Completion certificates and records')+'<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Certificate</th><th>Domain</th><th>Hours</th><th>Credits</th><th>Issued</th><th>Action</th></tr></thead><tbody>'+(data||[]).map(x=>'<tr><td>'+esc(x.student_profile?.full_name||state.profile.full_name)+'</td><td>'+esc(x.certificate_number)+'</td><td>'+esc(x.domain)+'</td><td>'+x.total_hours+'</td><td>'+x.credits+'</td><td>'+x.issued_date+'</td><td><button class="btn btn-primary" onclick="printCertificate(\''+x.id+'\')">View / Print</button></td></tr>').join('')||'<tr><td colspan="7" class="empty">No certificates issued.</td></tr>'+'</tbody></table></div></div>'+(state.role==='admin'?'<div class="card" style="margin-top:16px"><b>Issue Certificate</b><div class="form two-col" style="margin-top:12px"><div class="field"><label>Internship ID</label><input id="certInt"></div><div class="field"><label>Domain (optional)</label><input id="certDomain"></div></div><button class="btn btn-primary" style="margin-top:12px" onclick="issueCertificate()">Issue Certificate</button></div>':'')}
async function issueCertificate(){const id=document.getElementById('certInt').value.trim();if(!id)return toast('Internship ID required.');const {data:i}=await sb.from('internships').select('*').eq('id',id).single();if(!i)return toast('Internship not found.');const {data:a}=await sb.from('attendance').select('hours').eq('internship_id',id);const hours=(a||[]).reduce((s,x)=>s+Number(x.hours||0),0);const {data:e}=await sb.from('evaluations').select('overall_score').eq('internship_id',id).maybeSingle();if(hours<Number(i.total_hours))return toast('Required attendance hours are not complete.');if(!e)return toast('Final evaluation is required.');const token=crypto.randomUUID(),num='SHX-CERT-'+new Date().getFullYear()+'-'+Math.random().toString(36).slice(2,8).toUpperCase();const {error}=await sb.from('certificates').insert({internship_id:id,student_id:i.student_id,certificate_number:num,domain:document.getElementById('certDomain').value.trim()||i.domain,start_date:i.start_date,end_date:i.end_date,total_hours:i.total_hours,credits:i.credits,issued_date:new Date().toISOString().slice(0,10),verification_token:token,status:'issued',certificate_url:SUPABASE_URL+'/functions/v1/certificate-verify?token='+token});if(error)toast(error.message);else{await sb.from('internships').update({status:'completed'}).eq('id',id);toast('Certificate issued');certificates()}}
async function printCertificate(id){const {data:c}=await sb.from('certificates').select('*,profiles(full_name,college_name)').eq('id',id).single();if(!c)return;const w=window.open('','_blank');if(!w)return toast('Allow pop-ups.');w.document.write('<!doctype html><html><head><title>'+esc(c.certificate_number)+'</title><style>body{font-family:Georgia,serif;background:#f4f1ea;padding:40px}.cert{max-width:900px;margin:auto;background:#fff;padding:70px;border:12px double #6d28d9;text-align:center}h1{color:#6d28d9;font-size:42px}h2{font-size:30px}.meta{margin-top:35px;display:flex;justify-content:space-between;font-size:12px}</style></head><body><div class="cert"><b>SHIVORIX PVT. LTD.</b><h1>INTERNSHIP COMPLETION CERTIFICATE</h1><p>This is to certify that</p><h2>'+esc(c.profiles?.full_name||'Student')+'</h2><p>has successfully completed the internship in <b>'+esc(c.domain)+'</b> for <b>'+c.total_hours+' hours</b> and <b>'+c.credits+' credits</b>.</p><p>Certificate No.: <b>'+esc(c.certificate_number)+'</b></p><div class="meta"><span>Issued: '+c.issued_date+'</span><span>Verification: '+c.verification_token+'</span></div></div><script>window.print()<\/script></body></html>');w.document.close()}

function downloadCsv(name,rows){if(!rows.length)return toast('No data.');const keys=Object.keys(rows[0]);const csv=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click()}
</script>

function renderLoginPanel(){const p=document.getElementById('loginPanel');if(state.mode==='register'){p.innerHTML=`<h2>Create student account</h2><p class="muted">Register once with your academic details. After registration, use Student Login with OTP.</p><div class="form two-col" style="margin-top:18px"><div class="field"><label>Full Name *</label><input id="rName" placeholder="Enter full name"></div><div class="field"><label>Father's Name *</label><input id="rFather" placeholder="Enter father's name"></div><div class="field"><label>Mother's Name *</label><input id="rMother" placeholder="Enter mother's name"></div><div class="field"><label>Mobile Number *</label><input id="rMobile" type="tel" placeholder="10-digit mobile number"></div><div class="field"><label>Email Address *</label><input id="rEmail" type="email" placeholder="Registered email"></div><div class="field"><label>University Registration No. *</label><input id="rReg" placeholder="University registration number"></div><div class="field"><label>College Roll No. *</label><input id="rRoll" placeholder="College roll number"></div><div class="field"><label>College *</label><select id="rCollege"><option value="">Loading colleges...</option></select></div><div class="field"><label>Internship Sector *</label><select id="rSector"><option value="">Loading sectors...</option></select></div><div class="field"><label>Course *</label><input id="rCourse" placeholder="e.g. B.Tech / B.Sc."></div><div class="field"><label>Department *</label><input id="rDept" placeholder="Department / Branch"></div><div class="field"><label>Semester *</label><input id="rSem" placeholder="e.g. 5th Semester"></div><div class="field"><label>Academic Session *</label><input id="rSession" placeholder="e.g. 2026-27"></div><div class="field"><label>Create Password *</label><input id="rPassword" type="password" minlength="8" placeholder="Minimum 8 characters"></div><button class="btn btn-primary" style="grid-column:1/-1" onclick="registerStudent( ass="field"><label>Official Email</label><input id="staffEmail" type="email" placeholder="Enter official email"></div><div class="field"><label>Password</label><input id="staffPass" type="password" placeholder="Enter password"></div><button class="btn btn-primary" onclick="staffLogin()">Secure Staff Login</button><div class="alert" style="margin-top:10px">Staff accounts are provisioned by SHIVORIX Admin.</div><div id="loginMsg"></div></div>`}}
function showForgotPassword(){state.mode='forgot';const p=document.getElementById('loginPanel');if(!p){login();return}p.innerHTML=`<h2>Reset Password</h2><p class="muted">Enter your Registration No. and College Roll No. An OTP will be sent to your registered email.</p><div class="form" style="margin-top:20px"><div class="field"><label>University Registration No. *</label><input id="resetReg" placeholder="Enter registration number"></div><div class="field"><label>College Roll No. *</label><input id="resetRoll" placeholder="Enter college roll number"></div><button class="btn btn-primary" onclick="sendResetOtp()">Send OTP</button><button class="btn btn-soft" onclick="setMode('student')" style="margin-top:8px">Back to Student Login</button><div id="loginMsg"></div></div>`}
async function sendResetOtp(){const reg=document.getElementById('resetReg')?.value.trim(),roll=document.getElementById('resetRoll')?.value.trim(),m=document.getElementById('loginMsg');if(m)m.innerHTML='';if(!reg||!roll){m.innerHTML='<div class="alert">Registration No. and College Roll No. are required.</div>';return}try{const r=await fetch(OTP_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'start',purpose:'reset',registration_no:reg,roll_no:roll})});const d=await r.json();if(!r.ok)throw Error(d.error);state.resetChallenge={registration_no:reg,roll_no:roll};state.resetOtpCooldownUntil=Date.now()+60000;renderResetOtpPanel(d.masked_email||'your registered email')}catch(e){m.innerHTML='<div class="alert">'+esc(e.message||'Unable to send OTP.')+'</div>'}}
function renderResetOtpPanel(masked){const wait=Math.max(0,Math.ceil((state.resetOtpCooldownUntil-Date.now())/1000));document.getElementById('loginPanel').innerHTML='<h2>Verify Reset OTP</h2><p class="muted">OTP sent to <b>'+esc(masked)+'</b></p><div class="form" style="margin-top:20px"><div class="field"><label>6-digit OTP *</label><input id="resetOtp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter OTP"></div><button class="btn btn-primary" onclick="verifyResetOtp()">Verify OTP</button><button class="btn btn-soft" onclick="showForgotPassword()">Change Details</button><div id="loginMsg"></div><p class="muted" style="font-size:12px">OTP is sent only to your registered email. Never share it with anyone.</p></div>';const input=document.getElementById('resetOtp');if(input)input.addEventListener('input',function(){this.value=this.value.replace(/[^0-9]/g,'').slice(0,6)})}
async function verifyResetOtp(){const otp=document.getElementById('resetOtp')?.value.trim(),m=document.getElementById('loginMsg');if(!/^[0-9]{6}$/.test(otp)){m.innerHTML='<div class="alert">Enter the 6-digit OTP.</div>';return}try{const r=await fetch(OTP_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'verify',purpose:'reset',registration_no:state.resetChallenge.registration_no,roll_no:state.resetChallenge.roll_no,otp})});const d=await r.json();if(!r.ok)throw Error(d.error);const {data:sessionData,error:sessionError}=await sb.auth.setSession(d.session);if(sessionError)throw sessionError;if(!sessionData?.session?.user)throw Error('Reset session could not be established.');showPasswordRecovery()}catch(e){m.innerHTML='<div class="alert">'+esc(e.message||'Invalid or expired OTP. Please request a new OTP.')+'</div>'}}
async function registerStudent(){const m=document.getElementById('loginMsg');m.innerHTML='';const body={action:'register',full_name:document.getElementById('rName').value.trim(),father_name:document.getElementById('rFather').value.trim(),mother_name:document.getElementById('rMother').value.trim(),mobile:document.getElementById('rMobile').value.trim(),email:document.getElementById('rEmail').value.trim(),university_registration_number:document.getElementById('rReg').value.trim(),college_roll_number:document.getElementById('rRoll').value.trim(),college_id:document.getElementById('rCollege').value,course:document.getElementById('rCourse').value.trim(),department:document.getElementById('rDept').value.trim(),semester:document.getElementById('rSem').value.trim(),academic_session:document.getElementById('rSession').value.trim(),password:document.getElementById('rPassword').value,internship_sector_id:document.getElementById('rSector').value};try{const r=await fetch(SUPABASE_URL+'/functions/v1/student-registration',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);m.innerHTML='<div class="success">'+esc(d.message)+'</div>';setTimeout(()=>setMode('student'),1200)}catch(e){m.innerHTML='<div class="alert">'+esc(e.message)+'</div>'}}
async function studentPasswordLogin(){const reg=document.getElementById('reg').value.trim(),roll=document.getElementById('roll').value.trim(),password=document.getElementById('studentPass').value,m=document.getElementById('loginMsg');m.innerHTML='';if(!reg||!roll||!password){m.innerHTML='<div class="alert">Registration No., Roll No. and password are required.</div>';return}try{const r=await fetch(SUPABASE_URL+'/functions/v1/student-password-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({registration_no:reg,roll_no:roll,password})});const d=await r.json();if(!r.ok)throw Error(d.error);const {data:sessionData,error:sessionError}=await sb.auth.setSession(d.session);if(sessionError)throw sessionError;if(!sessionData?.session?.user)throw Error('Login session could not be established. Please try again.');await boot(sessionData.session.user,d.profile||null)}catch(e){m.innerHTML='<div class="alert">'+esc(e.message||'Login failed. Please try again.')+'</div>'}}
async function sendOtp(){const reg=document.getElementById('reg').value.trim(),roll=document.getElementById('roll').value.trim(),m=document.getElementById('loginMsg');m.innerHTML='';if(!reg||!roll){m.innerHTML='<div class="alert">Both fields are required.</div>';return}try{const r=await fetch(OTP_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'start',registration_no:reg,roll_no:roll})});const d=await r.json();if(!r.ok)throw Error(d.error);state.challenge={registration_no:reg,roll_no:roll};state.otpCooldownUntil=Date.now()+60000;renderOtpPanel(d.masked_email||'your registered email')}catch(e){m.innerHTML='<div class="alert">'+esc(e.message)+'</div>'}}
function renderOtpPanel(masked){
 const wait=Math.max(0,Math.ceil((state.otpCooldownUntil-Date.now())/1000));
 const buttonText=wait?'Resend OTP in '+wait+'s':'Resend OTP';
 document.getElementById('loginPanel').innerHTML='<h2>Verify OTP</h2><p class="muted">OTP sent to <b>'+esc(masked)+'</b></p><div class="form" style="margin-top:20px"><div class="field"><label>6-digit OTP</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter OTP"></div><button class="btn btn-primary" onclick="verifyOtp()">Verify & Continue</button><button id="resendOtpBtn" class="btn btn-soft" onclick="resendOtp()" '+(wait?'disabled':'')+'>'+buttonText+'</button><button class="btn btn-soft" onclick="setMode(\'student\')">Change Login Details</button><div id="loginMsg"></div><p class="muted" style="font-size:12px">OTP is sent only to your registered email. Never share it with anyone.</p></div>';
 const input=document.getElementById('otp');
 if(input){input.addEventListener('input',function(){this.value=this.value.replace(/[^0-9]/g,'').slice(0,6)})}
 clearInterval(state.otpTimer);
 if(wait){state.otpTimer=setInterval(function(){const button=document.getElementById('resendOtpBtn');if(!button){clearInterval(state.otpTimer);return}const left=Math.max(0,Math.ceil((state.otpCooldownUntil-Date.now())/1000));if(left===0){button.disabled=false;button.textContent='Resend OTP';clearInterval(state.otpTimer)}else{button.textContent='Resend OTP in '+left+'s'}},500)}
}
function resendOtp(){
 if(Date.now()<state.otpCooldownUntil)return;
 const message=document.getElementById('loginMsg');
 if(message)message.innerHTML='';
 fetch(OTP_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'start',registration_no:state.challenge.registration_no,roll_no:state.challenge.roll_no})})
 .then(function(response){return response.json().then(function(data){if(!response.ok)throw Error(data.error||'Unable to resend OTP.');return data})})
 .then(function(data){state.otpCooldownUntil=Date.now()+60000;renderOtpPanel(data.masked_email||'your registered email');toast('New OTP sent')})
 .catch(function(error){if(message)message.innerHTML='<div class="alert">'+esc(error.message)+'</div>'});
}
async function verifyOtp(){const otp=document.getElementById('otp').value.trim(),m=document.getElementById('loginMsg');try{const r=await fetch(OTP_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'verify',registration_no:state.challenge.registration_no,roll_no:state.challenge.roll_no,otp})});const d=await r.json();if(!r.ok)throw Error(d.error);await sb.auth.setSession(d.session);await boot()}catch(e){m.innerHTML='<div class="alert">'+esc(e.message)+'</div>'}}
async function staffLogin(){try{const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('staffEmail').value.trim(),password:document.getElementById('staffPass').value});if(error)throw error;if(!data?.user)throw Error('Staff login could not be established.');const {data:p,error:pe}=await sb.from('profiles').select('*').eq('id',data.user.id).maybeSingle();if(pe)throw pe;if(!p||!['admin','node_officer'].includes(p.role))throw Error('This account is not configured as a SHIVORIX staff account.');localStorage.removeItem('shivorix_student_profile');state.user=data.user;state.profile=p;state.role=p.role;state.section='dashboard';renderApp()}catch(e){document.getElementById('loginMsg').innerHTML='<div class="alert">'+esc(e.message||'Staff login failed.')+'</div>'}}
function isPasswordRecoveryUrl(){const h=window.location.hash||'',s=window.location.search||'';return /(?:^|[&#?])type=recovery(?:&|$)/i.test(h)||/(?:^|[&?])type=recovery(?:&|$)/i.test(s)}
async function boot(userOverride=null,profileOverride=null){try{if(isPasswordRecoveryUrl()&&!userOverride){const {data:{session}}=await sb.auth.getSession();if(session?.user){state.user=session.user;showPasswordRecovery();return}login();return}let user=userOverride;if(!user){const {data:{session},error:se}=await sb.auth.getSession();if(se)throw se;if(!session?.user){state.user=null;state.profile=null;state.role=null;login();return}user=session.user}state.user=user;let p=profileOverride;if(!p){const q=await sb.from('profiles').select('*,internship_sectors(name)').eq('id',user.id).maybeSingle();if(q.error)throw q.error;p=q.data}if(!p){const cached=localStorage.getItem('shivorix_student_profile');try{p=cached?JSON.parse(cached):null}catch(_){p=null}}if(!p){p={id:user.id,email:user.email||'',full_name:user.user_metadata?.full_name||'Student',role:'student'}}state.profile=p;state.role=p.role||'student';state.section='dashboard';if(state.role==='student')await autoCheckInOnLogin();renderApp()}catch(e){const msg=String(e?.message||'');if(/auth session missing|session missing|no session|invalid jwt/i.test(msg)){state.user=null;state.profile=null;state.role=null;login();return}console.error('Portal boot error',e);document.getElementById('root').innerHTML='<div style="padding:40px;max-width:700px;margin:auto"><div class="card"><h2>SHIVORIX Internship Portal</h2><div class="alert">'+esc(msg||'Unable to load the portal.')+'</div><button class="btn btn-primary" onclick="location.reload()">Reload Portal</button></div></div>'}}
async function autoCheckInOnLogin(){
 try{
  if(!window.__attendanceAutoCloseTimer)window.__attendanceAutoCloseTimer=setInterval(()=>{finalizeOpenAttendance().catch(()=>{})},60000);
  if(state.role!=='student'||!state.user?.id)return;
  await finalizeOpenAttendance();
  const now=new Date();
  if(!attendanceWindowValid(now))return;
  const {data:i,error:ie}=await sb.from('internships').select('id').eq('student_id',state.user.id).eq('status','active').order('created_at',{ascending:false}).limit(1).maybeSingle();
  if(ie||!i)return;
  const date=localDateKey(now);
  const {data:existing,error:ee}=await sb.from('attendance').select('id,time_in,time_out').eq('internship_id',i.id).eq('attendance_date',date).maybeSingle();
  if(ee||existing)return;

async function saveProject(internshipId){try{const title=document.getElementById('ptitle').value.trim(),description=document.getElementById('pdesc').value.trim(),projectUrl=document.getElementById('purl').value.trim();if(!title||!description)throw Error('Project title and description are required.');const projectFile=document.getElementById('pfileupload')?.files?.[0],reportFile=document.getElementById('rfileupload')?.files?.[0];if(!projectFile)throw Error('Project file is required.');if(!reportFile)throw Error('Final internship report is required.');const allowed=['application/pdf','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document','application/vnd.ms-powerpoint','application/vnd.openxmlformats-officedocument.presentationml.presentation','application/zip','image/jpeg','image/png','image/webp'];for(const f of [projectFile,reportFile]){if(f.size>25*1024*1024)throw Error('Each file must be 25 MB or smaller.');if(!allowed.includes(f.type))throw Error('Allowed files: PDF, DOC, DOCX, PPT, PPTX, ZIP, JPG, PNG, WEBP.')}const {data:existing,error:ee}=await sb.from('projects').select('id,submitted_at,status').eq('internship_id',internshipId).eq('student_id',state.user.id).maybeSingle();if(ee)throw ee;if(existing)throw Error('This project and final report have already been submitted. You cannot edit or resubmit them.');const makePath=(f,k)=>state.user.id+'/'+internshipId+'/'+k+'/'+Date.now()+'_'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),pp=makePath(projectFile,'project'),rp=makePath(reportFile,'report'),up=[];try{let r=await sb.storage.from('internship-submissions').upload(pp,projectFile,{contentType:projectFile.type,upsert:false});if(r.error)throw r.error;up.push(pp);r=await sb.storage.from('internship-submissions').upload(rp,reportFile,{contentType:reportFile.type,upsert:false});if(r.error)throw r.error;up.push(rp);r=await sb.from('projects').insert({internship_id:internshipId,student_id:state.user.id,title,description,project_url:pro async function generateFinalTestAI(sectorId){
 try{
  if(state.role!=='admin')throw Error('Only Admin can generate the Final Test.');
  if(!sectorId)throw Error('Select a sector first.');
  const {data:sector,error:se}=await sb.from('internship_sectors').select('id,name').eq('id',sectorId).single();if(se)throw se;
  const {data:lectures,error:le}=await sb.from('training_lectures').select('id,title,description,sector_id').eq('is_active',true).eq('sector_id',sectorId).order('lecture_date').order('sequence_no');if(le)throw le;
  if(!lectures?.length)throw Error('No active lectures found for this sector.');
  const ids=lectures.map(x=>x.id);
  const {data:q,error:qe}=await sb.from('final_test_questions').select('question_text,options,correct_answer,test_id,final_tests!inner(lecture_id)').in('final_tests.lecture_id',ids).eq('is_active',true).limit(200);if(qe)throw qe;
  const source=lectures.map(l=>'Lecture: '+l.title+'\nDescription: '+(l.description||'')).join('\n\n')+'\n\nLecture test questions:\n'+(q||[]).map(x=>x.question_text+' | '+JSON.stringify(x.options)+' | Correct: '+x.correct_answer).join('\n');
  if(source.length<80)throw Error('Not enough lecture content is available for this sector.');
  toast('AI is generating the '+sector.name+' Final Test draft...');
  const rr=await fetch('/api/generate-final-test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sourceText:source})});const body=await rr.json();if(!rr.ok)throw Error(body.error||'Final Test generation failed.');

function youtubeVideoId(url){
 try{
  const u=new URL(String(url||''));
  if(u.hostname==='youtu.be')return u.pathname.slice(1).split('/')[0]||null;
  if(u.hostname.includes('youtube.com')){
   if(u.pathname==='/watch')return u.searchParams.get('v');
   const parts=u.pathname.split('/').filter(Boolean);if(['embed','shorts','live'].includes(parts[0]))return parts[1]||null;
  }
 }catch(_e){}
 return null;
}
function ensureYouTubeAPI(){
 if(window.YT&&window.YT.Player)return Promise.resolve(window.YT);
 if(window.__ytApiPromise)return window.__ytApiPromise;
 window.__ytApiPromise=new Promise((resolve,reject)=>{
  const previous=window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady=()=>{try{if(previous)previous();}catch(_e){}resolve(window.YT)};
  const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.async=true;s.onerror=()=>reject(new Error('YouTube player could not be loaded. Please check your internet connection.'));document.head.appendChild(s);
  setTimeout(()=>{if(window.YT&&window.YT.Player)resolve(window.YT)},10000);
 });
 return window.__ytApiPromise;
}

async function generateLectureTest(lectureId){
 try{
  const {data:l,error:le}=await sb.from('training_lectures').select('id,title,description,video_url,sector_id,admin_reviewed,internship_sectors(name)').eq('id',lectureId).single();if(le)throw le;
  let sourceText='',sourceType='';
  if(String(l.video_url||'').startsWith('storage:')){
   const path=String(l.video_url).slice(8);
   const {data:signed,error:se}=await sb.storage.from('training-videos').createSignedUrl(path,3600);if(se)throw se;
   toast('Transcribing lecture audio...');
   const tr=await fetch('/api/transcribe-lecture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({audioUrl:signed.signedUrl})});
   const tb=await tr.json();if(!tr.ok)throw Error(tb.error||'Video transcription failed.');
   sourceText=tb.transcript;sourceType='uploaded video';
  }else if(youtubeVideoId(l.video_url)){
   toast('Reading YouTube captions and generating 10 questions...');
  }else throw Error('This lecture has no valid video source.');
  const rr=await fetch('/api/generate-lecture-test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:l.title,description:l.description,sector:l.internship_sectors?.name,videoUrl:sourceText?'':l.video_url,sourceText})});
  const body=await rr.json();if(!rr.ok)throw Error(body.error||'AI question generation failed.');
  const {data:test,error:te}=await sb.from('final_tests').insert({title:'Test: '+l.title,lecture_id:lectureId,sector_id:l.sector_id,duration_minutes:10,pass_percentage:60,total_marks:10,is_active:false,admin_reviewed:false,admin_reviewed_at:null,admin_reviewed_by:null,created_by:state.user.id}).select('id').single();if(te)throw te;
  const rows=body.questions.map((x,i)=>({test_id:test.id,question_text:x.question_text,question_type:'mcq',options:x.options,correct_answer:x.correct_answer,marks:1,sequence_no:i+1,is_active:true}));
  const {error:qe}=await sb.from('final_test_questions').insert(rows);if(qe){await sb.from('final_tests').delete().eq('id',test.id);throw qe}
  toast('10 MCQs generated from '+sourceType+' and published successfully');manageLectureTest(lectureId);
 }catch(e){toast(e.message||'Unable to generate test')}
}
async function manualLectureTest(lectureId){
 try{
  const {data:l,error:le}=await sb.from('training_lectures').select('id,title,sector_id,admin_reviewed,internship_sectors(name)').eq('id',lectureId).single();if(le)throw le;
  const fields=[];
  for(let i=1;i<=10;i++){
   fields.push('<div class="card" style="margin-top:12px"><b>Question '+i+'</b><div class="field" style="margin-top:10px"><label>Question *</label><textarea id="mq_'+i+'" rows="2" placeholder="Enter question"></textarea></div><div class="grid two" style="margin-top:8px"><div class="field"><label>Option A *</label><input id="ma_'+i+'_1"></div><div class="field"><label>Option B *</label><input id="ma_'+i+'_2"></div><div class="field"><label>Option C *</label><input id="ma_'+i+'_3"></div><div class="field"><label>Option D *</label><input id="ma_'+i+'_4"></div></div><div class="field" style="margin-top:8px"><label>Correct Answer *</label><select id="mc_'+i+'"><option value="">Select correct option</option><option value="1">A</option><option value="2">B</option><option value="3">C</option><option value="4">D</option></select></div></div>');
  }
  document.getElementById('main').innerHTML=head('Create Test Manually','10 MCQs for '+esc(l.title))+'<div class="card"><div class="alert">✓ Admin has reviewed this lecture. Enter exactly 10 MCQs. Each question carries 1 mark and the pass percentage is 60%.</div>'+fields.join('')+'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="btn btn-primary" onclick="saveManualLectureTest(\''+lectureId+'\')">Publish Manual Test</button><button class="btn btn-soft" onclick="manageLectureTest(\''+lectureId+'\')">Back</button></div></div>';
 }catch(e){toast(e.message||'Unable to open manual test builder')}
}
async function saveManualLectureTest(lectureId){
 try{
  const {data:l,error:le}=await sb.from('training_lectures').select('id,title,sector_id,admin_reviewed').eq('id',lectureId).single();if(le)throw le;
  const questions=[];
  for(let i=1;i<=10;i++){
   const q=document.getElementById('mq_'+i)?.value.trim();
   const opts=[1,2,3,4].map(n=>document.getElementById('ma_'+i+'_'+n)?.value.trim());
   const correct=document.getElementById('mc_'+i)?.value;
   if(!q||opts.some(x=>!x)||!correct)throw Error('Please complete Question '+i+' with all 4 options and the correct answer.');
   questions.push({question_text:q,options:opts,correct_answer:opts[Number(correct)-1],sequence_no:i});
  }
  const {data:old}=await sb.from('final_tests').select('id').eq('lecture_id',lectureId).eq('is_active',true).maybeSingle();
  if(old){await sb.from('final_tests').update({is_active:false}).eq('id',old.id);}
  const {data:test,error:te}=await sb.from('final_tests').insert({title:'Test: '+l.title,lecture_id:lectureId,sector_id:l.sector_id,duration_minutes:10,pass_percentage:60,total_marks:10,is_active:false,admin_reviewed:false,admin_reviewed_at:null,admin_reviewed_by:null,created_by:state.user.id}).select('id').single();if(te)throw te;
  const {error:qe}=await sb.from('final_test_questions').insert(questions.map(x=>({...x,test_id:test.id,question_type:'mcq',marks:1,is_active:true})));
  if(qe){await sb.from('final_tests').delete().eq('id',test.id);throw qe;}
  toast('Manual 10-question test published successfully');manageLectureTest(lectureId);
 }catch(e){toast(e.message||'Unable to publish manual test')}
}

async function regenerateLectureTest(lectureId){if(!confirm('Regenerate this lecture test? The current test will be unpublished.'))return;const {data:t}=await sb.from('final_tests').select('id').eq('lecture_id',lectureId).eq('is_active',true).maybeSingle();if(t)await sb.from('final_tests').update({is_active:false}).eq('id',t.id);await generateLectureTest(lectureId);}

async function studentTests(){
 try{
  const {data:i,error:ie}=await sb.from('internships').select('*').eq('student_id',state.user.id).in('status',['active','completed']).order('created_at',{ascending:false}).limit(1).maybeSingle();
  if(ie)throw ie;
  if(!i){document.getElementById('main').innerHTML=head('My Tests','Lecture-wise tests and results')+'<div class="card empty">Tests unlock after your internship is activated.</div>';return;}
  const {data:sec}=await sb.from('internship_sectors').select('id,name').eq('name',i.domain).maybeSingle();
  if(!sec){document.getElementById('main').innerHTML=head('My Tests','Lecture-wise tests and results')+'<div class="card empty">No training sector is assigned yet.</div>';return;}
  const {data:lectures}=await sb.from('training_lectures').select('id,title,sequence_no,lecture_date,duration_seconds').eq('sector_id',sec.id).eq('is_active',true).order('lecture_date').order('sequence_no');
  const ids=(lectures||[]).map(x=>x.id);
  const {data:progress}=ids.length?await sb.from('lecture_progress').select('lecture_id,completed_at,watched_seconds').eq('internship_id',i.id).eq('student_id',state.user.id):{data:[]};
  const {data:tests}=ids.length?await sb.from('final_tests').select('id,lecture_id,title,pass_percentage,total_marks,duration_minutes,is_active,created_at').in('lecture_id',ids).eq('is_active',true):{data:[]};
  const testIds=(tests||[]).map(x=>x.id);
  const {data:attempts}=testIds.length?await sb.from('final_test_attempts').select('id,test_id,score,percentage,passed,status,submitted_at,started_at').eq('student_id',state.user.id).in('test_id',testIds).order('started_at',{ascending:false}):{data:[]};
  const pm=new Map((progress||[]).map(x=>[x.lecture_id,x])),tm=new Map((tests||[]).map(x=>[x.lecture_id,x])),latest=new Map();
  for(const a of (attempts||[])){if(!latest.has(a.test_id))latest.set(a.test_id,a);}
  let html=head('My Tests','Lecture-wise tests, attempts and results')+'<div class="card"><div class="alert">Each lecture has a separate 10-question test. Pass the test to unlock the next lecture.</div><div class="table-wrap"><table class="table"><thead><tr><th>Lecture</th><th>Test</th><th>Lecture Status</th><th>Test Status</th><th>Score</th><th>Action</th></tr></thead><tbody>';
  for(const l of (lectures||[])){
   const p=pm.get(l.id),t=tm.get(l.id),a=t?latest.get(t.id):null;
   const passed=!!a?.passed, completed=!!p?.completed_at;
   let status=!t?'Not Published':passed?'Passed':a?'Not Passed':completed?'Available':'Locked';
   let action=!t?'—':passed?'<span class="muted">Completed</span>':completed?'<button class="btn btn-primary" onclick="openLectureTest(\''+t.id+'\',\''+l.id+'\')">'+(a?'Retry Test':'Start Test')+'</button>':'<span class="muted">Complete lecture first</span>';
   html+='<tr><td><b>Lecture '+esc(String(l.sequence_no||''))+'</b><br>'+esc(l.title)+'</td><td>'+esc(t?.title||'—')+'</td><td><span class="badge '+(completed?'green':'orange')+'">'+(completed?'Completed':'Pending')+'</span></td><td><span class="badge '+(passed?'green':status==='Available'?'orange':'')+'">'+status+'</span></td><td>'+(a?.submitted_at?(esc(String(a.score||0))+'/'+esc(String(t.total_marks||10))+' · '+esc(String(a.percentage||0))+'%'):'—')+'</td><td>'+action+'</td></tr>';
  }
  html+='</tbody></table></div></div>';
  document.getElementById('main').innerHTML=html;
 }catch(e){
  document.getElementById('main').innerHTML=head('My Tests','Lecture-wise tests and results')+'<div class="card alert">'+esc(e.message||'Unable to load tests.')+'</div>';
 }
}
