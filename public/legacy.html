async function submitApplication(){
 const uploaded=[];
 try{
  if(!state.user?.id)throw Error('Your login session has expired. Please log in again.');
  const el=id=>{const x=document.getElementById(id);if(!x)throw Error('Form field is missing: '+id+'. Please refresh the page and try again.');return x};
  const val=id=>String(el(id).value??'').trim();
  const requiredIds=['af_full_name','af_father_name','af_mother_name','af_dob','af_gender','af_mobile','af_email','af_university','af_college','af_course','af_department','af_semester','af_session','af_reg','af_roll','af_sector','af_mode','af_hours','af_credits','af_start','af_end','af_state','af_city','af_pin','af_address'];
  for(const id of requiredIds){if(!val(id))throw Error('Please complete all required details.');}
  const mobile=val('af_mobile'),pin=val('af_pin');
  if(!/^\d{10}$/.test(mobile))throw Error('Please enter a valid 10-digit mobile number.');
  if(!/^\d{6}$/.test(pin))throw Error('Please enter a valid 6-digit pincode.');
  if(!el('af_decl1').checked||!el('af_decl2').checked||!el('af_decl3').checked)throw Error('Please accept all declarations before submitting.');
  const hours=Number(val('af_hours')||0),credits=Number(val('af_credits')||0);
  if(hours!==120)throw Error('As per the internship guideline, the internship requirement is 120 hours.');
  if(credits!==4)throw Error('As per the internship guideline, the internship carries 4 credits.');
  const startDate=new Date(val('af_start')+'T00:00:00'),endDate=new Date(val('af_end')+'T00:00:00');
  if(endDate<startDate)throw Error('End date cannot be before start date.');
  const durationDays=Math.round((endDate-startDate)/86400000)+1;
  if(durationDays<28||durationDays>42)throw Error('As per the guideline, the internship duration should be 4–6 weeks (28–42 days).')
  const {data:p,error:pe}=await sb.from('profiles').select('college_id').eq('id',state.user.id).single();
  if(pe)throw pe;
  if(!p?.college_id)throw Error('Your college is not assigned. Please contact SHIVORIX Admin.');
  const {data:open,error:oe}=await sb.from('internship_applications').select('id,status').eq('student_id',state.user.id).in('status',['submitted','under_review','approved','active']).order('created_at',{ascending:false}).limit(1);
  if(oe)throw oe;
  if(open?.length)throw Error('You already have an active application/internship.');
  const profilePayload={
   full_name:val('af_full_name'),father_name:val('af_father_name'),mother_name:val('af_mother_name'),
   date_of_birth:val('af_dob'),gender:val('af_gender'),mobile:val('af_mobile'),email:val('af_email'),
   university_name:val('af_university'),course:val('af_course'),department:val('af_department'),
   semester:val('af_semester'),academic_session:val('af_session'),
   university_registration_number:val('af_reg'),college_roll_number:val('af_roll'),
   state:val('af_state'),city:val('af_city'),pin_code:pin,permanent_address:val('af_address')
  };
  const {error:upe}=await sb.from('profiles').update(profilePayload).eq('id',state.user.id);
  if(upe)throw upe;
  const docs=[['4th Semester Admit Card','af_admit'],['APAAR / ABC ID Proof','af_apaar'],['College ID Card','af_college_id'],['College Internship Consent Letter','af_consent'],['Passport-size Photograph','af_photo']];
  for(const [title,id] of docs){
   const input=el(id),f=input.files?.[0];
   if(!f)throw Error('Please upload '+title+'.');
   if(f.size>10*1024*1024)throw Error(title+' must be 10 MB or smaller.');
   const allowed=['application/pdf','image/jpeg','image/png','image/webp'];
   if(!allowed.includes(f.type))throw Error(title+' has an unsupported file type.');
   if(title==='Passport-size Photograph'&&!['image/jpeg','image/png','image/webp'].includes(f.type))throw Error('Passport-size Photograph must be an image.');
   const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=state.user.id+'/application/'+Date.now()+'_'+safe;
   const {error:up}=await sb.storage.from('student-documents').upload(path,f,{contentType:f.type,upsert:false});
   if(up)throw up;
   uploaded.push(path);
  }
  const payload={
   application_number:'SHX-'+Date.now().toString(36).toUpperCase(),student_id:state.user.id,college_id:p.college_id,
   sector_id:val('af_sector'),mode:val('af_mode'),internship_type:'credit_based',requested_hours:hours,requested_credits:credits,
   preferred_start_date:val('af_start'),preferred_end_date:val('af_end'),status:'submitted',node_review_status:'pending',payment_required:false
  };
  const {data:created,error:ae}=await sb.from('internship_applications').insert(payload).select('id,status').single();
  if(ae)throw ae;
  if(!created?.id)throw Error('Application was not created. Please try again.');
  for(let i=0;i<docs.length;i++){
   const [title,id]=docs[i],input=el(id),f=input.files?.[0];
   if(!f)throw Error('Please upload '+title+'.');
   const {error:de}=await sb.from('student_documents').insert({
    student_id:state.user.id,college_id:p.college_id,application_id:created.id,document_type:title,document_title:f.name,
    file_path:uploaded[i],mime_type:f.type,file_size:f.size,uploaded_by:state.user.id
   });
   if(de)throw de;
  }
  toast('Internship application submitted successfully');go('application');
 }catch(e){
  if(uploaded.length){try{await sb.storage.from('student-documents').remove(uploaded)}catch(_e){}}
  const msg=e?.message||'Unable to submit internship application';
  const detail=[e?.details,e?.hint,e?.code].filter(Boolean).join(' · ');
  toast(detail?msg+' — '+detail:msg);console.error('Application submit error',e);
 }
}async function application(){const {data:a,error}=await sb.from('internship_applications').select('*,internship_sectors(name),colleges(name),profiles(full_name,father_name,mother_name,date_of_birth,gender,mobile,email,permanent_address,city,state,pin_code,college_name,university_name,course,department,semester,academic_session,college_roll_number,university_registration_number)').eq('student_id',state.user.id).order('created_at',{ascending:false});if(error)throw error;const rows=a||[];for(const x of rows){if(x.status==='approved'||x.node_review_status==='approved')await ensureIPOAcceptanceDocument(x.id)}let html=head('My Application','Track your application, Nodal approval and IPO acceptance letter');html+='<div class="grid">'+rows.map(x=>'<div class="card"><div style="display:flex;justify-content:space-between;gap:15px;align-items:flex-start"><div><b>'+esc(x.application_number)+'</b><p class="muted">'+esc(x.internship_sectors?.name||'')+' · '+esc(x.mode)+'</p></div><span class="badge '+(x.status==='active'?'green':x.status==='rejected'?'red':'orange')+'">'+esc(x.status)+'</span></div><div class="grid two" style="margin-top:15px"><div><small class="muted">College</small><div>'+esc(x.colleges?.name||x.profiles?.college_name||'')+'</div></div><div><small class="muted">Nodal Review</small><div>'+esc(x.node_review_status)+'</div></div><div><small class="muted">Hours / Credits</small><div>'+x.requested_hours+' hrs · '+x.requested_credits+' credits</div></div><div><small class="muted">Submitted</small><div>'+new Date(x.created_at).toLocaleString('en-IN')+'</div></div></div>'+(x.node_review_remarks?'<div class="alert" style="margin-top:14px">'+esc(x.node_review_remarks)+'</div>':'')+'<div style="margin-top:16px"><button class="btn btn-primary" onclick="downloadApplication(\''+x.id+'\')">⬇ Download Application</button> '+((x.status==='approved'||x.node_review_status==='approved')?'<button class="btn btn-soft" onclick="renderIPOAcceptanceLetter(\''+x.id+'\')">📄 IPO Acceptance Letter</button>':'')+'</div></div>').join('')||'<div class="card empty">No application submitted yet.</div>';html+='</div>';document.getElementById('main').innerHTML=html}
async function applications(filter='pending'){let aq=sb.from('internship_applications').select('*,internship_sectors(name),profiles(full_name,father_name,mother_name,date_of_birth,gender,mobile,email,permanent_address,city,state,pin_code,college_name,university_name,course,department,semester,academic_session,college_roll_number,university_registration_number),colleges(name)').order('created_at',{ascending:false});if(state.role==='node_officer')aq=aq.eq('college_id',state.profile.college_id);const {data,error}=await aq;if(error)throw error;const all=data||[];const counts={pending:all.filter(x=>x.node_review_status==='pending').length,approved:all.filter(x=>x.node_review_status==='approved').length,rejected:all.filter(x=>x.node_review_status==='rejected').length,returned:all.filter(x=>x.node_review_status==='returned').length};const rows=filter==='all'?all:all.filter(x=>x.node_review_status===filter);const tab=(key,label)=>'<button class="btn '+(filter===key?'btn-primary':'btn-soft')+'" onclick="applications(\''+key+'\')">'+label+' <span class="badge">'+(counts[key]||0)+'</span></button>';let html=head('Applications',state.role==='admin'?'Central application control — search and download any student application':'Review applications from your assigned college — search and download student applications');html+='<div class="card" style="margin-bottom:16px"><div class="field"><label>Search Student / Roll No. / Registration No. / Application No.</label><input id="appSearch" value="'+esc(document.getElementById('appSearch')?.value||'')+'" placeholder="Search by student name, roll no., registration no. or application number..." oninput="applications(\''+filter+'\')"></div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:14px">'+tab('pending','Pending')+tab('approved','Approved')+tab('rejected','Rejected')+tab('returned','Request Edit')+tab('all','All')+'</div></div>';const search=(document.getElementById('appSearch')?.value||'').trim().toLowerCase();const filtered=rows.filter(x=>[x.application_number,x.profiles?.full_name,x.profiles?.college_roll_number,x.profiles?.university_registration_number,x.profiles?.college_name,x.colleges?.name,x.internship_sectors?.name].some(v=>String(v||'').toLowerCase().includes(search)));html+='<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Application</th><th>Student</th><th>College</th><th>Sector</th><th>Status</th><th>Nodal Review</th><th>Action</th></tr></thead><tbody>'+filtered.map(x=>'<tr><td><b>'+esc(x.application_number)+'</b><br><small class="muted">'+esc(x.created_at?new Date(x.created_at).toLocaleDateString('en-IN'):'')+'</small></td><td>'+esc(x.profiles?.full_name||'—')+'<br><small class="muted">'+esc(x.profiles?.college_roll_number||x.profiles?.university_registration_number||'')+'</small></td><td>'+esc(x.colleges?.name||x.profiles?.college_name||'—')+'</td><td>'+esc(x.internship_sectors?.name||'—')+'</td><td><span class="badge '+(x.status==='approved'?'green':x.status==='rejected'?'red':x.status==='returned'?'orange':'')+'">'+esc(x.status)+'</span></td><td>'+esc(x.node_review_status||'—')+'</td><td><button class="btn btn-soft" onclick="downloadApplication(\''+x.id+'\')">⬇ Download</button> '+(state.role==='node_officer'&&x.node_review_status==='pending'?'<button class="btn btn-primary" onclick="reviewApp(\''+x.id+'\',\'approved\')">Approve</button> <button class="btn btn-soft" onclick="reviewApp(\''+x.id+'\',\'returned\')">Request Edit</button> <button class="btn btn-danger" onclick="reviewApp(\''+x.id+'\',\'rejected\')">Reject</button>':'')+'</td></tr>').join('')||'<tr><td colspan="7" class="empty">No applications found.</td></tr>'+'</tbody></table></div></div>';document.getElementById('main').innerHTML=html}

r;color:#666;font-size:10px}@media print{.no-print{display:none}}</style></head><body><div class="head"><h1>SHIVORIX</h1><div>INTERNSHIP PROGRAMME</div><div class="meta">Internship Application Form</div><div><b>Application No.: '+escp(x.application_number)+'</b> &nbsp; | &nbsp; <span class="status">'+escp(x.status)+'</span></div></div><div class="section"><h2>1. Personal Details</h2><table>'+row('Full Name',p.full_name)+row("Father's Name",p.father_name)+row("Mother's Name",p.mother_name)+row('Date of Birth',p.date_of_birth)+row('Gender',p.gender)+row('Mobile',p.mobile)+row('Email',p.email)+row('Address',[[p.permanent_address,p.city,p.state,p.pin_code].filter(Boolean).join(', ')])+'</table></div><div class="section"><h2>2. Academic Details</h2><table>'+row('University',p.university_name)+row('College / Institute',p.college_name||x.colleges?.name)+row('Course / Programme',p.course)+row('Department',p.department)+row('Semester',p.semester)+row('Academic Session',p.academic_session)+row('University Registration No.',p.university_registration_number)+row('College Roll No.',p.college_roll_number)+'</table></div><div class="section"><h2>3. Internship Details</h2><table>'+row('Internship Sector',x.internship_sectors?.name)+row('Mode',x.mode)+row('Internship Type',x.internship_type)+row('Required Hours',x.requested_hours)+row('Credits',x.requested_credits)+row('Preferred Start Date',x.preferred_start_date)+row('Preferred End Date',x.preferred_end_date)+row('Nodal Review',x.node_review_status)+row('Remarks',x.node_review_remarks)+'</table></div><div class="section"><h2>4. Submitted Documents</h2><table><tr><td class="label">Document</td><td class="label">Status</td></tr>'+(docs.map(d=>'<tr><td>'+escp(d.document_type||d.document_title)+'</td><td>'+escp(d.verification_status||'Submitted')+'</td></tr>').join('')||'<tr><td colspan="2">No document records found.</td></tr>')+'</table></div><div class="footer">Generated from SHIVORIX Internship Portal · This document is a system-ge async function saveActivityLog(){
 let uploadedPath=null;
 try{
  if(state.role!=='student')throw Error('Only students can submit Log Book activities.');
  const date=document.getElementById('al_date')?.value;
  const activity=document.getElementById('al_activity')?.value.trim();
  const description=document.getElementById('al_description')?.value.trim()||null;
  const learning=document.getElementById('al_learning')?.value.trim()||null;
  const evidence=document.getElementById('al_evidence')?.files?.[0]||null;
  const hours=Number(document.getElementById('al_hours')?.value||0);
  if(!date||!activity)throw Error('Date and Activity / Work Done are required.');
  if(!hours||hours<0.25||hours>4)throw Error('Hours Worked must be between 0.25 and 4 hours.');
  const today=localToday();
  if(date>today)throw Error('Future dates cannot be added to the Log Book.');
  if(evidence){
   if(evidence.size>25*1024*1024)throw Error('Evidence file must be 25 MB or smaller.');
   const allowed=['application/pdf','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document','application/vnd.ms-powerpoint','application/vnd.openxmlformats-officedocument.presentationml.presentation','application/zip','application/x-zip-compressed','image/jpeg','image/png','image/webp'];
   if(!allowed.includes(evidence.type))throw Error('Evidence file type is not supported.');
  }
  const {data:i,error:ie}=await sb.from('internships').select('id,start_date,end_date,status').eq('student_id',state.user.id).in('status',['active','completed']).order('created_at',{ascending:false}).limit(1).maybeSingle();
  if(ie)throw ie;
  if(!i)throw Error('Activate your internship first.');
  if(i.start_date&&date<i.start_date)throw Error('Activity date cannot be before your internship start date.');
  if(i.end_date&&date>i.end_date)throw Error('Activity date cannot be after your internship end date.');
  const {data:existing,error:ee}=await sb.from('internship_activity_logs').select('hours_worked').eq('internship_id',i.id).eq('activity_date',date);
  if(ee)throw ee;
  const used=(existing||[]).reduce((sum,x)=>sum+Number(x.hours_worked||0),0);
  if(used+hours>4.0001)throw Error('This date already has '+used.toFixed(2)+' logged hours. Maximum is 4 hours per date.');
  if(evidence){
   const safe=evidence.name.replace(/[^a-zA-Z0-9._-]/g,'_');
   uploadedPath=state.user.id+'/activities/'+Date.now()+'_'+safe;
   const {error:up}=await sb.storage.from('internship-submissions').upload(uploadedPath,evidence,{contentType:evidence.type,upsert:false});
   if(up)throw up;
  }
  const {error}=await sb.from('internship_activity_logs').insert({internship_id:i.id,student_id:state.user.id,activity_date:date,activity,description,learning_outcome:learning,hours_worked:Number(hours.toFixed(2)),evidence_path:uploadedPath,status:'submitted'});
  if(error)throw error;
  toast(evidence?'Activity and evidence uploaded successfully.':'Activity added to your Log Book');
  activities();
 }catch(e){
  if(uploadedPath){try{await sb.storage.from('internship-submissions').remove([uploadedPath])}catch(_e){}}
  toast(e.message||'Unable to save activity');
  console.error('Activity log error',e);
}
}

async function issueCertificate(){
 const id=document.getElementById('certInt').value.trim();if(!id)return toast('Internship ID required.');
 const {data:i}=await sb.from('internships').select('*').eq('id',id).single();if(!i)return toast('Internship not found.');
 const {data:a}=await sb.from('attendance').select('hours').eq('internship_id',id);const hours=(a||[]).reduce((s,x)=>s+Number(x.hours||0),0);
 const {data:e}=await sb.from('evaluations').select('overall_score').eq('internship_id',id).maybeSingle();
 if(hours<Number(i.total_hours))return toast('Required attendance hours are not complete.');
 if(!e)return toast('Final evaluation is required.');
 const token=crypto.randomUUID();const {count:certCount}=await sb.from('certificates').select('*',{count:'exact',head:true});const seq=String(Number(certCount||0)+1).padStart(3,'0');const year=new Date().getFullYear();const num='SHIV/INT/'+year+'/'+seq;
 const {data:c,error}=await sb.from('certificates').insert({internship_id:id,student_id:i.student_id,certificate_number:num,domain:document.getElementById('certDomain').value.trim()||i.domain,start_date:i.start_date,end_date:i.end_date,total_hours:i.total_hours,credits:i.credits,issued_date:new Date().toISOString().slice(0,10),verification_token:token,status:'issued',certificate_url:SUPABASE_URL+'/functions/v1/certificate-verify?token='+token}).select('id').single();
 if(error)toast(error.message);else{
  await sb.from('internships').update({status:'completed'}).eq('id',id);
  try{await buildCompletionDocument('certificate',id,c.id);await buildCompletionDocument('marksheet',id,c.id);toast('Internship completed. Certificate and Performance Marksheet generated and sent for Admin verification.');}
  catch(e){toast('Certificate issued, but generated documents need retry: '+(e.message||'Storage error'))}
  certificate()
 }
}
async function autoGenerateCertificate(){
 try{
  if(state.role!=='admin')throw Error('Only SHIVORIX Admin can auto-generate certificates.');
  const studentId=document.getElementById('manualCertStudent')?.value;
  if(!studentId)throw Error('First search and select a student.');
  const {data:i,error:ie}=await sb.from('internships').select('*').eq('student_id',studentId).in('status',['active','completed']).order('created_at',{ascending:false}).limit(1).maybeSingle();
  if(ie)throw ie;
  if(!i)throw Error('No active/completed internship found for this student.');
  const {data:existing}=await sb.from('certificates').select('id,status').eq('internship_id',i.id).maybeSingle();
  if(existing?.id){
   try{
    await buildCompletionDocument('certificate',i.id,existing.id);
    await buildCompletionDocument('marksheet',i.id,existing.id);
    toast('Certificate already exists. Missing Certificate and Performance Marksheet have been generated and sent for Admin verification.');
    return certificate();
   }catch(e){ throw Error('Certificate exists, but completion documents could not be generated: '+(e.message||'Storage error')); }
  }
  const intEl=document.getElementById('certInt');if(intEl)intEl.value=i.id;
  const domEl=document.getElementById('certDomain');if(domEl&&!domEl.value)domEl.value=i.domain||'';
  await issueCertificate();
 }catch(e){toast(e.message||'Unable to auto-generate certificate')}
}

indow.print()<\/script></body></html>');w.document.close()}

function nodeAttendanceTimeToHours(timeIn,timeOut){
 if(!timeIn||!timeOut)return 0;
 const a=timeIn.split(':').map(Number),b=timeOut.split(':').map(Number),start=a[0]*60+(a[1]||0),end=b[0]*60+(b[1]||0);
 if(end<=start)return 0;
 return Math.min(4,(end-start)/60);
}

async function saveNodeManualAttendance(studentId,attendanceId=''){
 try{
  if(state.role!=='node_officer')throw Error('Only the Nodal Officer can save manual attendance.');
  const internship=state.nodeAttendanceInternships?.get(studentId);if(!internship)throw Error('Internship record not found for this student.');
  const date=document.getElementById('na_date')?.value,status=document.getElementById('na_status')?.value,timeIn=document.getElementById('na_time_in')?.value||null,timeOut=document.getElementById('na_time_out')?.value||null;
  let hours=Number(document.getElementById('na_hours')?.value||0),remarks=document.getElementById('na_remarks')?.value.trim()||null;
  if(!date)throw Error('Attendance date is required.');
  if(internship.start_date&&date<internship.start_date)throw Error('Attendance date cannot be before the internship start date.');
  if(internship.end_date&&date>internship.end_date)throw Error('Attendance date cannot be after the internship end date.');
  if(status==='present'){
   if(timeIn&&timeOut){const calculated=nodeAttendanceTimeToHours(timeIn,timeOut);if(!calculated)throw Error('Time Out must be after Time In.');if(!hours)hours=Number(calculated.toFixed(2));}
   if(hours<=0||hours>4)throw Error('Present attendance hours must be between 0.25 and 4.');
  }else hours=0;
  const payload={internship_id:internship.id,student_id:studentId,attendance_date:date,time_in:status==='present'?timeIn:null,time_out:status==='present'?timeOut:null,hours:Number(hours.toFixed(2)),status,remarks,entry_source:'node_officer',verified_by:state.user.id,verified_at:new Date().toISOString()};
  let existingId=attendanceId;
  if(!existingId){const {data:existing,error:ee}=await sb.from('attendance').select('id').eq('internship_id',internship.id).eq('attendance_date',date).maybeSingle();if(ee)throw ee;existingId=existing?.id||'';}
  const result=existingId?await sb.from('attendance').update(payload).eq('id',existingId).eq('student_id',studentId):await sb.from('attendance').insert(payload);
  if(result.error)throw result.error;
  toast(existingId?'Attendance updated successfully.':'Attendance marked successfully.');viewNodeStudentAttendance(studentId);
 }catch(e){toast(e.message||'Unable to save attendance');console.error('Manual attendance save error',e)}
}

async function downloadDoc(path){
 if(String(path||'').startsWith('generated://ipo-acceptance/'))return renderIPOAcceptanceLetter(String(path).split('generated://ipo-acceptance/')[1].split('?')[0]);
 const popup=window.open('about:blank','_blank');
 try{
  const {data,error}=await sb.storage.from('student-documents').createSignedUrl(path,300);
  if(error)throw error;
  const url=data?.signedUrl;
  if(!url)throw Error('Document URL could not be created.');
  const isHtml=String(path||'').toLowerCase().endsWith('.html');
  if(isHtml){
   const res=await fetch(url,{cache:'no-store'});
   if(!res.ok)throw Error('Unable to fetch generated document ('+res.status+').');
   const html=await res.text();
   if(!html.trim())throw Error('Generated document is empty.');
   const blob=new Blob([html],{type:'text/html;charset=utf-8'});
   const previewUrl=URL.createObjectURL(blob);
   if(popup&&!popup.closed){
    popup.location.href=previewUrl;
    setTimeout(()=>URL.revokeObjectURL(previewUrl),60000);
   }else{
    window.open(previewUrl,'_blank');
    setTimeout(()=>URL.revokeObjectURL(previewUrl),60000);
   }
  }else{
   if(popup&&!popup.closed)popup.location.href=url;else window.open(url,'_blank');
  }
 }catch(e){
  if(popup&&!popup.closed)popup.close();
  toast('Unable to open document: '+(e.message||'Preview failed'));
  console.error('Document preview error',e);
 }
}

async function certificate(){
 try{
  const canSearch=state.role==='admin'||state.role==='node_officer';
  const search=canSearch?(document.getElementById('certSearch')?.value||'').trim().toLowerCase():'';

   const {data:issued,error:ie}=await sb.from('certificates').select('id,internship_id,student_id,certificate_number,issued_date,status').order('issued_date',{ascending:false});
   if(ie)throw ie;

   // Completion documents are generated here, not merely represented as virtual rows.
   // A completed/issued internship must have real Certificate + Marksheet files before approval.
   for(const c of (issued||[])){
    const types=['Internship Certificate','Performance Marksheet'];
    for(const type of types){
     const {data:existing,error:de}=await sb.from('student_documents')
      .select('id,student_id,college_id,internship_id,document_type,document_title,file_path,verification_status,remarks,created_at,student_profile:profiles!student_documents_student_id_fkey(full_name,college_name,college_roll_number,university_registration_number)')
      .eq('internship_id',c.internship_id).eq('document_type',type).order('created_at',{ascending:false}).limit(1).maybeSingle();
     if(de)throw de;
     if(existing?.file_path){
      rows.push({...existing,certificate_id:c.id});
      continue;
     }

     // Remove an incomplete database-only record before regenerating the actual file.
     if(existing && !existing.file_path){
      await sb.from('student_documents').delete().eq('id',existing.id);
     }

     try{
      await buildCompletionDocument(type==='Internship Certificate'?'certificate':'marksheet',c.internship_id,c.id);
      const {data:generated,error:ge}=await sb.from('student_documents')
       .select('id,student_id,college_id,internship_id,document_type,document_title,file_path,verification_status,remarks,created_at,student_profile:profiles!student_documents_student_id_fkey(full_name,college_name,college_roll_number,university_registration_number)')
       .eq('internship_id',c.internship_id).eq('document_type',type).order('created_at',{ascending:false}).limit(1).maybeSingle();
      if(ge)throw ge;
      if(generated?.file_path) rows.push({...generated,certificate_id:c.id});
      else rows.push({id:'generation-error-'+c.id+'-'+type.replace(/\\s/g,'-'),student_id:c.student_id,internship_id:c.internship_id,document_type:type,document_title:type+' — Generation Failed',file_path:'',verification_status:'generation_failed',remarks:'Document generation did not create a file.',created_at:c.issued_date||new Date().toISOString(),certificate_id:c.id});
     }catch(genErr){
      console.error('Completion document generation failed:',type,genErr);
      rows.push({id:'generation-error-'+c.id+'-'+type.replace(/\\s/g,'-'),student_id:c.student_id,internship_id:c.internship_id,document_type:type,document_title:type+' — Generation Failed',file_path:'',verification_status:'generation_failed',remarks:genErr?.message||'Document generation failed.',created_at:c.issued_date||new Date().toISOString(),certificate_id:c.id,generation_error:genErr?.message||'Unknown generation error'});
     }
    }
   }
  }else{
   let q=sb.from('student_documents').select('id,student_id,college_id,internship_id,document_type,document_title,file_path,verification_status,remarks,created_at,student_profile:profiles!student_documents_student_id_fkey(full_name,college_name,college_roll_number,university_registration_number)').in('document_type',['Internship Certificate','Performance Marksheet']).order('created_at',{ascending:false});
   if(state.role==='student')q=q.eq('student_id',state.user.id);

  let html=head('Certificate','Internship completion certificate and performance marksheet');

   html+='<div class="card"><div class="alert">'+(approved.length>=2?'<b>Admin Approved:</b> Your Certificate and Performance Marksheet are available below.':'Your Certificate and Performance Marksheet will appear here only after <b>SHIVORIX Admin approves both documents</b>.')+'</div></div>';
  }else if(state.role==='admin'||state.role==='node_officer'){

  html+='<div class="card" style="margin-top:16px"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Type</th><th>Title</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody>';
  if(filtered.length){
   html+=filtered.map(x=>{
    const status=x.verification_status==='generation_failed'?'Generation Failed':(x.verification_status||'pending');

     action=x.verification_status==='pending'
      ?'<button class="btn btn-soft" onclick="reviewCertificateDoc(&quot;'+x.id+'&quot;,&quot;'+(x.certificate_id||'')+'&quot;,&quot;'+x.internship_id+'&quot;,&quot;'+x.document_type+'&quot;)">👁 Review</button>'

async function approveOrGenerateCertificateDoc(rowId,certificateId,internshipId,documentType){
 if(state.role!=='admin')return toast('Only SHIVORIX Admin can approve completion documents.');
 try{
  let actualId=rowId;
  let path='';
  if(String(rowId||'').startsWith('virtual-')){
   if(!certificateId)throw Error('Certificate record not found.');
   if(!internshipId)throw Error('Internship record not found.');
   path=await buildCompletionDocument(documentType==='Internship Certificate'?'certificate':'marksheet',internshipId,certificateId);
   const {data:created,error:ce}=await sb.from('student_documents').select('id,file_path').eq('internship_id',internshipId).eq('document_type',documentType).order('created_at',{ascending:false}).limit(1).maybeSingle();
   if(ce)throw ce;
   actualId=created?.id||'';
   if(!actualId)throw Error('Generated document record was not found.');
  }else{
   const {data:doc,error:de}=await sb.from('student_documents').select('id,file_path,verification_status').eq('id',rowId).single();
   if(de)throw de;
   if(doc.verification_status==='verified')return toast('Document is already approved.');
   path=doc.file_path||'';
   if(!path){
    if(!certificateId||!internshipId)throw Error('Document is missing its generation details.');
    path=await buildCompletionDocument(documentType==='Internship Certificate'?'certificate':'marksheet',internshipId,certificateId);
    const {data:created,error:ce}=await sb.from('student_documents').select('id,file_path').eq('internship_id',internshipId).eq('document_type',documentType).order('created_at',{ascending:false}).limit(1).maybeSingle();
    if(ce)throw ce;
    actualId=created?.id||actualId;
   }
  }
  if(!actualId)throw Error('Document record not found.');
  const {error:ue}=await sb.from('student_documents').update({
   verification_status:'verified',
   verification_remarks:'Approved by SHIVORIX Admin after document review.',
   verified_at:new Date().toISOString()
  }).eq('id',actualId);
  if(ue)throw ue;
  toast(documentType+' approved successfully.');
  await certificates();
 }catch(e){
  console.error('Certificate approval error:',e);
  toast('Unable to approve document: '+(e.message||'Approval failed'));
 }
}

function youtubeVideoId(url){

  const u=new URL(String(url||''));
  if(u.hostname==='youtu.be')return u.pathname.slice(1).split('/')[0]||null;
  if(u.hostname.includes('youtube.com')){
   if(u.pathname==='/watch')return u.searchParams.get('v');
   const parts=u.pathname.split('/').filter(Boolean);if(['embed','shorts','live'].includes(parts[0]))return parts[1]||null;
  }
 }catch(_e){}

}
function ensureYouTubeAPI(){
 if(window.YT&&window.YT.Player)return Promise.resolve(window.YT);
 if(window.__ytApiPromise)return window.__ytApiPromise;
 window.__ytApiPromise=new Promise((resolve,reject)=>{
  const previous=window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady=()=>{try{if(previous)previous();}catch(_e){}resolve(window.YT)};
  const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.async=true;s.onerror=()=>reject(new Error('YouTube player could not be loaded. Please check your internet connection.'));document.head.appendChild(s);
  setTimeout(()=>{if(window.YT&&window.YT.Player)resolve(window.YT)},10000);
 });
 return window.__ytApiPromise;
}

async function generateLectureTest(lectureId){
 try{
  const {data:l,error:le}=await sb.from('training_lectures').select('id,title,description,video_url,sector_id,admin_reviewed,internship_sectors(name)').eq('id',lectureId).single();if(le)throw le;
  let sourceText='',sourceType='';
  if(String(l.video_url||'').startsWith('storage:')){
   const path=String(l.video_url).slice(8);
   const {data:signed,error:se}=await sb.storage.from('training-videos').createSignedUrl(path,3600);if(se)throw se;
   toast('Transcribing lecture audio...');
   const tr=await fetch('/api/transcribe-lecture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({audioUrl:signed.signedUrl})});
   const tb=await tr.json();if(!tr.ok)throw Error(tb.error||'Video transcription failed.');
   sourceText=tb.transcript;sourceType='uploaded video';
  }else if(youtubeVideoId(l.video_url)){
   toast('Reading YouTube captions and generating 10 questions...');
  }else throw Error('This lecture has no valid video source.');
  const rr=await fetch('/api/generate-lecture-test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:l.title,description:l.description,sector:l.internship_sectors?.name,videoUrl:sourceText?'':l.video_url,sourceText})});
  const body=await rr.json();if(!rr.ok)throw Error(body.error||'AI question generation failed.');
  const {data:test,error:te}=await sb.from('final_tests').insert({title:'Test: '+l.title,lecture_id:lectureId,sector_id:l.sector_id,duration_minutes:10,pass_percentage:60,total_marks:10,is_active:false,admin_reviewed:false,admin_reviewed_at:null,admin_reviewed_by:null,created_by:state.user.id}).select('id').single();if(te)throw te;
  const rows=body.questions.map((x,i)=>({test_id:test.id,question_text:x.question_text,question_type:'mcq',options:x.options,correct_answer:x.correct_answer,marks:1,sequence_no:i+1,is_active:true}));
  const {error:qe}=await sb.from('final_test_questions').insert(rows);if(qe){await sb.from('final_tests').delete().eq('id',test.id);throw qe}
  toast('10 MCQs generated from '+sourceType+' and published successfully');manageLectureTest(lectureId);
 }catch(e){toast(e.message||'Unable to generate test')}
}

async function saveManualLectureTest(lectureId){
 try{
  const {data:l,error:le}=await sb.from('training_lectures').select('id,title,sector_id,admin_reviewed').eq('id',lectureId).single();if(le)throw le;
  const questions=[];
  for(let i=1;i<=10;i++){
   const q=document.getElementById('mq_'+i)?.value.trim();
   const opts=[1,2,3,4].map(n=>document.getElementById('ma_'+i+'_'+n)?.value.trim());
   const correct=document.getElementById('mc_'+i)?.value;
   if(!q||opts.some(x=>!x)||!correct)throw Error('Please complete Question '+i+' with all 4 options and the correct answer.');
   questions.push({question_text:q,options:opts,correct_answer:opts[Number(correct)-1],sequence_no:i});
  }
  const {data:old}=await sb.from('final_tests').select('id').eq('lecture_id',lectureId).eq('is_active',true).maybeSingle();
  if(old){await sb.from('final_tests').update({is_active:false}).eq('id',old.id);}
  const {data:test,error:te}=await sb.from('final_tests').insert({title:'Test: '+l.title,lecture_id:lectureId,sector_id:l.sector_id,duration_minutes:10,pass_percentage:60,total_marks:10,is_active:false,admin_reviewed:false,admin_reviewed_at:null,admin_reviewed_by:null,created_by:state.user.id}).select('id').single();if(te)throw te;
  const {error:qe}=await sb.from('final_test_questions').insert(questions.map(x=>({...x,test_id:test.id,question_type:'mcq',marks:1,is_active:true})));
  if(qe){await sb.from('final_tests').delete().eq('id',test.id);throw qe;}
  toast('Manual 10-question test published successfully');manageLectureTest(lectureId);
 }catch(e){toast(e.message||'Unable to publish manual test')}
}

  const testIds=(tests||[]).map(x=>x.id);
  const {data:attempts}=testIds.length?await sb.from('final_test_attempts').select('id,test_id,score,percentage,passed,status,submitted_at,started_at').eq('student_id',state.user.id).in('test_id',testIds).order('started_at',{ascending:false}):{data:[]};
  const pm=new Map((progress||[]).map(x=>[x.lecture_id,x])),tm=new Map((tests||[]).map(x=>[x.lecture_id,x])),latest=new Map();
  for(const a of (attempts||[])){if(!latest.has(a.test_id))latest.set(a.test_id,a);}
  let html=head('My Tests','Lecture-wise tests, attempts and results')+'<div class="card"><div class="alert">Each lecture has a separate 10-question test. Pass the test to unlock the next lecture.</div><div class="table-wrap"><table class="table"><thead><tr><th>Lecture</th><th>Test</th><th>Lecture Status</th><th>Test Status</th><th>Score</th><th>Action</th></tr></thead><tbody>';
  for(const l of (lectures||[])){
   const p=pm.get(l.id),t=tm.get(l.id),a=t?latest.get(t.id):null;
   const passed=!!a?.passed, completed=!!p?.completed_at;
   let status=!t?'Not Published':passed?'Passed':a?'Not Passed':completed?'Available':'Locked';
   let action=!t?'—':passed?'<span class="muted">Completed</span>':completed?'<button class="btn btn-primary" onclick="openLectureTest(\''+t.id+'\',\''+l.id+'\')">'+(a?'Retry Test':'Start Test')+'</button>':'<span class="muted">Complete lecture first</span>';
   html+='<tr><td><b>Lecture '+esc(String(l.sequence_no||''))+'</b><br>'+esc(l.title)+'</td><td>'+esc(t?.title||'—')+'</td><td><span class="badge '+(completed?'green':'orange')+'">'+(completed?'Completed':'Pending')+'</span></td><td><span class="badge '+(passed?'green':status==='Available'?'orange':'')+'">'+status+'</span></td><td>'+(a?.submitted_at?(esc(String(a.score||0))+'/'+esc(String(t.total_marks||10))+' · '+esc(String(a.percentage||0))+'%'):'—')+'</td><td>'+action+'</td></tr>';
  }
  html+='</tbody></table></div></div>';
  document.getElementById('main').innerHTML=html;
 }catch(e){
  document.getElementById('main').innerHTML=head('My Tests','Lecture-wise tests and results')+'<div class="card alert">'+esc(e.message||'Unable to load tests.')+'</div>';
 }
}
async function openLectureTest(testId,lectureId){
 state.activeLectureTest={testId,lectureId};
 go('lecture-test');
}
async function lectureTestPage(){
 const testId=state.activeLectureTest?.testId;
 const lectureId=state.activeLectureTest?.lectureId;
 if(!testId){go('tests');return;}
 try{
  const {data:test,error:te}=await sb.from('final_tests').select('*').eq('id',testId).eq('is_active',true).single();if(te)throw te;
  const {data:q,error:qe}=await sb.from('final_test_questions').select('id,question_text,options,marks,sequence_no').eq('test_id',testId).eq('is_active',true).order('sequence_no');if(qe)throw qe;
  if(!q||q.length!==10)throw Error('This test is not ready yet. Admin must publish exactly 10 questions.');
  const {data:i,error:ie}=await sb.from('internships').select('id').eq('student_id',state.user.id).in('status',['active','completed']).order('created_at',{ascending:false}).limit(1).single();if(ie)throw ie;
  const {data:attempt,error:ae}=await sb.from('final_test_attempts').insert({test_id:testId,internship_id:i.id,student_id:state.user.id,status:'started'}).select('id').single();if(ae)throw ae;
  document.getElementById('main').innerHTML=head('Lecture Test',esc(test.title)+' · 10 Questions · '+esc(String(test.pass_percentage||60))+'% to pass')+
  '<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><b>Test Instructions</b><div class="muted">Answer all 10 questions. Your result will be calculated automatically.</div></div><span class="badge orange">10 Marks</span></div><form id="lectureTestForm" style="margin-top:12px">'+
  q.map((x,idx)=>'<div class="card" style="margin-top:12px"><b>Q'+(idx+1)+'. '+esc(x.question_text)+'</b><div style="margin-top:10px">'+(Array.isArray(x.options)?x.options:[]).map((o,oi)=>'<label style="display:block;padding:10px;border:1px solid #e5e7eb;border-radius:9px;margin:7px 0;cursor:pointer"><input type="radio" name="q_'+x.id+'" value="'+esc(o).replace(/"/g,'&quot;')+'" required> <b>'+String.fromCharCode(65+oi)+'.</b> '+esc(o)+'</label>').join('')+'</div></div>').join('')+
  '</form><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px"><button class="btn btn-primary" onclick="submitLectureTest(\''+testId+'\',\''+attempt.id+'\')">Submit Test</button><button class="btn btn-soft" onclick="go(\'tests\')">Back to My Tests</button></div></div>';
 }catch(e){toast(e.message||'Unable to start test');go('tests');}
}

login();
boot();
