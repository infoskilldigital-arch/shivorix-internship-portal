let user=null,profile=null,section='dashboard';

async function dashboard(){const [st,ap,co,no,pa,pr]=await Promise.all([sb.from('profiles').select('id',{count:'exact',head:true}).eq('role','student'),sb.from('internship_applications').select('id',{count:'exact',head:true}),sb.from('colleges').select('id',{count:'exact',head:true}),sb.from('node_officers').select('id',{count:'exact',head:true}),sb.from('payments').select('id',{count:'exact',head:true}).eq('status','success'),sb.from('projects').select('id',{count:'exact',head:true})]);document.getElementById('content').innerHTML='<div class="cards"><div class="stat">Students<b>'+ (st.count??0)+'</b></div><div class="stat">Applications<b>'+ (ap.count??0)+'</b></div><div class="stat">Colleges<b>'+ (co.count??0)+'</b></div><div class="stat">Node Officers<b>'+ (no.count??0)+'</b></div></div><div class="grid2"><div class="panel"><h3>Operations</h3><p class="muted">Manage the complete internship lifecycle from one Admin portal.</p><div class="actions"><button class="btn primary" onclick="go(\'training\')">Manage Lectures</button><button class="btn orange" onclick="go(\'assignments\')">Create Assignment</button><button class="btn soft" onclick="go(\'applications\')">Review Applications</button></div></div><div class="panel"><h3>Completion Pipeline</h3><p>Training → Activities → Assignments → Project & Report → Evaluation → Certificate</p><p class="muted">Successful payments: '+(pa.count??0)+' · Projects: '+(pr.count??0)+'</p></div></div>'}

async function colleges(){const q=await sb.from('colleges').select('*').order('name');if(q.error){document.getElementById('content').innerHTML='<div class="panel"><div class="alert">'+esc(q.error.message)+'</div></div>';return}document.getElementById('content').innerHTML='<div class="grid2"><div class="panel"><h3>Add College</h3><div class="formgrid"><div class="field"><label>Code *</label><input id="ccode"></div><div class="field"><label>Name *</label><input id="cname"></div><div class="field"><label>University</label><input id="cuniv"></div><div class="field"><label>City</label><input id="ccity"></div></div><button class="btn primary" onclick="addCollege()">Create College</button></div><div class="panel"><h3>College Network</h3><div class="tablewrap"><table class="table"><thead><tr><th>Code</th><th>Name</th><th>University</th><th>City</th><th>Status</th><th>Action</th></tr></thead><tbody>'+(q.data||[]).map(x=>'<tr><td>'+esc(x.code)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.university_name||'')+'</td><td>'+esc(x.city||'')+'</td><td>'+esc(x.is_active?'Active':'Inactive')+'</td><td><button class="btn soft" onclick="editCollege(\''+x.id+'\')">Edit</button></td></tr>').join('')||'<tr><td colspan="6" class="empty">No colleges.</td></tr>'+'</tbody></table></div></div></div>'}async function addCollege(){try{const code=document.getElementById('ccode').value.trim().toUpperCase(),name=document.getElementById('cname').value.trim(),university_name=document.getElementById('cuniv').value.trim()||null,city=document.getElementById('ccity').value.trim()||null;if(!code||!name)throw Error('College code and name are required.');const {data,error}=await sb.from('colleges').insert({code,name,university_name,city,state:'Bihar',is_active:true}).select('*').single();if(error)throw error;toast('College created successfully');colleges()}catch(e){toast(e.message||'Unable to create college')}}async function editCollege(id){try{const {data:row,error}=await sb.from('colleges').select('*').eq('id',id).single();if(error)throw error;const code=prompt('College Code:',row.code);if(code===null)return;const name=prompt('College Name:',row.name);if(name===null)return;const university=prompt('University:',row.university_name||'');if(university===null)return;const city=prompt('City:',row.city||'');if(city===null)return;const active=confirm('Keep this college Active?');const {data,error:e}=await sb.from('colleges').update({code:code.trim().toUpperCase(),name:name.trim(),university_name:university.trim()||null,city:city.trim()||null,is_active:active,updated_at:new Date().toISOString()}).eq('id',id).select('*').single();if(e)throw e;toast('College updated successfully');colleges()}catch(e){toast(e.message||'Unable to update college')}}async function node(){const {data:nd,error:ne}=await sb.functions.invoke('admin-management',{body:{action:'list_node_officers'}});if(ne)throw ne;if(nd?.error)throw Error(nd.error);const q={data:nd.node_officers||[],error:null};const cs=await sb.from('colleges').select('id,name').eq('is_active',true).order('name');if(q.error){document.getElementById('content').innerHTML='<div class="panel"><div class="alert">'+esc(q.error.message)+'</div></div>';return}document.getElementById('content').innerHTML='<div class="grid2"><div class="panel"><h3>Create Node Officer</h3><div class="formgrid"><div class="field"><label>Full Name *</label><input id="nname"></div><div class="field"><label>Official Email *</label><input id="nemail" type="email"></div><div class="field"><label>Temporary Password *</label><input id="npass" type="password"></div><div class="field"><label>Mobile</label><input id="nmobile"></div><div class="field"><label>Officer Code *</label><input id="ncode"></div><div class="field"><label>Assigned College *</label><select id="ncollege">'+(cs.data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></div></div><button class="btn primary" onclick="createNode()">Create Node Officer</button></div><div class="panel"><h3>Assigned Officers</h3><div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>College</th><th>Code</th><th>Status</th><th>Action</th></tr></thead><tbody>'+(q.data||[]).map(x=>'<tr><td>'+esc(x.profiles?.full_name||'')+'</td><td>'+esc(x.profiles?.email||'')+'</td><td>'+esc(x.college_name||'')+'</td><td>'+esc(x.node_code||'')+'</td><td>'+esc(x.is_active?'Active':'Inactive')+'</td><td><button class="btn soft" onclick="editNode(\''+x.id+'\')">Edit</button> <button class="btn soft" onclick="resetNodePassword(\''+x.id+'\')">Reset Password</button></td></tr>').join('')||'<tr><td colspan="6" class="empty">No Node Officers.</td></tr>'+'</tbody></table></div></div></div>'}async function createNode(){try{const full_name=document.getElementById('nname').value.trim(),email=document.getElementById('nemail').value.trim(),password=document.getElementById('npass').value,node_officer_code=document.getElementById('ncode').value.trim(),college_id=document.getElementById('ncollege').value;if(!full_name||!email||!password||!node_officer_code||!college_id)throw Error('Name, email, password, officer code and college are required.');if(password.length<8)throw Error('Temporary password must be at least 8 characters.');const {data,error}=await sb.functions.invoke('admin-management',{body:{action:'create_staff',role:'node_officer',full_name,email,password,mobile:document.getElementById('nmobile').value.trim(),node_officer_code,college_id}});if(error)throw error;if(data?.error)throw Error(data.error);toast('Node Officer created successfully');node()}catch(e){toast(e.message||'Unable to create Node Officer')}}async function editNode(id){try{const {data:row,error}=await sb.from('node_officers').select('*,profiles(full_name,email)').eq('id',id).single();if(error)throw error;const full_name=prompt('Full Name:',row.profiles?.full_name||'');if(full_name===null)return;const code=prompt('Node Officer Code:',row.node_code||'');if(code===null)return;const mobile=prompt('Mobile:',row.mobile||'');if(mobile===null)return;const cs=await sb.from('colleges').select('id,name').eq('is_active',true).order('name');if(cs.error)throw cs.error;const options=(cs.data||[]).map(x=>x.name+' = '+x.id).join('\n');const selected=prompt('Enter College ID from this list:\n\n'+options,row.college_id||'');if(selected===null)return;if(!cs.data.some(x=>x.id===selected))throw Error('Invalid college ID.');const active=confirm('Keep this Node Officer Active?');const {data,error:e}=await sb.functions.invoke('admin-management',{body:{action:'update_staff',id,full_name,node_officer_code:code,mobile,college_id:selected,is_active:active}});if(e)throw e;if(data?.error)throw Error(data.error);toast('Node Officer updated successfully');node()}catch(e){toast(e.message||'Unable to update Node Officer')}}async function resetNodePassword(id){const password=prompt('New password (minimum 8 characters):');if(password===null)return;if(password.length<8){toast('Password must be at least 8 characters.');return}try{const {data,error}=await sb.functions.invoke('admin-management',{body:{action:'reset_staff_password',id,password}});if(error)throw error;if(data?.error)throw Error(data.error);toast('Node Officer password reset successfully')}catch(e){toast(e.message||'Unable to reset Node Officer password')}}async function training(){const s=await sb.from('internship_sectors').select('id,name').eq('is_active',true).order('name');const q=await sb.from('training_lectures').select('*,internship_sectors(name)').order('sequence_no');document.getElementById('content').innerHTML='<div class="panel"><h3>Lecture Management</h3><p class="muted">Admin-only content control. Upload video to private storage or use an approved video URL.</p><div class="formgrid"><div class="field"><label>Sector</label><select id="lsector">'+(s.data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></div><div class="field"><label>Lecture Title</label><input id="ltitle"></div><div class="field"><label>Sequence</label><input id="lseq" type="number" value="1"></div><div class="field"><label>Duration (seconds)</label><input id="ldur" type="number" value="0"></div><div class="field full"><label>Video URL (recommended for large videos)</label><input id="lurl" placeholder="https://..."></div><div class="field full"><label>Or upload video (max 200 MB)</label><input id="lfile" type="file" accept="video/mp4,video/webm,video/quicktime"></div><div class="field full"><label>Description</label><textarea id="ldesc" rows="3"></textarea></div></div><button class="btn primary" onclick="addLecture()">Publish Lecture</button></div><div class="panel" style="margin-top:16px"><h3>Published Lectures</h3><div class="tablewrap"><table class="table"><thead><tr><th>Title</th><th>Sector</th><th>Duration</th><th>Sequence</th><th>Status</th></tr></thead><tbody>'+(q.data||[]).map(x=>'<tr><td>'+esc(x.title)+'</td><td>'+esc(x.internship_sectors?.name)+'</td><td>'+Math.round((x.duration_seconds||0)/60)+' min</td><td>'+x.sequence_no+'</td><td>'+esc(x.is_active?'Active':'Inactive')+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">No lectures published.</td></tr>'+'</tbody></table></div></div>'}
async function addLecture(){try{const file=document.getElementById('lfile').files[0];if(file&&file.size>200*1024*1024)throw Error('Video exceeds 200 MB.');let url=document.getElementById('lurl').value.trim()||null;if(file){const path='admin/'+crypto.randomUUID()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await sb.storage.from('training-videos').upload(path,file,{contentType:file.type,upsert:false});if(up.error)throw up.error;url='storage:'+path}if(!url)throw Error('Provide a video URL or upload a video.');const {error}=await sb.from('training_lectures').insert({sector_id:document.getElementById('lsector').value,title:document.getElementById('ltitle').value.trim(),description:document.getElementById('ldesc').value.trim()||null,video_url:url,duration_seconds:Number(document.getElementById('ldur').value||0),sequence_no:Number(document.getElementById('lseq').value||1),is_active:true});if(error)throw error;toast('Lecture published');training()}catch(e){toast(e.message||'Unable to publish lecture')}}
async function assignments(){const q=await sb.from('assignments').select('*').order('created_at',{ascending:false});document.getElementById('content').innerHTML='<div class="grid2"><div class="panel"><h3>Create Assignment</h3><div class="field"><label>Title</label><input id="atitle"></div><div class="field"><label>Sector / Domain</label><input id="adomain"></div><div class="field"><label>Description</label><textarea id="adesc" rows="4"></textarea></div><div class="field"><label>Due Date</label><input id="adue" type="date"></div><button class="btn orange" onclick="addAssignment()">Publish Assignment</button></div><div class="panel"><h3>Assignments</h3><div class="tablewrap"><table class="table"><thead><tr><th>Title</th><th>Domain</th><th>Due</th><th>Status</th></tr></thead><tbody>'+(q.data||[]).map(x=>'<tr><td>'+esc(x.title)+'</td><td>'+esc(x.domain)+'</td><td>'+esc(x.due_date||'—')+'</td><td>'+esc(x.is_active?'Active':'Inactive')+'</td></tr>').join('')||'<tr><td colspan="4" class="empty">No assignments.</td></tr>'+'</tbody></table></div></div></div>'}
async function addAssignment(){const title=document.getElementById('atitle').value.trim();if(!title)return toast('Title required.');const {error}=await sb.from('assignments').insert({title,domain:document.getElementById('adomain').value.trim()||null,description:document.getElementById('adesc').value.trim()||null,due_date:document.getElementById('adue').value||null,is_active:true});if(error)toast(error.message);else{toast('Assignment published');assignments()}}

async function reviewAssignment(id){const score=prompt('Score (0-100):','80');if(score===null)return;const status=prompt('Status: approved / returned / rejected','approved')||'approved';const feedback=prompt('Feedback:','')||null;const {error}=await sb.from('assignment_submissions').update({score:Number(score),status:['approved','returned','rejected'].includes(status)?status:'approved',feedback}).eq('id',id);if(error)toast(error.message);else{toast('Review saved');submissions()}}
async function projects(){const q=await sb.from('projects').select('*,profiles(full_name,college_name)').order('submitted_at',{ascending:false});document.getElementById('content').innerHTML='<div class="panel"><h3>Project & Final Report Submissions</h3><div class="tablewrap"><table class="table"><thead><tr><th>Student</th><th>Project</th><th>Project File</th><th>Report</th><th>Status</th><th>Score</th><th>Action</th></tr></thead><tbody>'+(q.data||[]).map(x=>'<tr><td>'+esc(x.profiles?.full_name)+'</td><td>'+esc(x.title)+'</td><td>'+(x.project_file_path?'<button class="btn soft" onclick="openFile(\''+x.project_file_path+'\')">Open</button>':'—')+'</td><td>'+(x.report_file_path?'<button class="btn soft" onclick="openFile(\''+x.report_file_path+'\')">Open</button>':'—')+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.score??'—')+'</td><td><button class="btn soft" onclick="reviewProject(\''+x.id+'\')">Review</button></td></tr>').join('')||'<tr><td colspan="7" class="empty">No projects.</td></tr>'+'</tbody></table></div></div>'}
async function reviewProject(id){const score=prompt('Score (0-100):','80');if(score===null)return;const status=prompt('Status: approved / returned / rejected','approved')||'approved';const feedback=prompt('Feedback:','')||null;const {error}=await sb.from('projects').update({score:Number(score),status:['approved','returned','rejected'].includes(status)?status:'approved',feedback}).eq('id',id);if(error)toast(error.message);else{toast('Review saved');projects()}}
async function payments(){const q=await sb.from('payments').select('*,profiles(full_name,college_name),internship_applications(application_number,status)').order('created_at',{ascending:false});document.getElementById('content').innerHTML='<div class="panel"><h3>Payments</h3><div class="tablewrap"><table class="table"><thead><tr><th>Student</th><th>Application</th><th>Amount</th><th>Provider</th><th>Status</th></tr></thead><tbody>'+(q.data||[]).map(x=>'<tr><td>'+esc(x.profiles?.full_name)+'</td><td>'+esc(x.internship_applications?.application_number)+'</td><td>₹'+Number(x.amount||0).toLocaleString('en-IN')+'</td><td>'+esc(x.provider)+'</td><td>'+esc(x.status)+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">No payments.</td></tr>'+'</tbody></table></div></div>'}
async function certificates(){const q=await sb.from('certificates').select('*,profiles(full_name)').order('issued_at',{ascending:false});document.getElementById('content').innerHTML='<div class="panel"><h3>Certificates</h3><div class="tablewrap"><table class="table"><thead><tr><th>Student</th><th>Certificate</th><th>Issued</th><th>Status</th></tr></thead><tbody>'+(q.data||[]).map(x=>'<tr><td>'+esc(x.profiles?.full_name)+'</td><td>'+esc(x.certificate_number||x.id)+'</td><td>'+esc(x.issued_at||'—')+'</td><td>'+esc(x.status||'issued')+'</td></tr>').join('')||'<tr><td colspan="4" class="empty">No certificates.</td></tr>'+'</tbody></table></div></div>'}
async function reports(){document.getElementById('content').innerHTML='<div class="cards"><div class="stat">Operational Reports<b>Ready</b></div><div class="stat">Data Source<b>Live</b></div><div class="stat">Access<b>Admin</b></div><div class="stat">Security<b>RLS</b></div></div><div class="panel" style="margin-top:16px"><h3>Admin Reporting</h3><p class="muted">Student, application, payment, training, assignment, project and certificate reporting can be expanded here without changing the underlying portal data.</p></div>'}
async function settings(){document.getElementById('content').innerHTML='<div class="panel"><h3>Portal Settings</h3><p class="muted">Production settings are controlled through the secure backend. Live payment credentials, email provider and domain configuration should be added before public launch.</p></div>'}
sb.auth.getSession().then(({data})=>{if(data.session){sb.from('profiles').select('*').eq('id',data.session.user.id).maybeSingle().then(({data:p})=>{if(p?.role==='admin'){user=data.session.user;profile=p;document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('who').textContent=p.full_name||user.email;go('dashboard')}})}})
</script></body></html>
