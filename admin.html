async function createFinalTest(){
 try{
  const title=document.getElementById('fttitle').value.trim();if(!title)throw Error('Test title is required.');
  const {error}=await sb.from('final_tests').insert({title,sector_id:document.getElementById('ftsector').value,duration_minutes:Number(document.getElementById('ftduration').value||60),pass_percentage:Number(document.getElementById('ftpass').value||40),total_marks:Number(document.getElementById('ftmarks').value||100),created_by:user.id,is_active:false});if(error)throw error;
  toast('Final Test created as Draft');finaltests();
 }catch(e){toast(e.message||'Unable to create test')}
}
async function addFinalQuestion(){
 try{
  const textv=document.getElementById('fqtext').value.trim();if(!textv)throw Error('Question is required.');
  const type=document.getElementById('fqtype').value;let options=null;
  if(type==='mcq'){options=document.getElementById('fqoptions').value.split('\n').map(x=>x.trim()).filter(Boolean);if(options.length<2)throw Error('MCQ needs at least two options.')}
  const {error}=await sb.from('final_test_questions').insert({test_id:document.getElementById('fqtest').value,question_text:textv,question_type:type,options,correct_answer:document.getElementById('fqcorrect').value.trim()||null,marks:Number(document.getElementById('fqmarks').value||1),sequence_no:Number(document.getElementById('fqseq').value||1),is_active:true});if(error)throw error;
  toast('Question added');finaltests();
 }catch(e){toast(e.message||'Unable to add question')}
}
async function showFinalQuestions(testId){
 const q=await sb.from('final_test_questions').select('*').eq('test_id',testId).order('sequence_no');if(q.error)return toast(q.error.message);
 document.getElementById('content').innerHTML='<div class="panel"><button class="btn soft" onclick="finaltests()">← Back</button><h3 style="margin-top:16px">Questions</h3><div class="tablewrap"><table class="table"><thead><tr><th>#</th><th>Question</th><th>Type</th><th>Marks</th><th>Answer</th></tr></thead><tbody>'+((q.data||[]).map(x=>'<tr><td>'+x.sequence_no+'</td><td>'+esc(x.question_text)+'</td><td>'+esc(x.question_type)+'</td><td>'+x.marks+'</td><td>'+esc(x.correct_answer||'—')+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">No questions.</td></tr>')+'</tbody></table></div></div>';
}
async function toggleFinalTest(id,active){
 const {data:row,error:re}=await sb.from('final_tests').select('id').eq('id',id).single();if(re)return toast(re.message);
 if(active){
  const {count}=await sb.from('final_test_questions').select('id',{count:'exact',head:true}).eq('test_id',id).eq('is_active',true);if(!count) return toast('Add at least one question before publishing.');
 }
 const {error}=await sb.from('final_tests').update({is_active:active,updated_at:new Date().toISOString()}).eq('id',row.id);if(error)toast(error.message);else{toast(active?'Final Test published':'Final Test unpublished');finaltests()}
}
